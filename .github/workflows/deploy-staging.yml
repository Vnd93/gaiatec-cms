name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: SHA completo ou ref contido em main para staging
        required: true
        default: main
      rollback_ref:
        description: SHA completo do frontend atualmente aprovado para provar compatibilidade de rollback
        required: true
      frontend_bridge_run_id:
        description: >-
          Run que promoveu o mesmo SHA A ao alias staging sobre o backend anterior. Exigido pelo run
          canonico; o passe de diagnostico nao o usa, porque nao publica nem sela nada.
        required: false
      ev2_draft_v2_candidate:
        description: Habilitar somente o adapter cliente candidato EV2.2
        required: true
        type: boolean
        default: false
      diagnostic_run:
        description: >-
          Passe de diagnostico. Colhe todas as falhas em uma passada, nao muta staging fora de
          fixtures sinteticas, nao sela artefato, nao publica, nao emite evidencia.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    # Passe de diagnostico e run canonico sao mutuamente exclusivos. A proibicao da secao 4.2 da
    # instrucao de otimizacao fica estrutural: em diagnostico este job inteiro nao existe, entao
    # nenhum step de selo, publicacao, promocao ou evidencia pode ser alcancado por engano.
    if: ${{ !inputs.diagnostic_run }}
    needs: [preflight, validate_source, validate_live_baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: staging
    outputs:
      state_artifact_id: ${{ steps.staging_state_artifact.outputs.artifact-id }}
      state_artifact_digest: ${{ steps.staging_state_artifact.outputs.artifact-digest }}
      recovery_artifact_id: ${{ steps.staging_recovery_artifact.outputs.artifact-id }}
      recovery_artifact_digest: ${{ steps.staging_recovery_artifact.outputs.artifact-digest }}
      candidate_artifact_id: ${{ steps.staging_candidate_artifact.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.staging_candidate_artifact.outputs.artifact-digest }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      rollback_sha: ${{ inputs.rollback_ref }}
      run_marker: ${{ steps.staging_state.outputs.run_marker }}
      mutation_armed: ${{ steps.staging_mutation_boundary.outputs.armed }}
      mutation_boundary_outcome: ${{ steps.staging_mutation_boundary.outcome }}
      evidence_artifact_id: ${{ steps.staging_evidence_artifact.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.staging_evidence_artifact.outputs.artifact-digest }}
      release_profile: ${{ steps.frontend_bridge.outputs.release_profile }}
      matrix_sha256: ${{ steps.frontend_bridge.outputs.matrix_sha256 }}
      policy_sha256: ${{ steps.frontend_bridge.outputs.policy_sha256 }}
      source_ci_run_id: ${{ steps.frontend_source.outputs.source_run_id }}
      gate_ci_run_attempt: ${{ steps.frontend_source.outputs.gate_run_attempt }}
      source_ci_run_attempt: ${{ steps.frontend_source.outputs.source_run_attempt }}
      source_artifact_name: ${{ steps.frontend_source.outputs.artifact_name }}
      source_artifact_id: ${{ steps.frontend_source.outputs.artifact_id }}
      source_artifact_digest: ${{ steps.frontend_source.outputs.artifact_digest }}
      archive_sha256: ${{ steps.frontend_package.outputs.archive_sha256 }}
      tree_sha256: ${{ steps.frontend_package.outputs.tree_sha256 }}
      bridge_run_attempt: ${{ steps.frontend_bridge_run.outputs.run_attempt }}
      bridge_control_sha: ${{ steps.frontend_bridge_run.outputs.control_sha }}
      canonical_deployment_id: ${{ steps.staging_bridge_deployment.outputs.deployment_id }}
      browser_run_tag: ${{ steps.staging_state.outputs.browser_run_tag }}
    steps:
      - name: Validate staging dispatch branch before any mutation
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FRONTEND_BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
          EV2_DRAFT_V2_CANDIDATE: ${{ inputs.ev2_draft_v2_candidate }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "${DISPATCH_ACTOR,,}" = vnd93
          test "${TRIGGERING_ACTOR,,}" = vnd93
          # `grep` de string vazia devolve string vazia, entao a comparacao sozinha aceitaria um
          # valor ausente. O run canonico exige a ponte: a ausencia tem de reprovar aqui.
          test -n "$FRONTEND_BRIDGE_RUN_ID"
          test "$(printf '%s' "$FRONTEND_BRIDGE_RUN_ID" | grep -E '^[1-9][0-9]*$')" = "$FRONTEND_BRIDGE_RUN_ID"
          test "$EV2_DRAFT_V2_CANDIDATE" = false
      - name: Checkout the trusted staging control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Checkout exact staging candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout approved rollback frontend baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.rollback_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: baseline
      - name: Use the repository-pinned Node runtime for staging controls
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Resolve and verify the exact staging candidate
        id: candidate
        working-directory: control
        env:
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          candidate_sha="$(git -C ../candidate rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git rev-parse origin/main)" = "$CONTROL_SHA"
          git merge-base --is-ancestor "$candidate_sha" origin/main
          test "$(printf '%s' "$ROLLBACK_REF" | grep -E '^[a-f0-9]{40}$')" = "$ROLLBACK_REF"
          test "$(git -C ../baseline rev-parse HEAD)" = "$ROLLBACK_REF"
          git merge-base --is-ancestor "$ROLLBACK_REF" "$candidate_sha"
          test "$ROLLBACK_REF" = "$candidate_sha"
          test -z "$(git status --porcelain)"
          test -z "$(git -C ../candidate status --porcelain)"
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Download immutable quick-preflight evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-preflight
      - name: Reverify the quick preflight binding before consuming parallel gates
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EXPECTED_ROLLBACK_SHA: ${{ inputs.rollback_ref }}
          EXPECTED_BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
          EXPECTED_CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$EXPECTED_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$EXPECTED_ARTIFACT_ID"
          test "$(printf '%s' "$EXPECTED_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$EXPECTED_ARTIFACT_DIGEST"
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const evidence = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/g12-staging-preflight/staging-preflight.json`, "utf8"),
          );
          const exactKeys = (value, keys) =>
            value &&
            typeof value === "object" &&
            !Array.isArray(value) &&
            JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());
          if (
            !exactKeys(evidence, [
              "schemaVersion",
              "event",
              "runId",
              "runAttempt",
              "controlSha",
              "candidateSha",
              "rollbackSha",
              "frontendBridgeRunId",
            ]) ||
            evidence.schemaVersion !== 1 ||
            evidence.event !== "g12.staging.preflight.passed" ||
            evidence.runId !== process.env.GITHUB_RUN_ID ||
            evidence.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            evidence.controlSha !== process.env.EXPECTED_CONTROL_SHA ||
            evidence.candidateSha !== process.env.EXPECTED_CANDIDATE_SHA ||
            evidence.rollbackSha !== process.env.EXPECTED_ROLLBACK_SHA ||
            evidence.frontendBridgeRunId !== process.env.EXPECTED_BRIDGE_RUN_ID
          ) {
            throw new Error("G12_STAGING_PREFLIGHT_BINDING_INVALID");
          }
          NODE
      - name: Download immutable source validation by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate_source.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-source-validation
      - name: Reverify and materialize the source validation handoff
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.validate_source.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.validate_source.outputs.artifact_digest }}
          EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EXPECTED_ROLLBACK_SHA: ${{ inputs.rollback_ref }}
          EXPECTED_CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$EXPECTED_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$EXPECTED_ARTIFACT_ID"
          test "$(printf '%s' "$EXPECTED_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$EXPECTED_ARTIFACT_DIGEST"
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const root = `${process.env.RUNNER_TEMP}/g12-staging-source-validation`;
          const manifest = JSON.parse(readFileSync(`${root}/source-validation.json`, "utf8"));
          const names = [
            "g12-cms-coverage-matrix.json",
            "g12-backend-compatibility.json",
            "cms-coverage-rollback.json",
          ];
          const exactKeys = (value, keys) =>
            value &&
            typeof value === "object" &&
            !Array.isArray(value) &&
            JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());
          if (
            !exactKeys(manifest, [
              "schemaVersion",
              "event",
              "runId",
              "runAttempt",
              "controlSha",
              "candidateSha",
              "rollbackSha",
              "checks",
              "files",
            ]) ||
            manifest.schemaVersion !== 1 ||
            manifest.event !== "g12.staging.source_validation.passed" ||
            manifest.runId !== process.env.GITHUB_RUN_ID ||
            manifest.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            manifest.controlSha !== process.env.EXPECTED_CONTROL_SHA ||
            manifest.candidateSha !== process.env.EXPECTED_CANDIDATE_SHA ||
            manifest.rollbackSha !== process.env.EXPECTED_ROLLBACK_SHA ||
            !exactKeys(manifest.checks, ["lockedInstall", "auditHigh", "coverage", "compatibility"]) ||
            Object.values(manifest.checks).some((value) => value !== true) ||
            !exactKeys(manifest.files, names)
          ) {
            throw new Error("G12_STAGING_SOURCE_VALIDATION_BINDING_INVALID");
          }
          for (const name of names) {
            const contents = readFileSync(`${root}/${name}`);
            const digest = createHash("sha256").update(contents).digest("hex");
            if (manifest.files[name] !== digest) {
              throw new Error("G12_STAGING_SOURCE_VALIDATION_DIGEST_MISMATCH");
            }
          }
          NODE
          mkdir -p candidate/outputs baseline/outputs
          cp "$RUNNER_TEMP/g12-staging-source-validation/g12-cms-coverage-matrix.json" \
            candidate/outputs/g12-cms-coverage-matrix.json
          cp "$RUNNER_TEMP/g12-staging-source-validation/g12-backend-compatibility.json" \
            candidate/outputs/g12-backend-compatibility.json
          cp "$RUNNER_TEMP/g12-staging-source-validation/cms-coverage-rollback.json" \
            baseline/outputs/cms-coverage-rollback.json
      - name: Download immutable read-only live-baseline validation by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate_live_baseline.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-live-validation
      - name: Reverify the read-only live-baseline handoff
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.validate_live_baseline.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.validate_live_baseline.outputs.artifact_digest }}
          EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EXPECTED_ROLLBACK_SHA: ${{ inputs.rollback_ref }}
          EXPECTED_CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$EXPECTED_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$EXPECTED_ARTIFACT_ID"
          test "$(printf '%s' "$EXPECTED_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$EXPECTED_ARTIFACT_DIGEST"
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const root = `${process.env.RUNNER_TEMP}/g12-staging-live-validation`;
          const manifest = JSON.parse(readFileSync(`${root}/live-baseline-validation.json`, "utf8"));
          const names = ["live-baseline-probe.json", "remote-environment-snapshot.json"];
          const exactKeys = (value, keys) =>
            value &&
            typeof value === "object" &&
            !Array.isArray(value) &&
            JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());
          if (
            !exactKeys(manifest, [
              "schemaVersion",
              "event",
              "runId",
              "runAttempt",
              "controlSha",
              "candidateSha",
              "rollbackSha",
              "live",
              "checks",
              "files",
            ]) ||
            manifest.schemaVersion !== 1 ||
            manifest.event !== "g12.staging.live_baseline_validation.passed" ||
            manifest.runId !== process.env.GITHUB_RUN_ID ||
            manifest.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            manifest.controlSha !== process.env.EXPECTED_CONTROL_SHA ||
            manifest.candidateSha !== process.env.EXPECTED_CANDIDATE_SHA ||
            manifest.rollbackSha !== process.env.EXPECTED_ROLLBACK_SHA ||
            !exactKeys(manifest.checks, ["aliasProbe", "pagesState", "environmentSnapshot"]) ||
            Object.values(manifest.checks).some((value) => value !== true) ||
            !exactKeys(manifest.files, names) ||
            !exactKeys(manifest.live, ["deploymentId", "release", "createdOn", "commitMessageB64"]) ||
            manifest.live.release !== process.env.EXPECTED_ROLLBACK_SHA
          ) {
            throw new Error("G12_STAGING_LIVE_VALIDATION_BINDING_INVALID");
          }
          for (const name of names) {
            const digest = createHash("sha256")
              .update(readFileSync(`${root}/${name}`))
              .digest("hex");
            if (manifest.files[name] !== digest) {
              throw new Error("G12_STAGING_LIVE_VALIDATION_DIGEST_MISMATCH");
            }
          }
          NODE
      - name: Resolve exact successful staging frontend bridge run
        id: frontend_bridge_run
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRONTEND_BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: >-
          node scripts/ev2/phase12/verify-staging-frontend-bridge-run.mjs
          --run-id "$FRONTEND_BRIDGE_RUN_ID"
          --expected-release "${{ steps.candidate.outputs.sha }}"
      - name: Verify protected CI for the trusted staging control revision
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: node scripts/ev2/phase12/check-github-controls.mjs
      - name: Download immutable staging frontend bridge evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.frontend_bridge_run.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ inputs.frontend_bridge_run_id }}
          path: ${{ runner.temp }}/g12-staging-frontend-bridge
      - name: Verify compatibility-only staging bridge evidence for this exact SHA
        id: frontend_bridge
        working-directory: control
        env:
          EXPECTED_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.frontend_bridge_run.outputs.run_attempt }}
          EXPECTED_CONTROL_SHA: ${{ steps.frontend_bridge_run.outputs.control_sha }}
          EXPECTED_RELEASE: ${{ steps.candidate.outputs.sha }}
        run: >-
          node scripts/ev2/phase12/verify-staging-frontend-bridge-evidence.mjs
          --artifact-dir "$RUNNER_TEMP/g12-staging-frontend-bridge"
      - name: Resolve the exact CI package attested by the staging bridge
        id: frontend_source
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ev2/phase12/resolve-ci-staging-frontend-artifact.mjs
          --run-id "${{ steps.frontend_bridge.outputs.source_run_id }}"
          --run-attempt "${{ steps.frontend_bridge.outputs.source_run_attempt }}"
          --gate-run-attempt "${{ steps.frontend_bridge.outputs.gate_run_attempt }}"
          --sha "${{ steps.candidate.outputs.sha }}"
      - name: Bind resolved CI package metadata to immutable bridge evidence
        env:
          RESOLVED_ID: ${{ steps.frontend_source.outputs.artifact_id }}
          RESOLVED_DIGEST: ${{ steps.frontend_source.outputs.artifact_digest }}
          RESOLVED_NAME: ${{ steps.frontend_source.outputs.artifact_name }}
          ATTESTED_ID: ${{ steps.frontend_bridge.outputs.artifact_id }}
          ATTESTED_DIGEST: ${{ steps.frontend_bridge.outputs.artifact_digest }}
          ATTESTED_NAME: ${{ steps.frontend_bridge.outputs.artifact_name }}
          RESOLVED_GATE_ATTEMPT: ${{ steps.frontend_source.outputs.gate_run_attempt }}
          ATTESTED_GATE_ATTEMPT: ${{ steps.frontend_bridge.outputs.gate_run_attempt }}
        run: |
          set -euo pipefail
          test "$RESOLVED_ID" = "$ATTESTED_ID"
          test "$RESOLVED_DIGEST" = "$ATTESTED_DIGEST"
          test "$RESOLVED_NAME" = "$ATTESTED_NAME"
          test "$RESOLVED_GATE_ATTEMPT" = "$ATTESTED_GATE_ATTEMPT"
      - name: Download the exact CI-sealed staging package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.frontend_source.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.frontend_source.outputs.source_run_id }}
          path: ${{ runner.temp }}/g12-staging-release-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Verify the unified release package before any candidate mutation
        id: release_package
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-staging-release-package.mjs
          --package "$RUNNER_TEMP/g12-staging-release-package"
          --candidate "${{ steps.candidate.outputs.sha }}"
          --profile "${{ steps.frontend_bridge.outputs.release_profile }}"
          --run-id "${{ steps.frontend_source.outputs.source_run_id }}"
          --run-attempt "${{ steps.frontend_source.outputs.source_run_attempt }}"
      - name: Materialize the exact database payload only for database mutation profiles
        id: database_payload
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'database-auth' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: control
        env:
          RELEASE_PROFILE: ${{ steps.frontend_bridge.outputs.release_profile }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/g12-staging-release-package/staging-release-package.json"
          test "$(jq -er '.components.database.files | length' "$manifest")" = 1
          payload_name="$(jq -er '.components.database.files[0].path' "$manifest")"
          payload_sha256="$(jq -er '.components.database.files[0].sha256' "$manifest")"
          expected_name="database-release-staging-${CANDIDATE_SHA}-${RELEASE_PROFILE}.g12db"
          test "$payload_name" = "$expected_name"
          test "$(printf '%s' "$payload_sha256" | grep -E '^[a-f0-9]{64}$')" = "$payload_sha256"
          node scripts/ev2/phase12/verify-database-release-payload.mjs \
            --payload "$RUNNER_TEMP/g12-staging-release-package/database/$payload_name" \
            --output "$RUNNER_TEMP/g12-staging-database-project" \
            --candidate "$CANDIDATE_SHA" \
            --environment staging \
            --profile "$RELEASE_PROFILE" \
            --expected-payload-sha256 "$payload_sha256"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Install the exact candidate from the validated lockfile
        working-directory: candidate
        run: npm ci
      - name: Materialize and independently verify the exact candidate package
        id: frontend_package
        working-directory: control
        env:
          VITE_RELEASE: ${{ steps.candidate.outputs.sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_STAGING_SITE_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
          VITE_CONTACT_CAPTCHA_ALWAYS: "true"
          VITE_EV2_DRAFT_V2_CANDIDATE: "false"
        run: |
          set -euo pipefail
          test ! -e ../candidate/dist
          test ! -e ../baseline/dist
          node scripts/ev2/phase12/verify-staging-frontend-package.mjs \
            --package "$RUNNER_TEMP/g12-staging-release-package/frontend" \
            --output ../candidate/dist \
            --candidate "${{ steps.candidate.outputs.sha }}" \
            --run-id "${{ steps.frontend_source.outputs.source_run_id }}" \
            --run-attempt "${{ steps.frontend_source.outputs.source_run_attempt }}"
          node scripts/ev2/phase12/verify-staging-frontend-package.mjs \
            --package "$RUNNER_TEMP/g12-staging-release-package/frontend" \
            --output ../baseline/dist \
            --candidate "${{ steps.candidate.outputs.sha }}" \
            --run-id "${{ steps.frontend_source.outputs.source_run_id }}" \
            --run-attempt "${{ steps.frontend_source.outputs.source_run_attempt }}"
          mkdir -p ../candidate/outputs ../baseline/outputs
          cp "$RUNNER_TEMP/g12-staging-release-package/frontend/staging-frontend-dist.tar" \
            ../candidate/outputs/staging-frontend-dist.tar
          cp "$RUNNER_TEMP/g12-staging-release-package/frontend/staging-frontend-dist-seal.json" \
            ../candidate/outputs/staging-frontend-dist-seal.json
          cp "$RUNNER_TEMP/g12-staging-release-package/frontend/staging-frontend-provenance.json" \
            ../candidate/outputs/staging-frontend-provenance.json
          cp "$RUNNER_TEMP/g12-staging-release-package/frontend/staging-frontend-dist.tar" \
            ../baseline/outputs/staging-frontend-dist.tar
          cp "$RUNNER_TEMP/g12-staging-release-package/frontend/staging-frontend-dist-seal.json" \
            ../baseline/outputs/staging-baseline-dist-seal.json
          cp "$RUNNER_TEMP/g12-staging-release-package/frontend/staging-frontend-provenance.json" \
            ../baseline/outputs/staging-frontend-provenance.json
      - name: Bind materialized bytes to bridge-v5 evidence
        env:
          ACTUAL_ARCHIVE: ${{ steps.frontend_package.outputs.archive_sha256 }}
          ACTUAL_TREE: ${{ steps.frontend_package.outputs.tree_sha256 }}
          ACTUAL_PROFILE: ${{ steps.frontend_package.outputs.profile_sha256 }}
          ACTUAL_ARCHIVE_BYTES: ${{ steps.frontend_package.outputs.archive_bytes }}
          ACTUAL_FILE_COUNT: ${{ steps.frontend_package.outputs.file_count }}
          ACTUAL_BYTE_COUNT: ${{ steps.frontend_package.outputs.byte_count }}
          ATTESTED_ARCHIVE: ${{ steps.frontend_bridge.outputs.archive_sha256 }}
          ATTESTED_TREE: ${{ steps.frontend_bridge.outputs.tree_sha256 }}
          ATTESTED_PROFILE: ${{ steps.frontend_bridge.outputs.profile_sha256 }}
          ATTESTED_ARCHIVE_BYTES: ${{ steps.frontend_bridge.outputs.archive_bytes }}
          ATTESTED_FILE_COUNT: ${{ steps.frontend_bridge.outputs.file_count }}
          ATTESTED_BYTE_COUNT: ${{ steps.frontend_bridge.outputs.byte_count }}
        run: |
          set -euo pipefail
          test "$ACTUAL_ARCHIVE" = "$ATTESTED_ARCHIVE"
          test "$ACTUAL_TREE" = "$ATTESTED_TREE"
          test "$ACTUAL_PROFILE" = "$ATTESTED_PROFILE"
          test "$ACTUAL_ARCHIVE_BYTES" = "$ATTESTED_ARCHIVE_BYTES"
          test "$ACTUAL_FILE_COUNT" = "$ATTESTED_FILE_COUNT"
          test "$ACTUAL_BYTE_COUNT" = "$ATTESTED_BYTE_COUNT"
      - name: Preserve the exact CI package with an external compatibility handoff manifest
        id: staging_candidate_handoff
        working-directory: control
        env:
          VITE_RELEASE: ${{ steps.candidate.outputs.sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_STAGING_SITE_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
          VITE_CONTACT_CAPTCHA_ALWAYS: "true"
          VITE_EV2_DRAFT_V2_CANDIDATE: "false"
        run: >-
          node scripts/ev2/phase12/write-staging-candidate-handoff.mjs
          --package "$RUNNER_TEMP/g12-staging-release-package/frontend"
          --output "$RUNNER_TEMP/g12-staging-candidate-handoff"
          --candidate "${{ steps.candidate.outputs.sha }}"
          --run-id "${{ steps.frontend_source.outputs.source_run_id }}"
          --run-attempt "${{ steps.frontend_source.outputs.source_run_attempt }}"
      - name: Bind compatibility handoff identity to the verified CI package
        env:
          HANDOFF_ARCHIVE: ${{ steps.staging_candidate_handoff.outputs.archive_sha256 }}
          HANDOFF_TREE: ${{ steps.staging_candidate_handoff.outputs.tree_sha256 }}
          HANDOFF_SEAL: ${{ steps.staging_candidate_handoff.outputs.seal_sha256 }}
          HANDOFF_PROVENANCE: ${{ steps.staging_candidate_handoff.outputs.provenance_sha256 }}
          HANDOFF_PROFILE: ${{ steps.staging_candidate_handoff.outputs.profile_sha256 }}
          HANDOFF_ARCHIVE_BYTES: ${{ steps.staging_candidate_handoff.outputs.archive_bytes }}
          HANDOFF_FILE_COUNT: ${{ steps.staging_candidate_handoff.outputs.file_count }}
          HANDOFF_BYTE_COUNT: ${{ steps.staging_candidate_handoff.outputs.byte_count }}
          PACKAGE_ARCHIVE: ${{ steps.frontend_package.outputs.archive_sha256 }}
          PACKAGE_TREE: ${{ steps.frontend_package.outputs.tree_sha256 }}
          PACKAGE_SEAL: ${{ steps.frontend_package.outputs.seal_sha256 }}
          PACKAGE_PROVENANCE: ${{ steps.frontend_package.outputs.provenance_sha256 }}
          PACKAGE_PROFILE: ${{ steps.frontend_package.outputs.profile_sha256 }}
          PACKAGE_ARCHIVE_BYTES: ${{ steps.frontend_package.outputs.archive_bytes }}
          PACKAGE_FILE_COUNT: ${{ steps.frontend_package.outputs.file_count }}
          PACKAGE_BYTE_COUNT: ${{ steps.frontend_package.outputs.byte_count }}
        run: |
          set -euo pipefail
          test "$HANDOFF_ARCHIVE" = "$PACKAGE_ARCHIVE"
          test "$HANDOFF_TREE" = "$PACKAGE_TREE"
          test "$HANDOFF_SEAL" = "$PACKAGE_SEAL"
          test "$HANDOFF_PROVENANCE" = "$PACKAGE_PROVENANCE"
          test "$HANDOFF_PROFILE" = "$PACKAGE_PROFILE"
          test "$HANDOFF_ARCHIVE_BYTES" = "$PACKAGE_ARCHIVE_BYTES"
          test "$HANDOFF_FILE_COUNT" = "$PACKAGE_FILE_COUNT"
          test "$HANDOFF_BYTE_COUNT" = "$PACKAGE_BYTE_COUNT"
      - name: Verify exact candidate checkout is clean before staging mutation
        working-directory: candidate
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Reconfirm the empty recovery fence immediately before authoritative deploy capture
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs fence
          --owner-kind staging-deploy --require-empty
          --file ../g12-staging-deploy-capture-fence.json
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --control-sha "$GITHUB_SHA"
      - name: Prove the live staging alias matches the approved rollback SHA
        working-directory: candidate
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ inputs.rollback_ref }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          # Redeploying the function inventory leaves every public route cold, which inflates the
          # tail while the p50 stays healthy. Warmup exists to keep that out of the measurement.
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-live-baseline.json
      - name: Capture immutable live staging state before any remote mutation
        id: staging_baseline
        timeout-minutes: 3
        working-directory: candidate
        run: node scripts/ev2/phase12/staging-pages-state.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_EXPECTED_RELEASE: ${{ inputs.rollback_ref }}
      - name: Bind live staging identity to the frontend-only bridge deployment A
        env:
          LIVE_ID: ${{ steps.staging_baseline.outputs.deployment_id }}
          LIVE_RELEASE: ${{ steps.staging_baseline.outputs.release }}
          LIVE_CREATED: ${{ steps.staging_baseline.outputs.created_on }}
          LIVE_MARKER_B64: ${{ steps.staging_baseline.outputs.commit_message_b64 }}
          BRIDGE_ID: ${{ steps.frontend_bridge.outputs.canonical_deployment_id }}
          BRIDGE_RELEASE: ${{ steps.frontend_bridge.outputs.canonical_release }}
          BRIDGE_CREATED: ${{ steps.frontend_bridge.outputs.canonical_created_on }}
          BRIDGE_MARKER_B64: ${{ steps.frontend_bridge.outputs.canonical_commit_message_b64 }}
        run: |
          set -euo pipefail
          test "$LIVE_ID" = "$BRIDGE_ID"
          test "$LIVE_RELEASE" = "$BRIDGE_RELEASE"
          test "$LIVE_CREATED" = "$BRIDGE_CREATED"
          test "$LIVE_MARKER_B64" = "$BRIDGE_MARKER_B64"
      - name: Capture and verify the exact remote staging snapshot before mutation
        id: staging_environment_snapshot
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = glcqsosxwgmlhzgcsnzv
          node ../control/scripts/ev2/phase12/capture-staging-environment-snapshot.mjs \
            --output ../baseline/outputs/staging-remote-environment-snapshot.json \
            --candidate-sha "${{ steps.candidate.outputs.sha }}" \
            --control-sha "${{ github.sha }}" \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            --deployment-id "${{ steps.staging_baseline.outputs.deployment_id }}" \
            --deployment-branch ev2-g17-canary \
            --deployment-commit-sha "${{ steps.staging_baseline.outputs.release }}" \
            --deployment-created-on "${{ steps.staging_baseline.outputs.created_on }}"
          node ../control/scripts/ev2/phase12/verify-staging-environment-snapshot.mjs \
            --snapshot ../baseline/outputs/staging-remote-environment-snapshot.json \
            --candidate-sha "${{ steps.candidate.outputs.sha }}" \
            --control-sha "${{ github.sha }}" \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            --deployment-id "${{ steps.staging_baseline.outputs.deployment_id }}" \
            --deployment-branch ev2-g17-canary \
            --deployment-commit-sha "${{ steps.staging_baseline.outputs.release }}" \
            --deployment-created-on "${{ steps.staging_baseline.outputs.created_on }}"
      - name: Verify the staging recovery bytes before durable upload
        working-directory: candidate
        run: >-
          node ../control/scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist ../baseline/dist
          --seal ../baseline/outputs/staging-baseline-dist-seal.json
          --candidate "${{ inputs.rollback_ref }}"
      - name: Capture and seal the exact live Edge rollback bytes before mutation
        id: staging_edge_baseline
        timeout-minutes: 20
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = glcqsosxwgmlhzgcsnzv
          node ../control/scripts/ev2/phase12/capture-staging-edge-baseline.mjs \
            --output ../baseline/edge-baseline \
            --candidate "${{ steps.candidate.outputs.sha }}" \
            --control-sha "${{ github.sha }}" \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF"
      - name: Upload mandatory sealed staging recovery artifact before mutation
        id: staging_recovery_artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            baseline/dist
            baseline/edge-baseline
            baseline/outputs/staging-frontend-dist.tar
            baseline/outputs/staging-baseline-dist-seal.json
            baseline/outputs/staging-frontend-provenance.json
            baseline/outputs/staging-remote-environment-snapshot.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Prebind the durable browser recovery identity before mutation
        id: browser_recovery_identity
        env:
          CANDIDATE_RELEASE: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$CANDIDATE_RELEASE" | grep -E '^[a-f0-9]{40}$')" = "$CANDIDATE_RELEASE"
          printf 'run_tag=QA-CMS-FINAL-%s-%s\n' \
            "$(date -u +'%Y%m%d')" "${CANDIDATE_RELEASE:0:8}" >> "$GITHUB_OUTPUT"
      - name: Persist credential-free staging recovery state v4 before mutation
        id: staging_state
        working-directory: candidate
        env:
          CONTROL_SHA: ${{ github.sha }}
          CANDIDATE_RELEASE: ${{ steps.candidate.outputs.sha }}
          ORIGINAL_RELEASE: ${{ inputs.rollback_ref }}
          ORIGINAL_DEPLOYMENT_ID: ${{ steps.staging_baseline.outputs.deployment_id }}
          ORIGINAL_CREATED_ON: ${{ steps.staging_baseline.outputs.created_on }}
          ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.staging_baseline.outputs.commit_message_b64 }}
          SOURCE_CI_RUN_ID: ${{ steps.frontend_source.outputs.source_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.frontend_source.outputs.source_run_attempt }}
          GATE_CI_RUN_ATTEMPT: ${{ steps.frontend_source.outputs.gate_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ steps.frontend_source.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.frontend_source.outputs.artifact_digest }}
          SOURCE_ARTIFACT_NAME: ${{ steps.frontend_source.outputs.artifact_name }}
          SOURCE_PROFILE_SHA256: ${{ steps.frontend_package.outputs.profile_sha256 }}
          RECOVERY_ARTIFACT_ID: ${{ steps.staging_recovery_artifact.outputs.artifact-id }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.staging_recovery_artifact.outputs.artifact-digest }}
          RECOVERY_ARTIFACT_NAME: staging-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          BROWSER_RUN_TAG: ${{ steps.browser_recovery_identity.outputs.run_tag }}
        run: |
          set -euo pipefail
          node ../control/scripts/ev2/phase12/write-staging-deploy-recovery-state.mjs \
            --output outputs/staging-deploy-state.json \
            --seal ../baseline/outputs/staging-baseline-dist-seal.json \
            --provenance ../baseline/outputs/staging-frontend-provenance.json \
            --environment-snapshot ../baseline/outputs/staging-remote-environment-snapshot.json \
            --edge-baseline ../baseline/edge-baseline
          node ../control/scripts/ev2/phase12/verify-staging-deploy-recovery-state.mjs \
            --file outputs/staging-deploy-state.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-sha "$CONTROL_SHA" \
            --candidate-release "$CANDIDATE_RELEASE" \
            --original-release "$ORIGINAL_RELEASE"
      - name: Download the just-uploaded recovery copy by immutable artifact ID
        id: staging_recovery_download
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.staging_recovery_artifact.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-recovery-pre-mutation
      - name: Prove the remote recovery copy is recoverable before mutation
        id: staging_recovery_remote
        timeout-minutes: 10
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ev2/phase12/verify-staging-deploy-recovery-artifact.mjs
          --state ../candidate/outputs/staging-deploy-state.json
          --artifact-dir "$RUNNER_TEMP/g12-staging-recovery-pre-mutation"
      - name: Write the full-context pre-mutation release checkpoint
        id: staging_release_checkpoint
        working-directory: control
        run: >-
          node scripts/ev2/phase12/write-staging-release-checkpoint.mjs
          --state ../candidate/outputs/staging-deploy-state.json
          --output ../candidate/outputs/staging-release-checkpoint.json
          --candidate-matrix ../candidate/.github/release-controls/release-gate-matrix.json
          --control-matrix "$RUNNER_TEMP/g12-staging-release-package/controls/release-gate-matrix.json"
          --candidate-policy ../candidate/.github/release-controls/release-checkpoint-policy.json
          --control-policy "$RUNNER_TEMP/g12-staging-release-package/controls/release-checkpoint-policy.json"
          --profile "${{ steps.frontend_bridge.outputs.release_profile }}"
          --expected-matrix-sha256 "${{ steps.frontend_bridge.outputs.matrix_sha256 }}"
          --expected-policy-sha256 "${{ steps.frontend_bridge.outputs.policy_sha256 }}"
      - name: Persist redundant HMAC staging state before mutation
        id: staging_state_variable
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
          CONTROL_SHA: ${{ github.sha }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs put
          --kind staging-deploy --file ../candidate/outputs/staging-deploy-state.json
      - name: Upload mandatory pre-mutation staging state
        id: staging_state_artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-deploy-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/outputs/staging-deploy-state.json
            candidate/outputs/staging-release-checkpoint.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Download the pre-mutation state bundle by immutable artifact ID
        id: staging_state_download
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.staging_state_artifact.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-state-pre-mutation
      - name: Reverify the downloaded full-context checkpoint before mutation
        id: staging_release_checkpoint_remote
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-staging-release-checkpoint.mjs
          --state "$RUNNER_TEMP/g12-staging-state-pre-mutation/staging-deploy-state.json"
          --checkpoint "$RUNNER_TEMP/g12-staging-state-pre-mutation/staging-release-checkpoint.json"
          --candidate-matrix ../candidate/.github/release-controls/release-gate-matrix.json
          --control-matrix "$RUNNER_TEMP/g12-staging-release-package/controls/release-gate-matrix.json"
          --candidate-policy ../candidate/.github/release-controls/release-checkpoint-policy.json
          --control-policy "$RUNNER_TEMP/g12-staging-release-package/controls/release-checkpoint-policy.json"
          --profile "${{ steps.frontend_bridge.outputs.release_profile }}"
          --expected-matrix-sha256 "${{ steps.frontend_bridge.outputs.matrix_sha256 }}"
          --expected-policy-sha256 "${{ steps.frontend_bridge.outputs.policy_sha256 }}"
      - name: Arm staging mutation only after every durable recovery proof exists
        id: staging_mutation_boundary
        env:
          STATE_VARIABLE: ${{ steps.staging_state_variable.outputs.variable }}
          STATE_VARIABLE_SOURCE: ${{ steps.staging_state_variable.outputs.source }}
          STATE_ARTIFACT_ID: ${{ steps.staging_state_artifact.outputs.artifact-id }}
          STATE_ARTIFACT_DIGEST: ${{ steps.staging_state_artifact.outputs.artifact-digest }}
          RECOVERY_ARTIFACT_ID: ${{ steps.staging_recovery_artifact.outputs.artifact-id }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.staging_recovery_artifact.outputs.artifact-digest }}
          STATE_RECOVERY_ID: ${{ steps.staging_state.outputs.recovery_artifact_id }}
          STATE_RECOVERY_DIGEST: ${{ steps.staging_state.outputs.recovery_artifact_digest }}
          REMOTE_RECOVERY_VERIFIED: ${{ steps.staging_recovery_remote.outputs.verified }}
          REMOTE_RECOVERY_ID: ${{ steps.staging_recovery_remote.outputs.artifact_id }}
          REMOTE_RECOVERY_DIGEST: ${{ steps.staging_recovery_remote.outputs.artifact_digest }}
          STATE_ARCHIVE_SHA256: ${{ steps.staging_state.outputs.archive_sha256 }}
          REMOTE_ARCHIVE_SHA256: ${{ steps.staging_recovery_remote.outputs.archive_sha256 }}
          SNAPSHOT_SHA256: ${{ steps.staging_environment_snapshot.outputs.environment_snapshot_sha256 }}
          STATE_SNAPSHOT_SHA256: ${{ steps.staging_state.outputs.environment_snapshot_sha256 }}
          REMOTE_SNAPSHOT_SHA256: ${{ steps.staging_recovery_remote.outputs.environment_snapshot_sha256 }}
          EDGE_BASELINE_MANIFEST_SHA256: ${{ steps.staging_edge_baseline.outputs.edge_baseline_manifest_sha256 }}
          STATE_EDGE_BASELINE_MANIFEST_SHA256: ${{ steps.staging_state.outputs.edge_baseline_manifest_sha256 }}
          REMOTE_EDGE_BASELINE_MANIFEST_SHA256: ${{ steps.staging_recovery_remote.outputs.edge_baseline_manifest_sha256 }}
          CHECKPOINT_VERIFIED: ${{ steps.staging_release_checkpoint_remote.outputs.verified }}
          CHECKPOINT_BINDING_MATCHES: ${{ steps.staging_release_checkpoint_remote.outputs.binding_matches }}
          CHECKPOINT_REUSABLE_GATES: ${{ steps.staging_release_checkpoint_remote.outputs.reusable_gates }}
          CHECKPOINT_MUTATION_GATES_REUSED: ${{ steps.staging_release_checkpoint_remote.outputs.mutation_gates_reused }}
          CHECKPOINT_CANDIDATE_SHA: ${{ steps.staging_release_checkpoint_remote.outputs.candidate_sha }}
          CHECKPOINT_ARTIFACT_ID: ${{ steps.staging_release_checkpoint_remote.outputs.artifact_id }}
          CHECKPOINT_ARTIFACT_DIGEST: ${{ steps.staging_release_checkpoint_remote.outputs.artifact_digest }}
          CHECKPOINT_ARCHIVE_SHA256: ${{ steps.staging_release_checkpoint_remote.outputs.archive_sha256 }}
          CHECKPOINT_TREE_SHA256: ${{ steps.staging_release_checkpoint_remote.outputs.tree_sha256 }}
          CHECKPOINT_DEPLOYMENT_ID: ${{ steps.staging_release_checkpoint_remote.outputs.deployment_id }}
          CHECKPOINT_SNAPSHOT_SHA256: ${{ steps.staging_release_checkpoint_remote.outputs.environment_snapshot_sha256 }}
          CHECKPOINT_EDGE_BASELINE_MANIFEST_SHA256: ${{ steps.staging_release_checkpoint_remote.outputs.edge_baseline_manifest_sha256 }}
          CHECKPOINT_PROFILE: ${{ steps.staging_release_checkpoint_remote.outputs.release_profile }}
          CHECKPOINT_MATRIX_SHA256: ${{ steps.staging_release_checkpoint_remote.outputs.matrix_sha256 }}
          CHECKPOINT_POLICY_SHA256: ${{ steps.staging_release_checkpoint_remote.outputs.policy_sha256 }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          SOURCE_ARTIFACT_ID: ${{ steps.frontend_source.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.frontend_source.outputs.artifact_digest }}
          SOURCE_TREE_SHA256: ${{ steps.frontend_package.outputs.tree_sha256 }}
          LIVE_DEPLOYMENT_ID: ${{ steps.staging_baseline.outputs.deployment_id }}
          RELEASE_PROFILE: ${{ steps.frontend_bridge.outputs.release_profile }}
          MATRIX_SHA256: ${{ steps.frontend_bridge.outputs.matrix_sha256 }}
          POLICY_SHA256: ${{ steps.frontend_bridge.outputs.policy_sha256 }}
        run: |
          set -euo pipefail
          test "$STATE_VARIABLE" = G12_STAGING_DEPLOY_RECOVERY
          test "$STATE_VARIABLE_SOURCE" = variable
          test "$(printf '%s' "$STATE_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$STATE_ARTIFACT_ID"
          test "$(printf '%s' "$STATE_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$STATE_ARTIFACT_DIGEST"
          test "$(printf '%s' "$RECOVERY_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$RECOVERY_ARTIFACT_ID"
          test "$(printf '%s' "$RECOVERY_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$RECOVERY_ARTIFACT_DIGEST"
          case "$RECOVERY_ARTIFACT_DIGEST" in sha256:*) ;; *) RECOVERY_ARTIFACT_DIGEST="sha256:$RECOVERY_ARTIFACT_DIGEST" ;; esac
          test "$REMOTE_RECOVERY_VERIFIED" = true
          test "$STATE_RECOVERY_ID" = "$RECOVERY_ARTIFACT_ID"
          test "$REMOTE_RECOVERY_ID" = "$RECOVERY_ARTIFACT_ID"
          test "$STATE_RECOVERY_DIGEST" = "$RECOVERY_ARTIFACT_DIGEST"
          test "$REMOTE_RECOVERY_DIGEST" = "$RECOVERY_ARTIFACT_DIGEST"
          test "$STATE_ARCHIVE_SHA256" = "$REMOTE_ARCHIVE_SHA256"
          test "$SNAPSHOT_SHA256" = "$STATE_SNAPSHOT_SHA256"
          test "$SNAPSHOT_SHA256" = "$REMOTE_SNAPSHOT_SHA256"
          test "$EDGE_BASELINE_MANIFEST_SHA256" = "$STATE_EDGE_BASELINE_MANIFEST_SHA256"
          test "$EDGE_BASELINE_MANIFEST_SHA256" = "$REMOTE_EDGE_BASELINE_MANIFEST_SHA256"
          test "$CHECKPOINT_VERIFIED" = true
          test "$CHECKPOINT_BINDING_MATCHES" = true
          test "$CHECKPOINT_REUSABLE_GATES" = artifact-seal,immutable-provenance
          test "$CHECKPOINT_MUTATION_GATES_REUSED" = false
          test "$CHECKPOINT_CANDIDATE_SHA" = "$CANDIDATE_SHA"
          test "$CHECKPOINT_ARTIFACT_ID" = "$SOURCE_ARTIFACT_ID"
          test "$CHECKPOINT_ARTIFACT_DIGEST" = "$SOURCE_ARTIFACT_DIGEST"
          test "$CHECKPOINT_ARCHIVE_SHA256" = "$STATE_ARCHIVE_SHA256"
          test "$CHECKPOINT_TREE_SHA256" = "$SOURCE_TREE_SHA256"
          test "$CHECKPOINT_DEPLOYMENT_ID" = "$LIVE_DEPLOYMENT_ID"
          test "$CHECKPOINT_SNAPSHOT_SHA256" = "$SNAPSHOT_SHA256"
          test "$CHECKPOINT_EDGE_BASELINE_MANIFEST_SHA256" = "$EDGE_BASELINE_MANIFEST_SHA256"
          test "$CHECKPOINT_PROFILE" = "$RELEASE_PROFILE"
          test "$CHECKPOINT_MATRIX_SHA256" = "$MATRIX_SHA256"
          test "$CHECKPOINT_POLICY_SHA256" = "$POLICY_SHA256"
          printf 'armed=true\n' >> "$GITHUB_OUTPUT"
      - name: Apply the exact candidate migrations to staging
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'database-auth' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: ${{ steps.database_payload.outputs.project_directory }}
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test "$STAGING_SUPABASE_PROJECT_REF" = "glcqsosxwgmlhzgcsnzv"
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF" --yes
          supabase db push --linked --include-all --dry-run
          supabase db push --linked --include-all --yes
      - name: Configure the exact staging browser origins without wildcard trust
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'edge-only' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: control
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/g12-staging-release-package/edge/source/scripts/ev2/phase12/configure-staging-edge-public-secrets.mjs" |
            tee "$RUNNER_TEMP/g12-staging-edge-public-secrets.json"
      - name: Configure and verify the exact staging Auth redirect boundary
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'database-auth' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: ${{ steps.database_payload.outputs.project_directory }}
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: node scripts/ev2/phase12/configure-staging-auth.mjs | tee "$RUNNER_TEMP/g12-staging-auth.json"
      - name: Configure and verify the exact privacy-safe staging AI provider policy
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'edge-only' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: control
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          node
          "$RUNNER_TEMP/g12-staging-release-package/edge/source/scripts/ev2/phase12/configure-staging-ai-provider-secrets.mjs"
      - name: Deploy the complete exact-candidate Edge Function inventory to staging
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'edge-only' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          release_manifest="$RUNNER_TEMP/g12-staging-release-package/staging-release-package.json"
          edge_manifest_sha256="$(jq -er '.components.edge.files[] | select(.path == "manifest.json") | .sha256' "$release_manifest")"
          test "$(printf '%s' "$edge_manifest_sha256" | grep -E '^[a-f0-9]{64}$')" = "$edge_manifest_sha256"
          node scripts/ev2/phase12/deploy-staging-functions.mjs \
            --candidate-artifact "$RUNNER_TEMP/g12-staging-release-package/edge" \
            --artifact-manifest-sha256 "$edge_manifest_sha256" \
            --baseline-artifact "$RUNNER_TEMP/g12-staging-recovery-pre-mutation/edge-baseline" \
            --baseline-manifest-sha256 "${{ steps.staging_state.outputs.edge_baseline_manifest_sha256 }}" \
            --candidate "${{ steps.candidate.outputs.sha }}" \
            --mode initial \
            --report outputs/g12-staging-function-deployment.json
      - name: Verify the exact deployed staging Function modes
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'edge-only' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `-e` ja vem ligado por
          # padrao; falta so o pipefail para a falha do comando da esquerda reprovar o passo.
          set -o pipefail
          supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF" --output json > ../g12-staging-functions.json
          node scripts/ev2/phase12/verify-production-functions.mjs \
          --file ../g12-staging-functions.json \
          --receipt outputs/g12-staging-function-deployment.json \
          --source . --candidate "${{ steps.candidate.outputs.sha }}" \
          --environment staging --project-ref "$STAGING_SUPABASE_PROJECT_REF"
      - name: Verify staging migrations, RLS, Storage and Vault read-only
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: >-
          node scripts/ev2/phase12/verify-staging-database.mjs
          --source . | tee ../g12-staging-database.json
      - name: Exercise post-baseline migration scenarios with isolated synthetic data
        if: >-
          steps.frontend_bridge.outputs.release_profile == 'database-auth' ||
          steps.frontend_bridge.outputs.release_profile == 'full-release'
        working-directory: candidate
        run: node scripts/ev2/phase12/staging-migrations-canary.mjs
        env:
          G12_MIGRATION_CANARY_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          G12_MIGRATION_CANARY_REPORT_PATH: ../g12-staging-migrations-canary.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Revalidate the sealed recovery artifact before compatibility publication
        working-directory: candidate
        run: >-
          node ../control/scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist ../baseline/dist
          --seal ../baseline/outputs/staging-baseline-dist-seal.json
          --candidate "${{ inputs.rollback_ref }}"
      - name: Publish the rollback frontend to an isolated compatibility canary
        id: rollback_compatibility_deploy
        timeout-minutes: 15
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: baseline
          command: >-
            pages deploy dist --project-name gaiatec-cms-staging --branch ev2-g12-rollback-compat
            --commit-hash ${{ inputs.rollback_ref }} --commit-dirty=false
      - name: Probe the rollback frontend against the candidate backend
        working-directory: candidate
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: ${{ steps.rollback_compatibility_deploy.outputs.deployment-url }}
          EV2_G12_EXPECTED_SHA: ${{ inputs.rollback_ref }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          # Redeploying the function inventory leaves every public route cold, which inflates the
          # tail while the p50 stays healthy. Warmup exists to keep that out of the measurement.
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-rollback-compatibility.json
          # This target was deployed seconds ago, so the probe has to wait for the alias to
          # converge before it can measure it. Only the wait changes; every assertion, the
          # sample size and the latency budget stay exactly as they are.
          EV2_G12_READINESS_ATTEMPTS: "20"
          EV2_G12_READINESS_INTERVAL_MS: "4000"
      - name: Install the isolated browser for automatic public frontend gates
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Verify exact candidate checkout is clean before promoting the artifact
        working-directory: candidate
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify the staging candidate seal before durable handoff
        working-directory: candidate
        run: >-
          node scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist dist
          --seal outputs/staging-frontend-dist-seal.json
          --candidate "${{ steps.candidate.outputs.sha }}"
      - name: Verify compatibility handoff immediately before durable upload
        id: staging_candidate_handoff_preupload
        working-directory: candidate
        run: >-
          node scripts/ev2/phase12/verify-staging-candidate-handoff.mjs
          --handoff "$RUNNER_TEMP/g12-staging-candidate-handoff"
          --output "$RUNNER_TEMP/g12-staging-candidate-handoff-preupload"
          --candidate "${{ steps.candidate.outputs.sha }}"
          --run-id "${{ steps.frontend_source.outputs.source_run_id }}"
          --run-attempt "${{ steps.frontend_source.outputs.source_run_attempt }}"
          --archive-sha256 "${{ steps.frontend_package.outputs.archive_sha256 }}"
          --seal-sha256 "${{ steps.frontend_package.outputs.seal_sha256 }}"
          --provenance-sha256 "${{ steps.frontend_package.outputs.provenance_sha256 }}"
          --profile-sha256 "${{ steps.frontend_package.outputs.profile_sha256 }}"
          --tree-sha256 "${{ steps.frontend_package.outputs.tree_sha256 }}"
          --archive-bytes "${{ steps.frontend_package.outputs.archive_bytes }}"
          --file-count "${{ steps.frontend_package.outputs.file_count }}"
          --byte-count "${{ steps.frontend_package.outputs.byte_count }}"
      - name: Upload mandatory immutable staging candidate artifact
        id: staging_candidate_artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-candidate-${{ steps.candidate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g12-staging-candidate-handoff/staging-frontend-dist.tar
            ${{ runner.temp }}/g12-staging-candidate-handoff/staging-frontend-dist-seal.json
            ${{ runner.temp }}/g12-staging-candidate-handoff/staging-frontend-provenance.json
            ${{ runner.temp }}/g12-staging-candidate-handoff/staging-candidate-handoff.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Revalidate the immutable staging candidate before post-deploy canaries
        working-directory: candidate
        run: >-
          node scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist dist
          --seal outputs/staging-frontend-dist-seal.json
          --candidate "${{ steps.candidate.outputs.sha }}"
      - name: Prove the exact bridge deployment remains canonical after backend mutation
        id: staging_bridge_deployment
        timeout-minutes: 3
        working-directory: candidate
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-original
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_RELEASE: ${{ inputs.rollback_ref }}
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.staging_baseline.outputs.deployment_id }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.staging_baseline.outputs.created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.staging_baseline.outputs.commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.candidate.outputs.sha }}
          STAGING_RUN_MARKER: ${{ steps.staging_state.outputs.run_marker }}
      - name: Probe shell and public routes of the exact deployment
        working-directory: candidate
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          # Redeploying the function inventory leaves every public route cold, which inflates the
          # tail while the p50 stays healthy. Warmup exists to keep that out of the measurement.
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-probe.json
      - name: Revalidate immutable bytes before the isolated G12 canary
        working-directory: candidate
        run: >-
          node scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist dist
          --seal outputs/staging-frontend-dist-seal.json
          --candidate "${{ steps.candidate.outputs.sha }}"
      - name: Publish the same artifact to the isolated G12 canary
        timeout-minutes: 15
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: candidate
          command: >-
            pages deploy dist --project-name gaiatec-cms-staging --branch ev2-g12-canary
            --commit-hash ${{ steps.candidate.outputs.sha }} --commit-dirty=false
      - name: Run three healthy G12 windows and inherited system assurance
        working-directory: candidate
        run: npm run canary:ev2:phase12
        env:
          EV2_G12_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          # O script recusa relatorio fora do proprio cwd, e este step roda em `candidate`, entao
          # `../g12-canary.json` cai no workspace e e recusado com G12_REPORT_PATH_REFUSED. A escrita
          # fica depois do `finally`, de modo que a recusa so chegaria ao fim do canario, ja com
          # staging mutado e o alias publicado. `outputs/` e ignorado pelo git, como os demais.
          EV2_G12_REPORT_PATH: outputs/g12-canary.json
          EV2_G11_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          EV2_G11_TIMING_REPORT_PATH: outputs/g11-timing-samples.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Revalidate immutable bytes before the enforced-CSP canary
        working-directory: candidate
        run: >-
          node scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist dist
          --seal outputs/staging-frontend-dist-seal.json
          --candidate "${{ steps.candidate.outputs.sha }}"
      - name: Publish the same artifact to the enforced-CSP canary
        timeout-minutes: 15
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: candidate
          command: >-
            pages deploy dist --project-name gaiatec-cms-staging --branch ev2-g16-csp-canary
            --commit-hash ${{ steps.candidate.outputs.sha }} --commit-dirty=false
      - name: Run deployed public catalog, route, mobile and accessibility browser regressions
        working-directory: candidate
        run: >-
          npx playwright test tests/e2e/products-catalog.spec.ts tests/e2e/routes-and-a11y.spec.ts
          --workers=2 --retries=0
        env:
          PLAYWRIGHT_BASE_URL: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
      - name: Validate source inventory and signed-out routes in the deployed browser
        working-directory: candidate
        run: >-
          npx playwright test --project=desktop-chromium --retries=0
          --grep "matriz classifica|CI sem segredos"
        env:
          PLAYWRIGHT_BASE_URL: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          QA_CMS_REPORT_PATH: outputs/cms-final-coverage.json
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_REQUIRE_AUTHENTICATED: "false"
          QA_CMS_AUTHENTICATED_SUITE_SCHEDULED: "true"
      - name: Validate enforced CSP in a real browser
        working-directory: candidate
        run: npm run canary:ev2:phase16:csp
        env:
          CSP_CANARY_ORIGIN: https://ev2-g16-csp-canary.gaiatec-cms-staging.pages.dev
          CSP_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          CSP_EVIDENCE_PATH: ../g16-csp-browser.json
      - name: Run authenticated synthetic canary against the deployed backend
        working-directory: candidate
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: node scripts/ev2/phase17/staging-canary.mjs | tee ../g17-staging-canary.json
        env:
          EV2_G17_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Exercise the governed editorial lifecycle end to end
        working-directory: candidate
        run: |
          # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `-e` ja vem ligado por
          # padrao; falta so o pipefail para a falha do comando da esquerda reprovar o passo.
          set -o pipefail
          qa_date="$(date -u +%Y%m%d)"
          export GAIATEC_QA_RUN_TAG="QA-CMS-FINAL-${qa_date}-${GAIATEC_EXPECTED_SHA:0:8}"
          node scripts/phase7/staging-roundtrip.mjs | tee ../g12-staging-lifecycle.json
        env:
          GAIATEC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          GAIATEC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          GAIATEC_STAGING_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          GAIATEC_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Probe public, anonymous, CORS and secret boundaries
        working-directory: candidate
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: node scripts/ev2/phase12/probe-supabase-boundary.mjs | tee ../g12-staging-boundary.json
        env:
          CMS_BACKEND_ENVIRONMENT: staging
          CMS_BACKEND_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          CMS_BACKEND_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          CMS_BACKEND_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
      - name: Revalidate the immutable candidate after all staging gates
        if: always() && steps.staging_candidate_artifact.outcome == 'success'
        working-directory: candidate
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: >-
          node scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist dist
          --seal outputs/staging-frontend-dist-seal.json
          --candidate "${{ steps.candidate.outputs.sha }}"
      - name: Bind staging evidence to mandatory artifact IDs and digests
        if: >-
          always() && steps.staging_state_artifact.outcome == 'success' &&
          steps.staging_recovery_artifact.outcome == 'success' &&
          steps.staging_candidate_artifact.outcome == 'success'
        working-directory: candidate
        env:
          STATE_ARTIFACT_ID: ${{ steps.staging_state_artifact.outputs.artifact-id }}
          STATE_ARTIFACT_DIGEST: ${{ steps.staging_state_artifact.outputs.artifact-digest }}
          RECOVERY_ARTIFACT_ID: ${{ steps.staging_recovery_artifact.outputs.artifact-id }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.staging_recovery_artifact.outputs.artifact-digest }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.staging_candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.staging_candidate_artifact.outputs.artifact-digest }}
          PREFLIGHT_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          PREFLIGHT_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          SOURCE_VALIDATION_ARTIFACT_ID: ${{ needs.validate_source.outputs.artifact_id }}
          SOURCE_VALIDATION_ARTIFACT_DIGEST: ${{ needs.validate_source.outputs.artifact_digest }}
          LIVE_VALIDATION_ARTIFACT_ID: ${{ needs.validate_live_baseline.outputs.artifact_id }}
          LIVE_VALIDATION_ARTIFACT_DIGEST: ${{ needs.validate_live_baseline.outputs.artifact_digest }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const id = /^[1-9]\d*$/;
          const digest = /^(?:sha256:)?[a-f0-9]{64}$/;
          for (const name of [
            "STATE_ARTIFACT_ID",
            "RECOVERY_ARTIFACT_ID",
            "CANDIDATE_ARTIFACT_ID",
            "PREFLIGHT_ARTIFACT_ID",
            "SOURCE_VALIDATION_ARTIFACT_ID",
            "LIVE_VALIDATION_ARTIFACT_ID",
          ])
            if (!id.test(process.env[name] || "")) throw new Error("G12_STAGING_ARTIFACT_ID_INVALID");
          for (const name of [
            "STATE_ARTIFACT_DIGEST",
            "RECOVERY_ARTIFACT_DIGEST",
            "CANDIDATE_ARTIFACT_DIGEST",
            "PREFLIGHT_ARTIFACT_DIGEST",
            "SOURCE_VALIDATION_ARTIFACT_DIGEST",
            "LIVE_VALIDATION_ARTIFACT_DIGEST",
          ])
            if (!digest.test(process.env[name] || "")) throw new Error("G12_STAGING_ARTIFACT_DIGEST_INVALID");
          const canonicalDigest = (value) => value.startsWith("sha256:") ? value : `sha256:${value}`;
          const seal = JSON.parse(readFileSync("outputs/staging-frontend-dist-seal.json", "utf8"));
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.artifacts.bound",
            candidateSha: process.env.CANDIDATE_SHA,
            state: { id: process.env.STATE_ARTIFACT_ID, digest: canonicalDigest(process.env.STATE_ARTIFACT_DIGEST) },
            recovery: { id: process.env.RECOVERY_ARTIFACT_ID, digest: canonicalDigest(process.env.RECOVERY_ARTIFACT_DIGEST) },
            candidate: {
              id: process.env.CANDIDATE_ARTIFACT_ID,
              digest: canonicalDigest(process.env.CANDIDATE_ARTIFACT_DIGEST),
              archiveSha256: seal.archiveSha256,
              treeSha256: seal.treeSha256,
            },
            validations: {
              preflight: {
                id: process.env.PREFLIGHT_ARTIFACT_ID,
                digest: canonicalDigest(process.env.PREFLIGHT_ARTIFACT_DIGEST),
              },
              source: {
                id: process.env.SOURCE_VALIDATION_ARTIFACT_ID,
                digest: canonicalDigest(process.env.SOURCE_VALIDATION_ARTIFACT_DIGEST),
              },
              liveBaseline: {
                id: process.env.LIVE_VALIDATION_ARTIFACT_ID,
                digest: canonicalDigest(process.env.LIVE_VALIDATION_ARTIFACT_DIGEST),
              },
            },
          };
          writeFileSync("outputs/staging-artifact-bindings.json", JSON.stringify(evidence, null, 2) + "\n", {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Materialize fail-closed evidence for the selected release profile
        if: success()
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_PROFILE: ${{ steps.frontend_bridge.outputs.release_profile }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { existsSync, statSync, writeFileSync } = require("node:fs");
          const profiles = {
            "frontend-only": { edge: false, databaseAuth: false },
            "edge-only": { edge: true, databaseAuth: false },
            "database-auth": { edge: false, databaseAuth: true },
            "full-release": { edge: true, databaseAuth: true },
          };
          const profile = profiles[process.env.RELEASE_PROFILE];
          if (!profile || !/^[a-f0-9]{40}$/.test(process.env.CANDIDATE_SHA || ""))
            throw new Error("G12_STAGING_RELEASE_PROFILE_BINDING_INVALID");
          const files = {
            edge: [
              "candidate/outputs/g12-staging-function-deployment.json",
              "g12-staging-functions.json",
            ],
            databaseAuth: ["g12-staging-auth.json", "g12-staging-migrations-canary.json"],
          };
          const gates = {};
          for (const [gate, gateFiles] of Object.entries(files)) {
            const required = profile[gate];
            for (const file of gateFiles) {
              const present = existsSync(file);
              if (required && (!present || !statSync(file).isFile() || statSync(file).size === 0))
                throw new Error(`G12_STAGING_REQUIRED_PROFILE_EVIDENCE_MISSING:${gate}:${file}`);
              if (!required && present)
                throw new Error(`G12_STAGING_STALE_PROFILE_EVIDENCE_REFUSED:${gate}:${file}`);
            }
            gates[gate] = {
              required,
              status: required ? "passed" : "not-required",
              evidenceFiles: required ? gateFiles : [],
              forbiddenFilesAbsent: required ? [] : gateFiles,
            };
          }
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.release_profile.evidence",
            candidateSha: process.env.CANDIDATE_SHA,
            releaseProfile: process.env.RELEASE_PROFILE,
            gates,
          };
          writeFileSync(
            "candidate/outputs/staging-release-profile-evidence.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE
      - name: Require every successful staging evidence file before upload
        if: success()
        env:
          RELEASE_PROFILE: ${{ steps.frontend_bridge.outputs.release_profile }}
        run: |
          set -euo pipefail
          evidence_files=(
            candidate/outputs/staging-artifact-bindings.json
            candidate/outputs/staging-release-profile-evidence.json
            candidate/outputs/cms-final-coverage.json
            candidate/outputs/g12-cms-coverage-matrix.json
            candidate/outputs/g12-backend-compatibility.json
            baseline/outputs/cms-coverage-rollback.json
            candidate/outputs/g12-canary.json
            candidate/outputs/g11-timing-samples.json
            g16-csp-browser.json
            g12-staging-database.json
            g12-staging-live-baseline.json
            g12-staging-rollback-compatibility.json
            g12-staging-probe.json
            g12-staging-boundary.json
            g12-staging-lifecycle.json
            g17-staging-canary.json
          )
          edge_evidence=(
            candidate/outputs/g12-staging-function-deployment.json
            g12-staging-functions.json
          )
          database_auth_evidence=(
            g12-staging-auth.json
            g12-staging-migrations-canary.json
          )
          case "$RELEASE_PROFILE" in
            frontend-only) ;;
            edge-only) evidence_files+=("${edge_evidence[@]}") ;;
            database-auth) evidence_files+=("${database_auth_evidence[@]}") ;;
            full-release) evidence_files+=("${edge_evidence[@]}" "${database_auth_evidence[@]}") ;;
            *) echo "G12_STAGING_RELEASE_PROFILE_INVALID" >&2; exit 1 ;;
          esac
          for file in "${evidence_files[@]}"
          do
            test -s "$file"
          done
          # `test -s` mede TAMANHO, nao veredito. Um relatorio que diz `"status":"failed"` por
          # dentro tem bytes e passava; e o banner do npm impresso antes do canario deixa o
          # arquivo nao-vazio por construcao mesmo quando o canario estoura no primeiro check.
          # A presenca continua exigida acima; aqui se exige que o conteudo nao seja uma
          # reprovacao nem deixe de ser JSON.
          evidence_json=(
            candidate/outputs/staging-artifact-bindings.json
            candidate/outputs/staging-release-profile-evidence.json
            candidate/outputs/cms-final-coverage.json
            candidate/outputs/g12-cms-coverage-matrix.json
            candidate/outputs/g12-backend-compatibility.json
            baseline/outputs/cms-coverage-rollback.json
            candidate/outputs/g12-canary.json
            g16-csp-browser.json
            g12-staging-database.json
            g12-staging-live-baseline.json
            g12-staging-rollback-compatibility.json
            g12-staging-probe.json
            g12-staging-boundary.json
            g12-staging-lifecycle.json
            g17-staging-canary.json
          )
          case "$RELEASE_PROFILE" in
            frontend-only) ;;
            edge-only) evidence_json+=("${edge_evidence[@]}") ;;
            database-auth) evidence_json+=("${database_auth_evidence[@]}") ;;
            full-release) evidence_json+=("${edge_evidence[@]}" "${database_auth_evidence[@]}") ;;
            *) echo "G12_STAGING_RELEASE_PROFILE_INVALID" >&2; exit 1 ;;
          esac
          node candidate/scripts/ev2/phase12/verify-staging-evidence.mjs "${evidence_json[@]}"
      - id: staging_evidence_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: staging-preliminary-${{ steps.candidate.outputs.sha }}
          path: |
            candidate/outputs/staging-artifact-bindings.json
            candidate/outputs/staging-release-profile-evidence.json
            candidate/outputs/cms-final-coverage.json
            candidate/outputs/g12-cms-coverage-matrix.json
            candidate/outputs/g12-staging-function-deployment.json
            candidate/outputs/g12-backend-compatibility.json
            baseline/outputs/cms-coverage-rollback.json
            candidate/outputs/g12-canary.json
            candidate/outputs/g11-timing-samples.json
            g16-csp-browser.json
            g12-staging-database.json
            g12-staging-auth.json
            g12-staging-functions.json
            g12-staging-migrations-canary.json
            g12-staging-live-baseline.json
            g12-staging-rollback-compatibility.json
            g12-staging-probe.json
            g12-staging-boundary.json
            g12-staging-lifecycle.json
            g17-staging-canary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  preflight:
    # Control-plane only: no package build, browser, secret mutation or deployment is reachable
    # from this job. It fails quickly and seals the exact run/SHA inputs consumed by both parallel
    # validation branches and by the serial mutation lane.
    if: ${{ !inputs.diagnostic_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.refs.outputs.candidate_sha }}
      rollback_sha: ${{ steps.refs.outputs.rollback_sha }}
      artifact_id: ${{ steps.preflight_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.preflight_artifact.outputs.artifact-digest }}
    steps:
      - name: Reject an unauthorized canonical staging dispatch immediately
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FRONTEND_BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
          EV2_DRAFT_V2_CANDIDATE: ${{ inputs.ev2_draft_v2_candidate }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "${DISPATCH_ACTOR,,}" = vnd93
          test "${TRIGGERING_ACTOR,,}" = vnd93
          test -n "$FRONTEND_BRIDGE_RUN_ID"
          test "$(printf '%s' "$FRONTEND_BRIDGE_RUN_ID" | grep -E '^[1-9][0-9]*$')" = "$FRONTEND_BRIDGE_RUN_ID"
          test "$EV2_DRAFT_V2_CANDIDATE" = false
      - name: Checkout the quick-preflight control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Checkout the quick-preflight candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout the quick-preflight rollback baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.rollback_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: baseline
      - name: Use the pinned Node runtime for quick-preflight sealing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Resolve and seal exact canonical staging inputs
        id: refs
        working-directory: control
        env:
          CONTROL_SHA: ${{ github.sha }}
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
          FRONTEND_BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
        run: |
          set -euo pipefail
          candidate_sha="$(git -C ../candidate rev-parse HEAD)"
          rollback_sha="$(git -C ../baseline rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git rev-parse origin/main)" = "$CONTROL_SHA"
          test "$(printf '%s' "$candidate_sha" | grep -E '^[a-f0-9]{40}$')" = "$candidate_sha"
          test "$(printf '%s' "$rollback_sha" | grep -E '^[a-f0-9]{40}$')" = "$rollback_sha"
          git merge-base --is-ancestor "$candidate_sha" origin/main
          git merge-base --is-ancestor "$rollback_sha" "$candidate_sha"
          test "$candidate_sha" = "$rollback_sha"
          test -z "$(git status --porcelain)"
          test -z "$(git -C ../candidate status --porcelain)"
          test -z "$(git -C ../baseline status --porcelain)"
          mkdir -p ../staging-preflight
          CANDIDATE_SHA="$candidate_sha" ROLLBACK_SHA="$rollback_sha" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.preflight.passed",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.CONTROL_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            frontendBridgeRunId: process.env.FRONTEND_BRIDGE_RUN_ID,
          };
          writeFileSync("../staging-preflight/staging-preflight.json", `${JSON.stringify(evidence, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'rollback_sha=%s\n' "$rollback_sha" >> "$GITHUB_OUTPUT"
      - name: Upload immutable quick-preflight evidence
        id: preflight_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-preflight/staging-preflight.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  validate_source:
    # Pure source/lockfile validation. It runs independently of the remote baseline validation and
    # hands the reports to `deploy` by immutable artifact ID/digest instead of shared workspace.
    needs: preflight
    if: ${{ !inputs.diagnostic_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.source_validation_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.source_validation_artifact.outputs.artifact-digest }}
    steps:
      - name: Download quick-preflight evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-preflight
      - name: Checkout source-validation control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Checkout source-validation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout source-validation rollback baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.rollback_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: baseline
      - name: Use the candidate-pinned Node runtime for source validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Reverify quick-preflight identity before source validation
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          EXPECTED_ROLLBACK_SHA: ${{ needs.preflight.outputs.rollback_sha }}
          EXPECTED_CONTROL_SHA: ${{ github.sha }}
          EXPECTED_BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$EXPECTED_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$EXPECTED_ARTIFACT_ID"
          test "$(printf '%s' "$EXPECTED_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$EXPECTED_ARTIFACT_DIGEST"
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/g12-staging-preflight/staging-preflight.json`, "utf8"),
          );
          if (
            value.event !== "g12.staging.preflight.passed" ||
            value.runId !== process.env.GITHUB_RUN_ID ||
            value.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            value.controlSha !== process.env.EXPECTED_CONTROL_SHA ||
            value.candidateSha !== process.env.EXPECTED_CANDIDATE_SHA ||
            value.rollbackSha !== process.env.EXPECTED_ROLLBACK_SHA ||
            value.frontendBridgeRunId !== process.env.EXPECTED_BRIDGE_RUN_ID
          ) throw new Error("G12_STAGING_PREFLIGHT_BINDING_INVALID");
          NODE
      - name: Run locked install, audit and source-only compatibility gates
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          node scripts/qa/cms-coverage-inventory.mjs --output outputs/g12-cms-coverage-matrix.json
          node scripts/ev2/phase12/verify-backend-forward-compatibility.mjs \
            --candidate . --baseline ../baseline --report outputs/g12-backend-compatibility.json
          mkdir -p ../baseline/outputs
          node scripts/qa/cms-coverage-inventory.mjs \
            --repository-root ../baseline \
            --output ../baseline/outputs/cms-coverage-rollback.json
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Seal source-validation reports and exact bindings
        env:
          CONTROL_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          ROLLBACK_SHA: ${{ needs.preflight.outputs.rollback_sha }}
        run: |
          set -euo pipefail
          mkdir -p staging-source-validation
          cp candidate/outputs/g12-cms-coverage-matrix.json staging-source-validation/
          cp candidate/outputs/g12-backend-compatibility.json staging-source-validation/
          cp baseline/outputs/cms-coverage-rollback.json staging-source-validation/
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");
          const root = "staging-source-validation";
          const names = [
            "g12-cms-coverage-matrix.json",
            "g12-backend-compatibility.json",
            "cms-coverage-rollback.json",
          ];
          const files = Object.fromEntries(
            names.map((name) => [name, createHash("sha256").update(readFileSync(`${root}/${name}`)).digest("hex")]),
          );
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.source_validation.passed",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.CONTROL_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            checks: { lockedInstall: true, auditHigh: true, coverage: true, compatibility: true },
            files,
          };
          writeFileSync(`${root}/source-validation.json`, `${JSON.stringify(evidence, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Upload immutable source-validation handoff
        id: source_validation_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-source-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-source-validation
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  validate_live_baseline:
    # Read-only remote validation runs beside `validate-source`. `deploy` deliberately rechecks the
    # CAS-sensitive state immediately before mutation; this early branch is a fail-fast live gate,
    # never authority to mutate and never a substitute for the fresh recovery snapshot.
    needs: preflight
    if: ${{ !inputs.diagnostic_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    outputs:
      artifact_id: ${{ steps.live_validation_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.live_validation_artifact.outputs.artifact-digest }}
    steps:
      - name: Download quick-preflight evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-preflight
      - name: Checkout live-validation control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Checkout live-validation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Use the candidate-pinned Node runtime for live validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Reverify quick-preflight identity before live reads
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          EXPECTED_ROLLBACK_SHA: ${{ needs.preflight.outputs.rollback_sha }}
          EXPECTED_CONTROL_SHA: ${{ github.sha }}
          EXPECTED_BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$EXPECTED_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$EXPECTED_ARTIFACT_ID"
          test "$(printf '%s' "$EXPECTED_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$EXPECTED_ARTIFACT_DIGEST"
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/g12-staging-preflight/staging-preflight.json`, "utf8"),
          );
          if (
            value.event !== "g12.staging.preflight.passed" ||
            value.runId !== process.env.GITHUB_RUN_ID ||
            value.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            value.controlSha !== process.env.EXPECTED_CONTROL_SHA ||
            value.candidateSha !== process.env.EXPECTED_CANDIDATE_SHA ||
            value.rollbackSha !== process.env.EXPECTED_ROLLBACK_SHA ||
            value.frontendBridgeRunId !== process.env.EXPECTED_BRIDGE_RUN_ID
          ) throw new Error("G12_STAGING_PREFLIGHT_BINDING_INVALID");
          NODE
      - name: Refuse authoritative live capture while any staging recovery is armed
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs fence
          --owner-kind staging-deploy --require-empty
          --file "$RUNNER_TEMP/g12-staging-live-recovery-fence.json"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --control-sha "$GITHUB_SHA"
      - name: Install the candidate only for bounded read-only probes
        working-directory: candidate
        run: |
          npm ci
          mkdir -p ../staging-live-validation
      - name: Probe the approved live baseline without mutation
        working-directory: candidate
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ needs.preflight.outputs.rollback_sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: ../staging-live-validation/live-baseline-probe.json
      - name: Capture the approved live Pages identity read-only
        id: live
        timeout-minutes: 3
        working-directory: candidate
        run: node scripts/ev2/phase12/staging-pages-state.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_EXPECTED_RELEASE: ${{ needs.preflight.outputs.rollback_sha }}
      - name: Capture and verify a read-only preflight environment snapshot
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = glcqsosxwgmlhzgcsnzv
          node ../control/scripts/ev2/phase12/capture-staging-environment-snapshot.mjs \
            --output ../staging-live-validation/remote-environment-snapshot.json \
            --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --control-sha "${{ github.sha }}" \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            --deployment-id "${{ steps.live.outputs.deployment_id }}" \
            --deployment-branch ev2-g17-canary \
            --deployment-commit-sha "${{ steps.live.outputs.release }}" \
            --deployment-created-on "${{ steps.live.outputs.created_on }}"
          node ../control/scripts/ev2/phase12/verify-staging-environment-snapshot.mjs \
            --snapshot ../staging-live-validation/remote-environment-snapshot.json \
            --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --control-sha "${{ github.sha }}" \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            --deployment-id "${{ steps.live.outputs.deployment_id }}" \
            --deployment-branch ev2-g17-canary \
            --deployment-commit-sha "${{ steps.live.outputs.release }}" \
            --deployment-created-on "${{ steps.live.outputs.created_on }}"
      - name: Seal the read-only live-baseline validation handoff
        env:
          CONTROL_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          ROLLBACK_SHA: ${{ needs.preflight.outputs.rollback_sha }}
          LIVE_DEPLOYMENT_ID: ${{ steps.live.outputs.deployment_id }}
          LIVE_RELEASE: ${{ steps.live.outputs.release }}
          LIVE_CREATED_ON: ${{ steps.live.outputs.created_on }}
          LIVE_COMMIT_MESSAGE_B64: ${{ steps.live.outputs.commit_message_b64 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");
          const root = "staging-live-validation";
          const names = ["live-baseline-probe.json", "remote-environment-snapshot.json"];
          const files = Object.fromEntries(
            names.map((name) => [name, createHash("sha256").update(readFileSync(`${root}/${name}`)).digest("hex")]),
          );
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.live_baseline_validation.passed",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.CONTROL_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            live: {
              deploymentId: process.env.LIVE_DEPLOYMENT_ID,
              release: process.env.LIVE_RELEASE,
              createdOn: process.env.LIVE_CREATED_ON,
              commitMessageB64: process.env.LIVE_COMMIT_MESSAGE_B64,
            },
            checks: { aliasProbe: true, pagesState: true, environmentSnapshot: true },
            files,
          };
          writeFileSync(`${root}/live-baseline-validation.json`, `${JSON.stringify(evidence, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Upload immutable read-only live-baseline handoff
        id: live_validation_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-live-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-live-validation
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  diagnostic:
    # Bloco 2 da INSTRUCAO_OTIMIZACAO_ENTREGA_CMS_GAIATEC.md, secao 4.
    #
    # Proposito: colher TODAS as falhas do candidato em uma unica passada, para que a correcao seja
    # feita em lote num unico SHA, em vez de um defeito por rodada.
    #
    # Limite honesto, repetido no relatorio: este passe NAO aplica migration, NAO configura secret,
    # NAO faz deploy de Edge Function, NAO publica bytes e NAO sela artefato. Ele exercita o codigo
    # do candidato contra o staging como ele esta agora. Logo, ele nao valida migration nova nem
    # funcao nova do candidato; isso continua sendo exclusividade do run canonico.
    #
    # A unica mutacao permitida e em fixture sintetica, com ator e run_tag proprios do run. A
    # limpeza e a prova de residuo zero permanecem obrigatorias e fail-closed tambem aqui.
    if: ${{ inputs.diagnostic_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    steps:
      # --- Guardas. Falham rapido mesmo em diagnostico: sem elas nada abaixo tem sentido. ---
      - name: Validate staging dispatch branch before any diagnostic work
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "${DISPATCH_ACTOR,,}" = vnd93
          test "${TRIGGERING_ACTOR,,}" = vnd93
      - name: Checkout exact staging candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout approved rollback frontend baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.rollback_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: baseline
      - name: Resolve and verify the exact staging candidate
        id: candidate
        working-directory: candidate
        env:
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "$candidate_sha" origin/main
          test "$(printf '%s' "$ROLLBACK_REF" | grep -E '^[a-f0-9]{40}$')" = "$ROLLBACK_REF"
          test "$(git -C ../baseline rev-parse HEAD)" = "$ROLLBACK_REF"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve what staging actually serves right now
        id: live
        run: |
          set -euo pipefail
          for alias in ev2-g12-canary ev2-g17-canary; do
            release="$(curl -fsS --max-time 30 "https://$alias.gaiatec-cms-staging.pages.dev/healthz" | jq -r '.release')"
            test "$(printf '%s' "$release" | grep -E '^[a-f0-9]{40}$')" = "$release"
            case "$alias" in
              ev2-g12-canary) echo "g12_sha=$release" >> "$GITHUB_OUTPUT" ;;
              ev2-g17-canary) echo "g17_sha=$release" >> "$GITHUB_OUTPUT" ;;
            esac
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Link the Supabase CLI to the authorized staging project
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p outputs
          test "$STAGING_SUPABASE_PROJECT_REF" = "glcqsosxwgmlhzgcsnzv"
          # `link` e local: escreve supabase/.temp no workspace e nao muta o projeto remoto. Os
          # canarios recusam o alvo quando o CLI nao esta vinculado, e sem isso nenhum check roda.
          # Nenhum `db push` aqui: aplicar migration continua exclusividade do run canonico.
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF" --yes
      - name: Install the exact candidate
        working-directory: candidate
        run: npm ci
      - name: Install the browser the canaries drive
        working-directory: candidate
        run: npx playwright install --with-deps chromium

      # --- Gates. Cada um roda ate o fim; a falha e registrada, nao aborta a passada. ---
      - name: DIAGNOSTIC local check suite
        id: gate_local_check
        continue-on-error: true
        working-directory: candidate
        run: |
          npm run check
          npm audit --audit-level=high
      - name: DIAGNOSTIC source-backed CMS coverage matrix
        id: gate_coverage_matrix
        continue-on-error: true
        working-directory: candidate
        run: node scripts/qa/cms-coverage-inventory.mjs --output outputs/g12-cms-coverage-matrix.json
      - name: DIAGNOSTIC append-only backend and rollback compatibility
        id: gate_backend_compatibility
        continue-on-error: true
        working-directory: candidate
        run: |
          mkdir -p outputs
          node scripts/ev2/phase12/verify-backend-forward-compatibility.mjs \
            --candidate . --baseline ../baseline --report outputs/g12-backend-compatibility.json
      - name: DIAGNOSTIC live staging database against candidate source
        id: gate_staging_database
        continue-on-error: true
        working-directory: candidate
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: node scripts/ev2/phase12/verify-staging-database.mjs --source . | tee ../diagnostic-staging-database.json
      - name: DIAGNOSTIC post-baseline migration scenarios with isolated synthetic data
        id: gate_migrations_canary
        continue-on-error: true
        timeout-minutes: 30
        working-directory: candidate
        run: node scripts/ev2/phase12/staging-migrations-canary.mjs
        env:
          G12_MIGRATION_CANARY_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          G12_MIGRATION_CANARY_REPORT_PATH: ../diagnostic-staging-migrations-canary.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: DIAGNOSTIC G11 system canary against the live isolated alias
        id: gate_g11_canary
        continue-on-error: true
        timeout-minutes: 40
        working-directory: candidate
        run: npm run canary:ev2:phase11
        env:
          # Este passe nao publica nada, entao o alias serve o SHA anterior. O canario, porem, e o do
          # candidato: e exatamente esse par, codigo novo contra o backend atual, que expoe a classe
          # de defeito de fixture contra schema que consumiu seis candidatos.
          EV2_G11_CANDIDATE_ORIGIN: https://ev2-g12-canary.gaiatec-cms-staging.pages.dev
          EV2_G11_EXPECTED_SHA: ${{ steps.live.outputs.g12_sha }}
          EV2_G11_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          # O alias so serve o candidato depois que um run canonico o publica. Enquanto isso, medir a
          # pagina publicada e medir o build anterior, e o numero obtido nao e do candidato.
          EV2_G11_FRONTEND_UNDER_TEST: ${{ steps.live.outputs.g12_sha == steps.candidate.outputs.sha }}
          EV2_G11_REPORT_PATH: ../diagnostic-g11-canary.json
          EV2_G11_TIMING_REPORT_PATH: ../diagnostic-g11-timing-samples.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: DIAGNOSTIC public route probe and latency budget
        id: gate_live_probe
        continue-on-error: true
        working-directory: candidate
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.live.outputs.g17_sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: ../diagnostic-staging-probe.json
      - name: DIAGNOSTIC public, anonymous, CORS and secret boundaries
        id: gate_boundary
        continue-on-error: true
        working-directory: candidate
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: node scripts/ev2/phase12/probe-supabase-boundary.mjs | tee ../diagnostic-staging-boundary.json
        env:
          CMS_BACKEND_ENVIRONMENT: staging
          CMS_BACKEND_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          CMS_BACKEND_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          CMS_BACKEND_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
      - name: DIAGNOSTIC governed editorial lifecycle end to end
        id: gate_lifecycle
        continue-on-error: true
        timeout-minutes: 30
        working-directory: candidate
        run: |
          # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `-e` ja vem ligado por
          # padrao; falta so o pipefail para a falha do comando da esquerda reprovar o passo.
          set -o pipefail
          qa_date="$(date -u +%Y%m%d)"
          export GAIATEC_QA_RUN_TAG="QA-CMS-FINAL-${qa_date}-${GAIATEC_EXPECTED_SHA:0:8}"
          node scripts/phase7/staging-roundtrip.mjs | tee ../diagnostic-staging-lifecycle.json
        env:
          GAIATEC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          GAIATEC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          GAIATEC_STAGING_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          GAIATEC_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: DIAGNOSTIC operational CMS canary
        id: gate_phase17_canary
        continue-on-error: true
        timeout-minutes: 30
        working-directory: candidate
        # `cmd | tee` sob `bash -e` devolve o status do tee, sempre 0. `shell: bash` liga
        # `-eo pipefail`, entao a falha do comando da esquerda volta a reprovar o passo.
        shell: bash
        run: node scripts/ev2/phase17/staging-canary.mjs | tee ../diagnostic-g17-canary.json
        env:
          EV2_G17_EXPECTED_SHA: ${{ steps.live.outputs.g17_sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --- Fixture autenticada. Mutacao permitida: ator e run_tag proprios deste run. ---
      # A fixture autenticada exige duas coisas ao mesmo tempo: que `git rev-parse HEAD` do checkout
      # seja o SHA esperado e que `/healthz` de ev2-g17-canary sirva esse mesmo SHA. Num passe que
      # nao publica nada as duas condicoes se excluem, e forcar qualquer uma delas produz falha
      # garantida — pior do que nao rodar, porque ensina a ignorar o vermelho do passe.
      #
      # Entao ela roda exatamente quando pode: quando o alias ja serve o candidato, o que acontece ao
      # rediagnosticar um SHA que o run canonico ja publicou. Fora disso o gate fica `skipped`, e o
      # relatorio o reporta como nao exercitado em vez de aprovado.
      - name: DIAGNOSTIC isolated MFA actor provisioning
        id: gate_browser_fixture
        if: steps.live.outputs.g17_sha == steps.candidate.outputs.sha
        continue-on-error: true
        timeout-minutes: 10
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs setup
        env:
          QA_CMS_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_PROVISION_AUTH_LIFECYCLE: "true"
          QA_CMS_FIXTURE_STATE_PATH: outputs/diagnostic-browser-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/diagnostic-browser-setup.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --- Limpeza e residuo: obrigatorios e fail-closed, mesmo em diagnostico. ---
      - name: Revoke the diagnostic actor and verify zero active residue
        id: diagnostic_cleanup
        if: always() && steps.gate_browser_fixture.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs cleanup
        env:
          QA_CMS_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/diagnostic-browser-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/diagnostic-browser-cleanup.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Retry the diagnostic actor cleanup after a cleanup failure
        if: always() && steps.diagnostic_cleanup.outcome == 'failure'
        timeout-minutes: 15
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs cleanup
        env:
          QA_CMS_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/diagnostic-browser-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/diagnostic-browser-cleanup-retry.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Prove terminal zero residue for the diagnostic lease
        id: gate_residue
        if: always() && steps.gate_browser_fixture.outcome != 'skipped'
        timeout-minutes: 10
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs residue
        env:
          QA_CMS_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/diagnostic-browser-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/diagnostic-browser-residue.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --- Relatorio consolidado ---
      - name: Refuse any evidence file touched by a diagnostic pass
        if: always()
        working-directory: candidate
        run: test -z "$(git status --porcelain --untracked-files=all -- .github/release-controls/evidence)"
      - name: Materialize the consolidated diagnostic report
        id: diagnostic_report
        if: always()
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          LIVE_G12_SHA: ${{ steps.live.outputs.g12_sha }}
          LIVE_G17_SHA: ${{ steps.live.outputs.g17_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OUTCOME_LOCAL_CHECK: ${{ steps.gate_local_check.outcome }}
          OUTCOME_COVERAGE_MATRIX: ${{ steps.gate_coverage_matrix.outcome }}
          OUTCOME_BACKEND_COMPATIBILITY: ${{ steps.gate_backend_compatibility.outcome }}
          OUTCOME_STAGING_DATABASE: ${{ steps.gate_staging_database.outcome }}
          OUTCOME_MIGRATIONS_CANARY: ${{ steps.gate_migrations_canary.outcome }}
          OUTCOME_G11_CANARY: ${{ steps.gate_g11_canary.outcome }}
          OUTCOME_LIVE_PROBE: ${{ steps.gate_live_probe.outcome }}
          OUTCOME_BOUNDARY: ${{ steps.gate_boundary.outcome }}
          OUTCOME_LIFECYCLE: ${{ steps.gate_lifecycle.outcome }}
          OUTCOME_PHASE17_CANARY: ${{ steps.gate_phase17_canary.outcome }}
          OUTCOME_BROWSER_FIXTURE: ${{ steps.gate_browser_fixture.outcome }}
          OUTCOME_DIAGNOSTIC_CLEANUP: ${{ steps.diagnostic_cleanup.outcome }}
          OUTCOME_RESIDUE: ${{ steps.gate_residue.outcome }}
        run: node candidate/scripts/ev2/phase12/diagnostic-report.mjs --output diagnostic-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diagnostic-${{ steps.candidate.outputs.sha }}
          path: |
            diagnostic-report.json
            diagnostic-staging-database.json
            diagnostic-staging-migrations-canary.json
            diagnostic-g11-canary.json
            diagnostic-g11-timing-samples.json
            diagnostic-staging-probe.json
            diagnostic-staging-boundary.json
            diagnostic-staging-lifecycle.json
            diagnostic-g17-canary.json
            candidate/outputs/diagnostic-browser-setup.json
            candidate/outputs/diagnostic-browser-cleanup.json
            candidate/outputs/diagnostic-browser-cleanup-retry.json
            candidate/outputs/diagnostic-browser-residue.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail the diagnostic pass when any gate reproved
        if: always()
        env:
          FAILED_GATES: ${{ steps.diagnostic_report.outputs.failed_gates }}
        run: |
          set -euo pipefail
          test -n "$FAILED_GATES"
          test "$FAILED_GATES" = "0"

  post_deploy_frontend_readonly:
    # This branch performs only GET-style live probes and evidence reads. It cannot reach Wrangler,
    # Supabase mutation commands, fixture setup, or any authenticated editorial write.
    needs: deploy
    if: ${{ !inputs.diagnostic_run && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.frontend_post_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.frontend_post_artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout exact candidate for read-only frontend post-deploy gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.deploy.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Use the candidate-pinned Node runtime for frontend read-only gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Download exact staging evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.deploy.outputs.evidence_artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: staging-evidence
      - name: Install candidate dependencies without rebuilding the sealed artifact
        working-directory: candidate
        run: npm ci
      - name: Revalidate frontend evidence content read-only
        run: >-
          node candidate/scripts/ev2/phase12/verify-staging-evidence.mjs
          staging-evidence/candidate/outputs/staging-artifact-bindings.json
          staging-evidence/candidate/outputs/cms-final-coverage.json
          staging-evidence/g16-csp-browser.json
          staging-evidence/g12-staging-probe.json
      - name: Probe the canonical staging frontend after deploy without mutation
        working-directory: candidate
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: outputs/post-deploy-frontend-readonly.json
      - name: Seal frontend read-only post-deploy evidence
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          SOURCE_ARTIFACT_ID: ${{ needs.deploy.outputs.evidence_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.evidence_artifact_digest }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$SOURCE_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$SOURCE_ARTIFACT_ID"
          test "$(printf '%s' "$SOURCE_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$SOURCE_ARTIFACT_DIGEST"
          mkdir -p post-deploy-frontend-readonly
          cp candidate/outputs/post-deploy-frontend-readonly.json post-deploy-frontend-readonly/
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");
          const report = "post-deploy-frontend-readonly/post-deploy-frontend-readonly.json";
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.post_deploy_frontend_readonly.passed",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.GITHUB_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            sourceArtifact: {
              id: process.env.SOURCE_ARTIFACT_ID,
              digest: process.env.SOURCE_ARTIFACT_DIGEST.startsWith("sha256:")
                ? process.env.SOURCE_ARTIFACT_DIGEST
                : `sha256:${process.env.SOURCE_ARTIFACT_DIGEST}`,
            },
            checks: { priorEvidence: true, canonicalLiveProbe: true, mutationAttempted: false },
            reportSha256: createHash("sha256").update(readFileSync(report)).digest("hex"),
          };
          writeFileSync(
            "post-deploy-frontend-readonly/frontend-readonly-evidence.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE
      - name: Upload immutable frontend read-only post-deploy evidence
        id: frontend_post_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-post-frontend-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-deploy-frontend-readonly
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  post_deploy_backend_readonly:
    # The management endpoint receives SELECT-only SQL; no migration, secret, Auth, Edge Function,
    # fixture or deployment mutation is reachable from this parallel post-deploy branch.
    needs: deploy
    if: ${{ !inputs.diagnostic_run && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    outputs:
      artifact_id: ${{ steps.backend_post_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.backend_post_artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout exact candidate for read-only backend post-deploy gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.deploy.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Use the candidate-pinned Node runtime for backend read-only gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Download exact staging evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.deploy.outputs.evidence_artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: staging-evidence
      - name: Revalidate backend evidence content read-only
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          RELEASE_PROFILE: ${{ needs.deploy.outputs.release_profile }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const profile = JSON.parse(
            readFileSync("staging-evidence/candidate/outputs/staging-release-profile-evidence.json", "utf8"),
          );
          const expected = {
            "frontend-only": { edge: false, databaseAuth: false },
            "edge-only": { edge: true, databaseAuth: false },
            "database-auth": { edge: false, databaseAuth: true },
            "full-release": { edge: true, databaseAuth: true },
          }[process.env.RELEASE_PROFILE];
          if (
            !expected ||
            profile.schemaVersion !== 1 ||
            profile.event !== "g12.staging.release_profile.evidence" ||
            profile.candidateSha !== process.env.CANDIDATE_SHA ||
            profile.releaseProfile !== process.env.RELEASE_PROFILE ||
            profile.gates?.edge?.required !== expected.edge ||
            profile.gates?.edge?.status !== (expected.edge ? "passed" : "not-required") ||
            profile.gates?.databaseAuth?.required !== expected.databaseAuth ||
            profile.gates?.databaseAuth?.status !== (expected.databaseAuth ? "passed" : "not-required")
          ) throw new Error("G12_STAGING_PROFILE_EVIDENCE_BINDING_INVALID");
          NODE
          evidence_files=(
            staging-evidence/candidate/outputs/staging-release-profile-evidence.json
            staging-evidence/candidate/outputs/g12-backend-compatibility.json
            staging-evidence/g12-staging-database.json
            staging-evidence/g12-staging-boundary.json
            staging-evidence/g17-staging-canary.json
          )
          edge_evidence=(
            staging-evidence/candidate/outputs/g12-staging-function-deployment.json
            staging-evidence/g12-staging-functions.json
          )
          database_auth_evidence=(
            staging-evidence/g12-staging-auth.json
            staging-evidence/g12-staging-migrations-canary.json
          )
          case "$RELEASE_PROFILE" in
            frontend-only) ;;
            edge-only) evidence_files+=("${edge_evidence[@]}") ;;
            database-auth) evidence_files+=("${database_auth_evidence[@]}") ;;
            full-release) evidence_files+=("${edge_evidence[@]}" "${database_auth_evidence[@]}") ;;
            *) echo "G12_STAGING_RELEASE_PROFILE_INVALID" >&2; exit 1 ;;
          esac
          node candidate/scripts/ev2/phase12/verify-staging-evidence.mjs "${evidence_files[@]}"
      - name: Recheck exact staging function inventory read-only
        working-directory: candidate
        env:
          RELEASE_PROFILE: ${{ needs.deploy.outputs.release_profile }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = glcqsosxwgmlhzgcsnzv
          mkdir -p ../post-deploy-backend-readonly
          supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF" --output json \
            > ../post-deploy-backend-readonly/functions.json
          case "$RELEASE_PROFILE" in
            edge-only|full-release)
              node scripts/ev2/phase12/verify-production-functions.mjs \
                --file ../post-deploy-backend-readonly/functions.json \
                --receipt ../staging-evidence/candidate/outputs/g12-staging-function-deployment.json \
                --source . --candidate "${{ needs.deploy.outputs.candidate_sha }}" \
                --environment staging --project-ref "$STAGING_SUPABASE_PROJECT_REF"
              ;;
            frontend-only|database-auth)
              test ! -e ../staging-evidence/candidate/outputs/g12-staging-function-deployment.json
              node scripts/ev2/phase12/verify-production-functions.mjs \
                --file ../post-deploy-backend-readonly/functions.json \
                --environment staging --project-ref "$STAGING_SUPABASE_PROJECT_REF"
              ;;
            *) echo "G12_STAGING_RELEASE_PROFILE_INVALID" >&2; exit 1 ;;
          esac
      - name: Recheck staging database contracts with SELECT-only SQL
        working-directory: candidate
        shell: bash
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          node scripts/ev2/phase12/verify-staging-database.mjs --source . |
          tee ../post-deploy-backend-readonly/database.json
      - name: Recheck public and anonymous backend boundaries read-only
        working-directory: candidate
        shell: bash
        env:
          CMS_BACKEND_ENVIRONMENT: staging
          CMS_BACKEND_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          CMS_BACKEND_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          CMS_BACKEND_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
        run: >-
          node scripts/ev2/phase12/probe-supabase-boundary.mjs |
          tee ../post-deploy-backend-readonly/boundary.json
      - name: Seal backend read-only post-deploy evidence
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          RELEASE_PROFILE: ${{ needs.deploy.outputs.release_profile }}
          SOURCE_ARTIFACT_ID: ${{ needs.deploy.outputs.evidence_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.evidence_artifact_digest }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$SOURCE_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$SOURCE_ARTIFACT_ID"
          test "$(printf '%s' "$SOURCE_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$SOURCE_ARTIFACT_DIGEST"
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");
          const files = ["functions.json", "database.json", "boundary.json"];
          const root = "post-deploy-backend-readonly";
          const edgeRequired = ["edge-only", "full-release"].includes(process.env.RELEASE_PROFILE);
          if (!["frontend-only", "edge-only", "database-auth", "full-release"].includes(process.env.RELEASE_PROFILE))
            throw new Error("G12_STAGING_RELEASE_PROFILE_INVALID");
          const reports = Object.fromEntries(
            files.map((name) => [name, createHash("sha256").update(readFileSync(`${root}/${name}`)).digest("hex")]),
          );
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.post_deploy_backend_readonly.passed",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.GITHUB_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            releaseProfile: process.env.RELEASE_PROFILE,
            sourceArtifact: {
              id: process.env.SOURCE_ARTIFACT_ID,
              digest: process.env.SOURCE_ARTIFACT_DIGEST.startsWith("sha256:")
                ? process.env.SOURCE_ARTIFACT_DIGEST
                : `sha256:${process.env.SOURCE_ARTIFACT_DIGEST}`,
            },
            checks: {
              priorEvidence: true,
              profileEvidence: true,
              edgeRequired,
              functions: edgeRequired ? "candidate-receipt-bound" : "live-inventory-only-not-required",
              databaseSelectOnly: true,
              publicBoundary: true,
              mutationAttempted: false,
            },
            reports,
          };
          writeFileSync(`${root}/backend-readonly-evidence.json`, `${JSON.stringify(evidence, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Upload immutable backend read-only post-deploy evidence
        id: backend_post_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-post-backend-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-deploy-backend-readonly
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  browser_attestation:
    # The authenticated real-Chrome mutation lane starts only after every automatic deploy and
    # read-only post-deploy gate is green. The challenge is created just in time, after the consumer
    # has proved readiness, and every synthetic lease is bound to the durable pre-mutation run tag.
    needs: [deploy, post_deploy_frontend_readonly, post_deploy_backend_readonly]
    if: >-
      ${{ !inputs.diagnostic_run && needs.deploy.result == 'success' &&
      needs.post_deploy_frontend_readonly.result == 'success' &&
      needs.post_deploy_backend_readonly.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: staging
    outputs:
      artifact_id: ${{ steps.browser_evidence_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.browser_evidence_artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout exact candidate for just-in-time browser attestation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.deploy.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout exact approved rollback frontend baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.deploy.outputs.rollback_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: baseline
      - name: Use the candidate-pinned Node runtime for browser attestation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Download preliminary staging evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.deploy.outputs.evidence_artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: staging-evidence
      - name: Install candidate dependencies without rebuilding sealed frontend bytes
        working-directory: candidate
        run: npm ci
      - name: Install the isolated Chromium used by the authenticated gates
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Rebind preliminary bytes and automatic gate artifacts before browser mutation
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          PRELIMINARY_ARTIFACT_ID: ${{ needs.deploy.outputs.evidence_artifact_id }}
          PRELIMINARY_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.evidence_artifact_digest }}
          FRONTEND_ARTIFACT_ID: ${{ needs.post_deploy_frontend_readonly.outputs.artifact_id }}
          FRONTEND_ARTIFACT_DIGEST: ${{ needs.post_deploy_frontend_readonly.outputs.artifact_digest }}
          BACKEND_ARTIFACT_ID: ${{ needs.post_deploy_backend_readonly.outputs.artifact_id }}
          BACKEND_ARTIFACT_DIGEST: ${{ needs.post_deploy_backend_readonly.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const id = /^[1-9]\d*$/;
          const digest = /^(?:sha256:)?[a-f0-9]{64}$/;
          for (const name of ["PRELIMINARY_ARTIFACT_ID", "FRONTEND_ARTIFACT_ID", "BACKEND_ARTIFACT_ID"])
            if (!id.test(process.env[name] || "")) throw new Error("G12_BROWSER_SOURCE_ARTIFACT_ID_INVALID");
          for (const name of [
            "PRELIMINARY_ARTIFACT_DIGEST",
            "FRONTEND_ARTIFACT_DIGEST",
            "BACKEND_ARTIFACT_DIGEST",
          ])
            if (!digest.test(process.env[name] || ""))
              throw new Error("G12_BROWSER_SOURCE_ARTIFACT_DIGEST_INVALID");
          const binding = JSON.parse(
            readFileSync("staging-evidence/candidate/outputs/staging-artifact-bindings.json", "utf8"),
          );
          if (
            binding.schemaVersion !== 1 ||
            binding.event !== "g12.staging.artifacts.bound" ||
            binding.candidateSha !== process.env.CANDIDATE_SHA
          ) throw new Error("G12_BROWSER_PRELIMINARY_BINDING_INVALID");
          NODE
          node candidate/scripts/ev2/phase12/verify-staging-evidence.mjs \
            staging-evidence/candidate/outputs/staging-artifact-bindings.json \
            staging-evidence/candidate/outputs/g12-cms-coverage-matrix.json \
            staging-evidence/candidate/outputs/cms-final-coverage.json \
            staging-evidence/baseline/outputs/cms-coverage-rollback.json
          mkdir -p candidate/outputs baseline/outputs
          cp staging-evidence/candidate/outputs/g12-cms-coverage-matrix.json candidate/outputs/
          cp staging-evidence/candidate/outputs/cms-final-coverage.json candidate/outputs/
          cp staging-evidence/baseline/outputs/cms-coverage-rollback.json baseline/outputs/
      - name: Prebind the durable browser recovery identity to this exact candidate
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          BROWSER_RUN_TAG: ${{ needs.deploy.outputs.browser_run_tag }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$CANDIDATE_SHA" | grep -E '^[a-f0-9]{40}$')" = "$CANDIDATE_SHA"
          test "$(printf '%s' "$BROWSER_RUN_TAG" | grep -E '^QA-CMS-FINAL-[0-9]{8}-[a-f0-9]{8}$')" = "$BROWSER_RUN_TAG"
          test "${BROWSER_RUN_TAG##*-}" = "${CANDIDATE_SHA:0:8}"
          printf 'QA_CMS_RUN_TAG=%s\n' "$BROWSER_RUN_TAG" >> "$GITHUB_ENV"
      - name: Verify exact candidate and rollback checkouts are clean before browser mutation
        run: |
          set -euo pipefail
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          test -z "$(git -C baseline status --porcelain --untracked-files=all)"
      - name: Provision an isolated MFA actor for authenticated rollback compatibility
        id: rollback_browser_fixture
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs setup
        env:
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/cms-browser-rollback-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/cms-browser-rollback-setup.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Provision the isolated MFA actor for the mutating browser cycle
        id: browser_mutating_fixture
        timeout-minutes: 10
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs setup
        env:
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_PROVISION_AUTH_LIFECYCLE: "true"
          QA_CMS_PROVISION_PIM_CATALOG: "true"
          QA_CMS_FIXTURE_STATE_PATH: outputs/cms-browser-mutating-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/cms-browser-mutating-setup.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Run the complete authenticated mutating editorial cycle first
        timeout-minutes: 80
        working-directory: candidate
        run: |
          set -euo pipefail
          run_browser() {
            env -u RELEASE_GUARD_TOKEN -u EVIDENCE_SALT npx playwright "$@"
          }
          run_browser test tests/e2e/cms-auth-lifecycle.spec.ts --project=desktop-chromium --workers=1 --retries=0 --grep @mutating
          real_browser_readiness_file=outputs/cms-real-browser-consumer-ready.json
          node scripts/ev2/phase12/run-real-browser-attestation-consumer.mjs \
            --environment staging \
            --candidate-sha "${{ needs.deploy.outputs.candidate_sha }}" \
            --control-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-tag "$QA_CMS_RUN_TAG" \
            --challenge-file outputs/cms-real-browser-challenge.json \
            --output-json outputs/cms-real-browser-attestation.json \
            --output-png outputs/cms-real-browser-attestation.png \
            --readiness-file "$real_browser_readiness_file" \
            --challenge-wait-seconds 2100 &
          real_browser_consumer_pid=$!
          trap 'kill "$real_browser_consumer_pid" 2>/dev/null || true; wait "$real_browser_consumer_pid" 2>/dev/null || true; rm -f -- "$real_browser_readiness_file"' EXIT
          trap 'kill "$real_browser_consumer_pid" 2>/dev/null || true; wait "$real_browser_consumer_pid" 2>/dev/null || true; rm -f -- "$real_browser_readiness_file"; exit 130' INT
          trap 'kill "$real_browser_consumer_pid" 2>/dev/null || true; wait "$real_browser_consumer_pid" 2>/dev/null || true; rm -f -- "$real_browser_readiness_file"; exit 143' TERM
          consumer_ready=false
          for readiness_backoff in 1 1 2 3 5 8 10 10 10 10; do
            if ! kill -0 "$real_browser_consumer_pid" 2>/dev/null; then
              set +e
              wait "$real_browser_consumer_pid"
              consumer_status=$?
              set -e
              if [ "$consumer_status" -eq 0 ]; then
                echo "G12_REAL_BROWSER_CONSUMER_EXITED_BEFORE_READINESS" >&2
                exit 1
              fi
              exit "$consumer_status"
            fi
            if [ -e "$real_browser_readiness_file" ]; then
              node scripts/ev2/phase12/run-real-browser-attestation-consumer.mjs verify-readiness \
                --environment staging \
                --candidate-sha "${{ needs.deploy.outputs.candidate_sha }}" \
                --control-sha "${{ github.sha }}" \
                --run-id "${{ github.run_id }}" \
                --run-attempt "${{ github.run_attempt }}" \
                --run-tag "$QA_CMS_RUN_TAG" \
                --challenge-file outputs/cms-real-browser-challenge.json \
                --output-json outputs/cms-real-browser-attestation.json \
                --output-png outputs/cms-real-browser-attestation.png \
                --readiness-file "$real_browser_readiness_file"
              kill -0 "$real_browser_consumer_pid" 2>/dev/null
              consumer_ready=true
              break
            fi
            sleep "$readiness_backoff" &
            readiness_timer_pid=$!
            completed_pid=""
            set +e
            wait -n -p completed_pid "$real_browser_consumer_pid" "$readiness_timer_pid"
            wait_status=$?
            set -e
            if [ "$completed_pid" = "$real_browser_consumer_pid" ]; then
              kill "$readiness_timer_pid" 2>/dev/null || true
              wait "$readiness_timer_pid" 2>/dev/null || true
              if [ "$wait_status" -eq 0 ]; then
                echo "G12_REAL_BROWSER_CONSUMER_EXITED_BEFORE_READINESS" >&2
                exit 1
              fi
              exit "$wait_status"
            fi
            wait "$readiness_timer_pid" 2>/dev/null || true
          done
          if [ "$consumer_ready" != true ]; then
            echo "G12_REAL_BROWSER_CONSUMER_READINESS_TIMEOUT" >&2
            exit 1
          fi
          run_browser test tests/e2e/cms-final-coverage.spec.ts --project=desktop-chromium --workers=1 --retries=0 --grep @ui-bootstrap
          wait "$real_browser_consumer_pid"
          test ! -e "$real_browser_readiness_file"
          trap - EXIT INT TERM
          run_browser test tests/e2e/cms-admin-ops-cycles.spec.ts --project=desktop-chromium --workers=1 --retries=0 --grep @mutating
          run_browser test tests/e2e/cms-secondary-ui-cycles.spec.ts --project=desktop-chromium --workers=1 --retries=0 --grep @mutating
          run_browser test tests/e2e/cms-security-boundaries.spec.ts --project=desktop-chromium --workers=1 --retries=0 --grep @security-staging
        env:
          PLAYWRIGHT_BASE_URL: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          QA_CMS_AUTH_REPORT_PATH: outputs/cms-auth-lifecycle.json
          QA_CMS_REPORT_PATH: outputs/cms-final-coverage.json
          QA_CMS_ADMIN_OPS_REPORT_PATH: outputs/cms-admin-ops-cycles.json
          QA_CMS_SECONDARY_REPORT_PATH: outputs/cms-secondary-ui-cycles.json
          QA_CMS_SECURITY_REPORT_PATH: outputs/cms-security-boundaries.json
          QA_CMS_UI_CREATED_STATE_PATH: outputs/cms-ui-created-state.json
          QA_CMS_SECURITY_REQUIRED: "true"
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_REAL_BROWSER_REQUIRED: "true"
          QA_CMS_REAL_BROWSER_CHALLENGE_PATH: outputs/cms-real-browser-challenge.json
          QA_CMS_REAL_BROWSER_ATTESTATION_PATH: outputs/cms-real-browser-attestation.json
          QA_CMS_REAL_BROWSER_SCREENSHOT_PATH: outputs/cms-real-browser-attestation.png
          QA_CMS_PARENT_RUN_ID: ${{ github.run_id }}
          QA_CMS_PARENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          QA_CMS_CONTROL_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: Vnd93/gaiatec-cms
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          EVIDENCE_SALT: ${{ secrets.EVIDENCE_SALT }}
      - name: Clear the single-use staging browser rendezvous variables
        id: browser_rendezvous_cleanup
        if: always()
        timeout-minutes: 5
        working-directory: candidate
        run: |
          set -euo pipefail
          cleanup_status=0
          node scripts/ev2/phase12/run-real-browser-attestation-consumer.mjs clear-challenge \
            --environment staging \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --allow-missing || cleanup_status=1
          node scripts/ev2/phase12/real-browser-attestation-store.mjs clear \
            --environment staging \
            --candidate-sha "${{ needs.deploy.outputs.candidate_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --control-sha "${{ github.sha }}" \
            --allow-missing || cleanup_status=1
          exit "$cleanup_status"
        env:
          GITHUB_REPOSITORY: Vnd93/gaiatec-cms
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          EVIDENCE_SALT: ${{ secrets.EVIDENCE_SALT }}
      - name: Prove legacy-shaped and hybrid envelopes fail closed against the exact candidate
        timeout-minutes: 15
        working-directory: candidate
        run: |
          npx playwright test tests/e2e/cms-public-forward-compatibility.spec.ts \
            --project=desktop-chromium --workers=1 --retries=0
          node scripts/ev2/phase12/verify-public-bridge-forward-canary.mjs \
            --file outputs/cms-public-forward-compatibility.json \
            --candidate "${{ needs.deploy.outputs.candidate_sha }}" \
            --deployment-id "${{ needs.deploy.outputs.canonical_deployment_id }}"
        env:
          PLAYWRIGHT_BASE_URL: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          QA_CMS_PUBLIC_FORWARD_REQUIRED: "true"
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_FORWARD_DEPLOYMENT_ID: ${{ needs.deploy.outputs.canonical_deployment_id }}
          QA_CMS_UI_CREATED_STATE_PATH: outputs/cms-ui-created-state.json
          QA_CMS_BRIDGE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          QA_CMS_BRIDGE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          QA_CMS_BRIDGE_REPORT_PATH: outputs/cms-public-forward-compatibility.json
      - name: Traverse every authenticated route, menu and required viewport on the same lease
        timeout-minutes: 30
        working-directory: candidate
        run: >-
          npx playwright test tests/e2e/cms-final-coverage.spec.ts
          --project=desktop-chromium --workers=1 --retries=0 --grep @semantic
        env:
          PLAYWRIGHT_BASE_URL: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          QA_CMS_REPORT_PATH: outputs/cms-final-coverage.json
          QA_CMS_UI_CREATED_STATE_PATH: outputs/cms-ui-created-state.json
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
      - name: Traverse the rollback frontend with an AAL2 session against the candidate backend
        timeout-minutes: 30
        working-directory: candidate
        run: >-
          npx playwright test tests/e2e/cms-final-coverage.spec.ts
          --project=desktop-chromium --workers=1 --retries=0
          --grep "sessão AAL2 percorre todas as superfícies"
        env:
          PLAYWRIGHT_BASE_URL: https://ev2-g12-rollback-compat.gaiatec-cms-staging.pages.dev
          QA_CMS_REPORT_PATH: outputs/cms-rollback-authenticated-compatibility.json
          QA_CMS_COVERAGE_INVENTORY_PATH: ../baseline/outputs/cms-coverage-rollback.json
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_FRONTEND_EXPECTED_SHA: ${{ needs.deploy.outputs.rollback_sha }}
          QA_CMS_ROLLBACK_COMPATIBILITY: "true"
          QA_CMS_TARGET_ENVIRONMENT: staging
      - name: Revoke the rollback compatibility actor and verify zero active residue
        id: rollback_browser_cleanup
        if: always() && steps.rollback_browser_fixture.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs cleanup
        env:
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/cms-browser-rollback-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/cms-browser-rollback-cleanup.json
          QA_CMS_ADMIN_OPS_REPORT_PATH: outputs/cms-browser-rollback-admin-ops.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Retry rollback compatibility actor cleanup after a cleanup failure
        id: rollback_browser_cleanup_retry
        if: >-
          always() && steps.rollback_browser_fixture.outcome != 'skipped' &&
          steps.rollback_browser_cleanup.outcome == 'failure'
        timeout-minutes: 15
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs cleanup
        env:
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/cms-browser-rollback-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/cms-browser-rollback-cleanup-retry.json
          QA_CMS_ADMIN_OPS_REPORT_PATH: outputs/cms-browser-rollback-admin-ops.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Revoke the mutating browser actor and verify zero active residue
        id: browser_mutating_cleanup
        if: always() && steps.browser_mutating_fixture.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs cleanup
        env:
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/cms-browser-mutating-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/cms-browser-mutating-cleanup.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Retry cleanup for the same isolated browser lease
        id: browser_mutating_cleanup_retry
        if: always() && steps.browser_mutating_cleanup.outcome == 'failure'
        timeout-minutes: 15
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs cleanup
        env:
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/cms-browser-mutating-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/cms-browser-mutating-cleanup.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Prove terminal zero residue for the same isolated browser lease
        id: browser_mutating_residue
        if: always() && steps.browser_mutating_cleanup.outcome != 'skipped'
        timeout-minutes: 15
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs residue
        env:
          QA_CMS_EXPECTED_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          QA_CMS_TARGET_ENVIRONMENT: staging
          QA_CMS_FIXTURE_STATE_PATH: outputs/cms-browser-mutating-state.json
          QA_CMS_FIXTURE_REPORT_PATH: outputs/cms-browser-mutating-residue.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Materialize fail-closed terminal CMS coverage from the single bound run
        timeout-minutes: 8
        working-directory: candidate
        run: >-
          node scripts/qa/materialize-cms-terminal-coverage.mjs
          --inventory outputs/g12-cms-coverage-matrix.json
          --runtime outputs/cms-final-coverage.json
          --setup outputs/cms-browser-mutating-setup.json
          --cleanup outputs/cms-browser-mutating-cleanup.json
          --residue outputs/cms-browser-mutating-residue.json
          --auth outputs/cms-auth-lifecycle.json
          --admin outputs/cms-admin-ops-cycles.json
          --secondary outputs/cms-secondary-ui-cycles.json
          --security outputs/cms-security-boundaries.json
          --real-browser outputs/cms-real-browser-attestation.json
          --real-browser-screenshot outputs/cms-real-browser-attestation.png
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --control-sha "${{ github.sha }}"
          --sha "${{ needs.deploy.outputs.candidate_sha }}"
          --environment staging
          --output outputs/cms-terminal-coverage-matrix.json
      - name: Require terminal browser evidence and seal its immutable source binding
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          ROLLBACK_SHA: ${{ needs.deploy.outputs.rollback_sha }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.canonical_deployment_id }}
          BROWSER_RUN_TAG: ${{ needs.deploy.outputs.browser_run_tag }}
          PRELIMINARY_ARTIFACT_ID: ${{ needs.deploy.outputs.evidence_artifact_id }}
          PRELIMINARY_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.evidence_artifact_digest }}
          FRONTEND_ARTIFACT_ID: ${{ needs.post_deploy_frontend_readonly.outputs.artifact_id }}
          FRONTEND_ARTIFACT_DIGEST: ${{ needs.post_deploy_frontend_readonly.outputs.artifact_digest }}
          BACKEND_ARTIFACT_ID: ${{ needs.post_deploy_backend_readonly.outputs.artifact_id }}
          BACKEND_ARTIFACT_DIGEST: ${{ needs.post_deploy_backend_readonly.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          browser_files=(
            candidate/outputs/cms-auth-lifecycle.json
            candidate/outputs/cms-final-coverage.json
            candidate/outputs/cms-admin-ops-cycles.json
            candidate/outputs/cms-secondary-ui-cycles.json
            candidate/outputs/cms-security-boundaries.json
            candidate/outputs/cms-ui-created-state.json
            candidate/outputs/cms-real-browser-attestation.json
            candidate/outputs/cms-real-browser-attestation.png
            candidate/outputs/cms-public-forward-compatibility.json
            candidate/outputs/cms-browser-mutating-setup.json
            candidate/outputs/cms-browser-mutating-cleanup.json
            candidate/outputs/cms-browser-mutating-residue.json
            candidate/outputs/cms-terminal-coverage-matrix.json
            candidate/outputs/cms-browser-rollback-setup.json
            candidate/outputs/cms-browser-rollback-cleanup.json
            candidate/outputs/cms-rollback-authenticated-compatibility.json
          )
          for file in "${browser_files[@]}"; do test -s "$file"; done
          node candidate/scripts/ev2/phase12/verify-staging-evidence.mjs \
            candidate/outputs/cms-auth-lifecycle.json \
            candidate/outputs/cms-final-coverage.json \
            candidate/outputs/cms-admin-ops-cycles.json \
            candidate/outputs/cms-secondary-ui-cycles.json \
            candidate/outputs/cms-security-boundaries.json \
            candidate/outputs/cms-ui-created-state.json \
            candidate/outputs/cms-real-browser-attestation.json \
            candidate/outputs/cms-public-forward-compatibility.json \
            candidate/outputs/cms-browser-mutating-setup.json \
            candidate/outputs/cms-browser-mutating-cleanup.json \
            candidate/outputs/cms-browser-mutating-residue.json \
            candidate/outputs/cms-terminal-coverage-matrix.json \
            candidate/outputs/cms-browser-rollback-setup.json \
            candidate/outputs/cms-browser-rollback-cleanup.json \
            candidate/outputs/cms-rollback-authenticated-compatibility.json
          mkdir -p browser-evidence/candidate/outputs
          cp "${browser_files[@]}" browser-evidence/candidate/outputs/
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, readdirSync, writeFileSync } = require("node:fs");
          const canonicalDigest = (value) => value.startsWith("sha256:") ? value : `sha256:${value}`;
          const root = "browser-evidence/candidate/outputs";
          const reports = Object.fromEntries(
            readdirSync(root).sort().map((name) => [
              name,
              createHash("sha256").update(readFileSync(`${root}/${name}`)).digest("hex"),
            ]),
          );
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.browser_attestation.passed",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.GITHUB_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            deploymentId: process.env.DEPLOYMENT_ID,
            browserRunTag: process.env.BROWSER_RUN_TAG,
            preliminary: {
              id: process.env.PRELIMINARY_ARTIFACT_ID,
              digest: canonicalDigest(process.env.PRELIMINARY_ARTIFACT_DIGEST),
            },
            automaticGates: {
              frontend: {
                id: process.env.FRONTEND_ARTIFACT_ID,
                digest: canonicalDigest(process.env.FRONTEND_ARTIFACT_DIGEST),
              },
              backend: {
                id: process.env.BACKEND_ARTIFACT_ID,
                digest: canonicalDigest(process.env.BACKEND_ARTIFACT_DIGEST),
              },
            },
            checks: {
              consumerReadyBeforeChallenge: true,
              singleUseChallenge: true,
              authenticatedRealChrome: true,
              rollbackAal2: true,
              cleanup: true,
              zeroResidue: true,
              gatesRelaxed: false,
            },
            reports,
          };
          writeFileSync("browser-evidence/browser-jit-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Upload immutable just-in-time browser attestation evidence
        id: browser_evidence_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-browser-attestation-${{ needs.deploy.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  evidence:
    needs: [deploy, post_deploy_frontend_readonly, post_deploy_backend_readonly, browser_attestation]
    if: >-
      ${{ !inputs.diagnostic_run && needs.deploy.result == 'success' &&
      needs.post_deploy_frontend_readonly.result == 'success' &&
      needs.post_deploy_backend_readonly.result == 'success' &&
      needs.browser_attestation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.dag_evidence_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.dag_evidence_artifact.outputs.artifact-digest }}
    steps:
      - name: Download immutable frontend post-deploy evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.post_deploy_frontend_readonly.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: dag-evidence/frontend
      - name: Download immutable backend post-deploy evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.post_deploy_backend_readonly.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: dag-evidence/backend
      - name: Download immutable just-in-time browser evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.browser_attestation.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: dag-evidence/browser
      - name: Bind the complete staging DAG evidence fail-closed
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          ROLLBACK_SHA: ${{ needs.deploy.outputs.rollback_sha }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.canonical_deployment_id }}
          BROWSER_RUN_TAG: ${{ needs.deploy.outputs.browser_run_tag }}
          RELEASE_PROFILE: ${{ needs.deploy.outputs.release_profile }}
          STAGING_ARTIFACT_ID: ${{ needs.deploy.outputs.evidence_artifact_id }}
          STAGING_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.evidence_artifact_digest }}
          FRONTEND_ARTIFACT_ID: ${{ needs.post_deploy_frontend_readonly.outputs.artifact_id }}
          FRONTEND_ARTIFACT_DIGEST: ${{ needs.post_deploy_frontend_readonly.outputs.artifact_digest }}
          BACKEND_ARTIFACT_ID: ${{ needs.post_deploy_backend_readonly.outputs.artifact_id }}
          BACKEND_ARTIFACT_DIGEST: ${{ needs.post_deploy_backend_readonly.outputs.artifact_digest }}
          BROWSER_ARTIFACT_ID: ${{ needs.browser_attestation.outputs.artifact_id }}
          BROWSER_ARTIFACT_DIGEST: ${{ needs.browser_attestation.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const id = /^[1-9]\d*$/;
          const digest = /^(?:sha256:)?[a-f0-9]{64}$/;
          const canonicalDigest = (value) => value.startsWith("sha256:") ? value : `sha256:${value}`;
          for (const name of [
            "STAGING_ARTIFACT_ID",
            "FRONTEND_ARTIFACT_ID",
            "BACKEND_ARTIFACT_ID",
            "BROWSER_ARTIFACT_ID",
          ])
            if (!id.test(process.env[name] || "")) throw new Error("G12_STAGING_DAG_ARTIFACT_ID_INVALID");
          for (const name of [
            "STAGING_ARTIFACT_DIGEST",
            "FRONTEND_ARTIFACT_DIGEST",
            "BACKEND_ARTIFACT_DIGEST",
            "BROWSER_ARTIFACT_DIGEST",
          ])
            if (!digest.test(process.env[name] || "")) throw new Error("G12_STAGING_DAG_ARTIFACT_DIGEST_INVALID");
          const frontend = JSON.parse(readFileSync("dag-evidence/frontend/frontend-readonly-evidence.json", "utf8"));
          const backend = JSON.parse(readFileSync("dag-evidence/backend/backend-readonly-evidence.json", "utf8"));
          const browser = JSON.parse(readFileSync("dag-evidence/browser/browser-jit-evidence.json", "utf8"));
          const edgeRequired = ["edge-only", "full-release"].includes(process.env.RELEASE_PROFILE);
          if (!["frontend-only", "edge-only", "database-auth", "full-release"].includes(process.env.RELEASE_PROFILE))
            throw new Error("G12_STAGING_RELEASE_PROFILE_INVALID");
          if (
            frontend.event !== "g12.staging.post_deploy_frontend_readonly.passed" ||
            backend.event !== "g12.staging.post_deploy_backend_readonly.passed" ||
            browser.event !== "g12.staging.browser_attestation.passed" ||
            frontend.runId !== process.env.GITHUB_RUN_ID ||
            backend.runId !== process.env.GITHUB_RUN_ID ||
            browser.runId !== process.env.GITHUB_RUN_ID ||
            frontend.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            backend.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            browser.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            frontend.controlSha !== process.env.GITHUB_SHA ||
            backend.controlSha !== process.env.GITHUB_SHA ||
            browser.controlSha !== process.env.GITHUB_SHA ||
            frontend.candidateSha !== process.env.CANDIDATE_SHA ||
            backend.candidateSha !== process.env.CANDIDATE_SHA ||
            browser.candidateSha !== process.env.CANDIDATE_SHA ||
            browser.rollbackSha !== process.env.ROLLBACK_SHA ||
            browser.deploymentId !== process.env.DEPLOYMENT_ID ||
            browser.browserRunTag !== process.env.BROWSER_RUN_TAG ||
            backend.releaseProfile !== process.env.RELEASE_PROFILE ||
            backend.checks.edgeRequired !== edgeRequired ||
            backend.checks.functions !==
              (edgeRequired ? "candidate-receipt-bound" : "live-inventory-only-not-required") ||
            frontend.sourceArtifact.id !== process.env.STAGING_ARTIFACT_ID ||
            backend.sourceArtifact.id !== process.env.STAGING_ARTIFACT_ID ||
            frontend.sourceArtifact.digest !== canonicalDigest(process.env.STAGING_ARTIFACT_DIGEST) ||
            backend.sourceArtifact.digest !== canonicalDigest(process.env.STAGING_ARTIFACT_DIGEST) ||
            frontend.checks.mutationAttempted !== false ||
            backend.checks.mutationAttempted !== false ||
            browser.preliminary.id !== process.env.STAGING_ARTIFACT_ID ||
            browser.preliminary.digest !== canonicalDigest(process.env.STAGING_ARTIFACT_DIGEST) ||
            browser.automaticGates.frontend.id !== process.env.FRONTEND_ARTIFACT_ID ||
            browser.automaticGates.frontend.digest !== canonicalDigest(process.env.FRONTEND_ARTIFACT_DIGEST) ||
            browser.automaticGates.backend.id !== process.env.BACKEND_ARTIFACT_ID ||
            browser.automaticGates.backend.digest !== canonicalDigest(process.env.BACKEND_ARTIFACT_DIGEST) ||
            browser.checks.consumerReadyBeforeChallenge !== true ||
            browser.checks.singleUseChallenge !== true ||
            browser.checks.authenticatedRealChrome !== true ||
            browser.checks.rollbackAal2 !== true ||
            browser.checks.cleanup !== true ||
            browser.checks.zeroResidue !== true ||
            browser.checks.gatesRelaxed !== false
          ) throw new Error("G12_STAGING_DAG_EVIDENCE_BINDING_INVALID");
          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.dag_evidence.passed",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.GITHUB_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            releaseProfile: process.env.RELEASE_PROFILE,
            staging: {
              id: process.env.STAGING_ARTIFACT_ID,
              digest: canonicalDigest(process.env.STAGING_ARTIFACT_DIGEST),
            },
            frontend: {
              id: process.env.FRONTEND_ARTIFACT_ID,
              digest: canonicalDigest(process.env.FRONTEND_ARTIFACT_DIGEST),
            },
            backend: {
              id: process.env.BACKEND_ARTIFACT_ID,
              digest: canonicalDigest(process.env.BACKEND_ARTIFACT_DIGEST),
            },
            browser: {
              id: process.env.BROWSER_ARTIFACT_ID,
              digest: canonicalDigest(process.env.BROWSER_ARTIFACT_DIGEST),
            },
            postDeployParallel: true,
            postDeployReadOnly: true,
            browserChallengeJustInTime: true,
            gatesRelaxed: false,
          };
          writeFileSync("dag-evidence/staging-dag-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
      - name: Upload immutable terminal staging DAG evidence
        id: dag_evidence_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-dag-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: dag-evidence/staging-dag-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  finalize:
    # O finalizador compensa mutacoes do run canonico. Em diagnostico nao ha mutacao para compensar.
    needs: [deploy, browser_attestation, evidence]
    if: always() && !inputs.diagnostic_run
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    steps:
      - name: Checkout the trusted staging control revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Use the repository-pinned Node runtime for staging finalization
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Checkout the exact candidate for durable browser recovery
        id: finalizer_candidate_checkout
        if: always() && needs.deploy.outputs.candidate_sha != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.deploy.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Download terminal staging DAG evidence by immutable artifact ID
        id: dag_evidence_download
        if: always() && needs.evidence.result == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.evidence.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: dag-evidence-terminal
      - name: Reverify terminal staging DAG evidence before finalization
        id: dag_evidence_verification
        if: always() && steps.dag_evidence_download.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.evidence.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.evidence.outputs.artifact_digest }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$EXPECTED_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$EXPECTED_ARTIFACT_ID"
          test "$(printf '%s' "$EXPECTED_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$EXPECTED_ARTIFACT_DIGEST"
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const evidence = JSON.parse(readFileSync("dag-evidence-terminal/staging-dag-evidence.json", "utf8"));
          if (
            evidence.event !== "g12.staging.dag_evidence.passed" ||
            evidence.runId !== process.env.GITHUB_RUN_ID ||
            evidence.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
            evidence.controlSha !== process.env.GITHUB_SHA ||
            evidence.candidateSha !== process.env.EXPECTED_CANDIDATE_SHA ||
            evidence.postDeployParallel !== true ||
            evidence.postDeployReadOnly !== true ||
            evidence.browserChallengeJustInTime !== true ||
            evidence.gatesRelaxed !== false
          ) throw new Error("G12_STAGING_DAG_EVIDENCE_INVALID");
          NODE
      - name: Classify the complete staging DAG outcome fail-closed
        id: dag_outcome
        if: always()
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BROWSER_RESULT: ${{ needs.browser_attestation.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          EVIDENCE_VERIFICATION: ${{ steps.dag_evidence_verification.outcome }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_RESULT" = success ] && \
             [ "$BROWSER_RESULT" = success ] && \
             [ "$EVIDENCE_RESULT" = success ] && \
             [ "$EVIDENCE_VERIFICATION" = success ]
          then
            printf 'succeeded=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'succeeded=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Classify the staging mutation boundary without trusting an empty output
        id: mutation_boundary
        env:
          DEPLOY_RESULT: ${{ steps.dag_outcome.outputs.succeeded == 'true' && 'success' || 'failure' }}
          MUTATION_ARMED: ${{ needs.deploy.outputs.mutation_armed }}
          MUTATION_BOUNDARY_OUTCOME: ${{ needs.deploy.outputs.mutation_boundary_outcome }}
        working-directory: control
        run: node scripts/ev2/phase12/staging-mutation-boundary.mjs
      - name: Finalize both single-use staging browser rendezvous variables
        id: real_browser_rendezvous_cleanup
        if: always() && needs.deploy.outputs.candidate_sha != ''
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          GITHUB_REPOSITORY: Vnd93/gaiatec-cms
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          EVIDENCE_SALT: ${{ secrets.EVIDENCE_SALT }}
        run: |
          set -euo pipefail
          cleanup_status=0
          node scripts/ev2/phase12/run-real-browser-attestation-consumer.mjs clear-challenge \
            --environment staging \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --allow-missing || cleanup_status=1
          node scripts/ev2/phase12/real-browser-attestation-store.mjs clear \
            --environment staging \
            --candidate-sha "${{ needs.deploy.outputs.candidate_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --control-sha "${{ github.sha }}" \
            --allow-missing || cleanup_status=1
          exit "$cleanup_status"
      - name: Download mandatory pre-mutation state by immutable artifact ID
        id: state_artifact_download
        if: always() && needs.deploy.outputs.state_artifact_id != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.deploy.outputs.state_artifact_id }}
          digest-mismatch: error
          path: state
      - name: Recover signed staging state when artifact download is unavailable
        id: state_variable_fallback
        if: always() && steps.state_artifact_download.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs get
          --allow-missing
          --kind staging-deploy --file ../state-variable/staging-deploy-state.json
          --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          --control-sha "${{ github.sha }}"
      - name: Validate staging state and workflow binding
        id: finalizer_state
        if: >-
          always() && (steps.mutation_boundary.outputs.mode == 'armed' ||
          steps.state_artifact_download.outcome == 'success' ||
          steps.state_variable_fallback.outputs.state_present == 'true')
        working-directory: control
        env:
          EXPECTED_STATE_ARTIFACT_ID: ${{ needs.deploy.outputs.state_artifact_id }}
          EXPECTED_STATE_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.state_artifact_digest }}
          STATE_ARTIFACT_OUTCOME: ${{ steps.state_artifact_download.outcome }}
          STATE_VARIABLE_OUTCOME: ${{ steps.state_variable_fallback.outcome }}
          STATE_VARIABLE_PRESENT: ${{ steps.state_variable_fallback.outputs.state_present }}
        run: |
          set -euo pipefail
          if [ "$STATE_ARTIFACT_OUTCOME" = success ]; then
            test "$STATE_VARIABLE_OUTCOME" = skipped
            state_path=../state/staging-deploy-state.json
            test "$(printf '%s' "$EXPECTED_STATE_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$EXPECTED_STATE_ARTIFACT_ID"
            test "$(printf '%s' "$EXPECTED_STATE_ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$EXPECTED_STATE_ARTIFACT_DIGEST"
          else
            if [ "$STATE_VARIABLE_OUTCOME" != success ] || [ "$STATE_VARIABLE_PRESENT" != true ]; then
              echo G12_STAGING_FINALIZER_STATE_UNAVAILABLE >&2
              exit 1
            fi
            state_path=../state-variable/staging-deploy-state.json
          fi
          node scripts/ev2/phase12/verify-staging-deploy-recovery-state.mjs \
            --file "$state_path" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --control-sha "${{ github.sha }}" \
            --candidate-release "${{ needs.deploy.outputs.candidate_sha }}" \
            --original-release "${{ needs.deploy.outputs.rollback_sha }}"
          git cat-file -e "${{ needs.deploy.outputs.rollback_sha }}^{commit}"
          git cat-file -e "${{ needs.deploy.outputs.candidate_sha }}^{commit}"
          git merge-base --is-ancestor \
            "${{ needs.deploy.outputs.rollback_sha }}" "${{ needs.deploy.outputs.candidate_sha }}"
      - name: Recover every durable staging browser lease for the state-bound identity
        id: finalizer_browser_recovery
        if: always() && steps.finalizer_state.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: candidate
        run: node scripts/qa/cms-browser-fixture.mjs recover
        env:
          QA_CMS_EXPECTED_SHA: ${{ steps.finalizer_state.outputs.candidate_release }}
          QA_CMS_TARGET_ENVIRONMENT: ${{ steps.finalizer_state.outputs.browser_environment }}
          QA_CMS_RUN_TAG: ${{ steps.finalizer_state.outputs.browser_run_tag }}
          QA_CMS_FIXTURE_REPORT_PATH: outputs/finalizer-browser-recovery.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Prove a deploy stopped safely before clearing its pre-mutation state
        id: pre_mutation_ready
        if: >-
          always() && steps.mutation_boundary.outputs.mode == 'pre-mutation'
        env:
          MUTATION_MODE: ${{ steps.mutation_boundary.outputs.mode }}
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          BROWSER_CLEANUP_OUTCOME: ${{ steps.real_browser_rendezvous_cleanup.outcome }}
          STATE_ARTIFACT_OUTCOME: ${{ steps.state_artifact_download.outcome }}
          STATE_VARIABLE_OUTCOME: ${{ steps.state_variable_fallback.outcome }}
          STATE_VARIABLE_PRESENT: ${{ steps.state_variable_fallback.outputs.state_present }}
          STATE_VALIDATION_OUTCOME: ${{ steps.finalizer_state.outcome }}
          BROWSER_RECOVERY_OUTCOME: ${{ steps.finalizer_browser_recovery.outcome }}
          CANDIDATE_CHECKOUT_OUTCOME: ${{ steps.finalizer_candidate_checkout.outcome }}
        run: |
          set -euo pipefail
          test "$MUTATION_MODE" = pre-mutation
          if [ "$STATE_ARTIFACT_OUTCOME" = success ]; then
            test "$STATE_VARIABLE_OUTCOME" = skipped
          else
            test "$STATE_VARIABLE_OUTCOME" = success
          fi
          if [ -n "$CANDIDATE_SHA" ]; then
            test "$BROWSER_CLEANUP_OUTCOME" = success
          else
            test "$BROWSER_CLEANUP_OUTCOME" = skipped
          fi
          if [ "$STATE_ARTIFACT_OUTCOME" = success ] || [ "$STATE_VARIABLE_PRESENT" = true ]; then
            test "$STATE_VALIDATION_OUTCOME" = success
            test "$CANDIDATE_CHECKOUT_OUTCOME" = success
            test "$BROWSER_RECOVERY_OUTCOME" = success
          else
            test "$STATE_VARIABLE_PRESENT" = false
            test "$STATE_VALIDATION_OUTCOME" = skipped
            test "$BROWSER_RECOVERY_OUTCOME" = skipped
          fi
      - name: Write mandatory terminal evidence for a pre-mutation deploy
        id: pre_mutation_evidence
        if: >-
          always() && steps.mutation_boundary.outputs.mode == 'pre-mutation' &&
          steps.pre_mutation_ready.outcome == 'success'
        working-directory: control
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/g12-staging-pre-mutation-evidence
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          STATE_ARTIFACT_OUTCOME: ${{ steps.state_artifact_download.outcome }}
          STATE_VARIABLE_PRESENT: ${{ steps.state_variable_fallback.outputs.state_present }}
          STATE_PATH: ${{ steps.finalizer_state.outputs.state_path }}
          STATE_ARTIFACT_ID: ${{ needs.deploy.outputs.state_artifact_id }}
          STATE_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.state_artifact_digest }}
          RENDEZVOUS_OUTCOME: ${{ steps.real_browser_rendezvous_cleanup.outcome }}
          BROWSER_FIXTURE_OUTCOME: ${{ steps.finalizer_browser_recovery.outcome }}
          BROWSER_FIXTURE_REPORT: ../candidate/outputs/finalizer-browser-recovery.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const fullSha = /^[a-f0-9]{40}$/;
          const positiveInteger = /^[1-9][0-9]*$/;
          const digest = /^(sha256:)?[a-f0-9]{64}$/;
          const runId = process.env.RUN_ID ?? "";
          const runAttempt = Number(process.env.RUN_ATTEMPT);
          const controlSha = process.env.CONTROL_SHA ?? "";
          const candidateSha = process.env.CANDIDATE_SHA ?? "";
          if (
            !positiveInteger.test(runId) ||
            !Number.isSafeInteger(runAttempt) ||
            runAttempt < 1 ||
            !fullSha.test(controlSha) ||
            (candidateSha !== "" && !fullSha.test(candidateSha))
          ) {
            throw new Error("G12_STAGING_PRE_MUTATION_EVIDENCE_IDENTITY_REFUSED");
          }

          const stateFromArtifact = process.env.STATE_ARTIFACT_OUTCOME === "success";
          const stateFromVariable = process.env.STATE_VARIABLE_PRESENT === "true";
          if (stateFromArtifact && stateFromVariable) {
            throw new Error("G12_STAGING_PRE_MUTATION_EVIDENCE_STATE_SOURCE_AMBIGUOUS");
          }
          const statePresent = stateFromArtifact || stateFromVariable;
          const stateSource = stateFromArtifact ? "artifact" : stateFromVariable ? "variable" : "absent";
          const rendezvousOutcome = process.env.RENDEZVOUS_OUTCOME ?? "";
          const browserFixtureOutcome = process.env.BROWSER_FIXTURE_OUTCOME ?? "";
          if (
            rendezvousOutcome !== (candidateSha === "" ? "skipped" : "success") ||
            browserFixtureOutcome !== (statePresent ? "success" : "skipped")
          ) {
            throw new Error("G12_STAGING_PRE_MUTATION_EVIDENCE_CLEANUP_REFUSED");
          }

          const outputDirectory = process.env.EVIDENCE_DIRECTORY ?? "";
          mkdirSync(outputDirectory, { recursive: true, mode: 0o700 });
          let stateSha256 = null;
          let artifactId = null;
          let artifactDigest = null;
          let remainingActiveLeases = null;
          let failedLeases = null;
          if (statePresent) {
            const stateBytes = readFileSync(process.env.STATE_PATH ?? "");
            const state = JSON.parse(stateBytes.toString("utf8"));
            if (
              state?.schemaVersion !== 4 ||
              state?.workflow?.runId !== runId ||
              state?.workflow?.attempt !== runAttempt ||
              state?.workflow?.controlSha !== controlSha ||
              state?.candidateRelease !== candidateSha ||
              state?.browserRecovery?.environment !== "staging"
            ) {
              throw new Error("G12_STAGING_PRE_MUTATION_EVIDENCE_STATE_REFUSED");
            }
            stateSha256 = createHash("sha256").update(stateBytes).digest("hex");
            if (stateFromArtifact) {
              artifactId = process.env.STATE_ARTIFACT_ID ?? "";
              artifactDigest = process.env.STATE_ARTIFACT_DIGEST ?? "";
              if (!positiveInteger.test(artifactId) || !digest.test(artifactDigest)) {
                throw new Error("G12_STAGING_PRE_MUTATION_EVIDENCE_STATE_ARTIFACT_REFUSED");
              }
            }

            const reportBytes = readFileSync(process.env.BROWSER_FIXTURE_REPORT ?? "");
            const report = JSON.parse(reportBytes.toString("utf8"));
            remainingActiveLeases = report?.recovery?.remainingActiveLeases;
            failedLeases = report?.recovery?.sweeper?.failedLeases;
            if (
              report?.schemaVersion !== 1 ||
              report?.mode !== "recover" ||
              !["already-terminal", "recovered"].includes(report?.status) ||
              report?.environment !== "staging" ||
              report?.candidateSha !== candidateSha ||
              report?.runTag !== state.browserRecovery.runTag ||
              remainingActiveLeases !== 0 ||
              report?.recovery?.sweeper?.status !== "passed" ||
              failedLeases !== 0 ||
              report?.localStateRead !== false ||
              report?.credentialsInStateOrReport !== false
            ) {
              throw new Error("G12_STAGING_PRE_MUTATION_EVIDENCE_BROWSER_RECOVERY_REFUSED");
            }
            writeFileSync(join(outputDirectory, "browser-fixture-recovery.json"), reportBytes, {
              mode: 0o600,
              flag: "wx",
            });
          }

          const evidence = {
            schemaVersion: 1,
            event: "g12.staging.pre_mutation.terminal",
            environment: "staging",
            mutationMode: "pre-mutation",
            runId,
            runAttempt,
            controlSha,
            candidateSha: candidateSha || null,
            state: {
              present: statePresent,
              source: stateSource,
              sha256: stateSha256,
              artifactId,
              artifactDigest,
            },
            cleanup: {
              rendezvous: rendezvousOutcome,
              browserFixture: browserFixtureOutcome,
              remainingActiveLeases,
              failedLeases,
            },
            stagingMutationArmed: false,
            productionTouched: false,
            zeroResidue: true,
            secretsDisclosed: false,
          };
          writeFileSync(
            join(outputDirectory, "staging-pre-mutation-terminal.json"),
            `${JSON.stringify(evidence, null, 2)}\n`,
            { encoding: "utf8", mode: 0o600, flag: "wx" },
          );
          NODE
      - name: Upload mandatory terminal evidence for a pre-mutation deploy
        id: pre_mutation_evidence_upload
        if: always() && steps.pre_mutation_evidence.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-pre-mutation-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g12-staging-pre-mutation-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Verify pre-mutation terminal evidence artifact identity
        id: pre_mutation_evidence_identity
        if: always() && steps.pre_mutation_evidence_upload.outcome == 'success'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ steps.pre_mutation_evidence_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.pre_mutation_evidence_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$ARTIFACT_ID"
          test "$(printf '%s' "$ARTIFACT_DIGEST" | grep -E '^(sha256:)?[a-f0-9]{64}$')" = "$ARTIFACT_DIGEST"
      - name: Clear redundant state after proving the deploy stopped before staging mutation
        id: clear_pre_mutation_recovery_state
        if: >-
          always() && steps.mutation_boundary.outputs.mode == 'pre-mutation' &&
          steps.pre_mutation_ready.outcome == 'success' &&
          steps.pre_mutation_evidence.outcome == 'success' &&
          steps.pre_mutation_evidence_upload.outcome == 'success' &&
          steps.pre_mutation_evidence_identity.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
          STATE_ARTIFACT_OUTCOME: ${{ steps.state_artifact_download.outcome }}
          STATE_VARIABLE_PRESENT: ${{ steps.state_variable_fallback.outputs.state_present }}
        run: |
          set -euo pipefail
          state_argument=()
          if [ "$STATE_ARTIFACT_OUTCOME" = success ] || [ "$STATE_VARIABLE_PRESENT" = true ]; then
            state_argument=(--file "${{ steps.finalizer_state.outputs.state_path }}")
          fi
          node scripts/ev2/phase12/recovery-state-store.mjs clear \
            --kind staging-deploy "${state_argument[@]}" \
            --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" \
            --control-sha "${{ github.sha }}"
      - name: Finalize a deploy that stopped before staging mutation was armed
        id: pre_mutation_finalize
        if: >-
          always() && steps.mutation_boundary.outputs.mode == 'pre-mutation'
        env:
          PRE_MUTATION_READY_OUTCOME: ${{ steps.pre_mutation_ready.outcome }}
          PRE_MUTATION_EVIDENCE_OUTCOME: ${{ steps.pre_mutation_evidence.outcome }}
          PRE_MUTATION_EVIDENCE_UPLOAD_OUTCOME: ${{ steps.pre_mutation_evidence_upload.outcome }}
          PRE_MUTATION_EVIDENCE_IDENTITY_OUTCOME: ${{ steps.pre_mutation_evidence_identity.outcome }}
          STATE_CLEAR_OUTCOME: ${{ steps.clear_pre_mutation_recovery_state.outcome }}
        run: |
          set -euo pipefail
          test "$PRE_MUTATION_READY_OUTCOME" = success
          test "$PRE_MUTATION_EVIDENCE_OUTCOME" = success
          test "$PRE_MUTATION_EVIDENCE_UPLOAD_OUTCOME" = success
          test "$PRE_MUTATION_EVIDENCE_IDENTITY_OUTCOME" = success
          test "$STATE_CLEAR_OUTCOME" = success
      - name: Recheck canonical staging state after the deploy job
        id: finalizer_decision
        if: >-
          always() && steps.mutation_boundary.outputs.mode == 'armed' &&
          steps.finalizer_state.outcome == 'success' &&
          steps.finalizer_candidate_checkout.outcome == 'success' &&
          steps.finalizer_browser_recovery.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        working-directory: control
        env: &staging_reconcile_environment
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_RELEASE: ${{ steps.finalizer_state.outputs.original_release }}
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.finalizer_state.outputs.original_deployment }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.finalizer_state.outputs.original_created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.finalizer_state.outputs.original_commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.finalizer_state.outputs.candidate_release }}
          STAGING_RUN_MARKER: ${{ steps.finalizer_state.outputs.run_marker }}
          STAGING_COMPENSATION_MARKER: ${{ steps.finalizer_state.outputs.compensation_marker }}
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs
          ${{ steps.dag_outcome.outputs.succeeded == 'true' && 'assert-original' || 'decide' }}
      - name: Download the exact recovery artifact before any compensating mutation
        id: recovery_artifact_download
        if: >-
          always() && steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_state.outcome == 'success' &&
          steps.finalizer_decision.outcome == 'success' &&
          (steps.finalizer_decision.outputs.action == 'restore-original' ||
          steps.finalizer_decision.outputs.action == 'already-original')
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.finalizer_state.outputs.recovery_artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ github.run_id }}
          path: recovery
      - name: Reverify recovery metadata, snapshot, seal and bytes before compensation
        id: recovery_artifact_verification
        if: always() && steps.recovery_artifact_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ev2/phase12/verify-staging-deploy-recovery-artifact.mjs
          --state "${{ steps.finalizer_state.outputs.state_path }}"
          --artifact-dir ../recovery
      - name: Resolve the persisted unified release package for forward-backend recovery
        id: finalizer_release_source
        if: >-
          always() && steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_state.outcome == 'success' &&
          steps.finalizer_decision.outcome == 'success' &&
          (steps.finalizer_decision.outputs.action == 'already-original' ||
          steps.finalizer_decision.outputs.action == 'restore-original') &&
          steps.recovery_artifact_verification.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ev2/phase12/resolve-ci-staging-frontend-artifact.mjs
          --run-id "${{ steps.finalizer_state.outputs.source_ci_run_id }}"
          --run-attempt "${{ steps.finalizer_state.outputs.source_ci_run_attempt }}"
          --gate-run-attempt "${{ steps.finalizer_state.outputs.gate_ci_run_attempt }}"
          --sha "${{ steps.finalizer_state.outputs.candidate_release }}"
      - name: Bind the finalizer to the persisted package identity and release profile
        id: finalizer_release_contract
        if: always() && steps.finalizer_release_source.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          RELEASE_PROFILE: ${{ needs.deploy.outputs.release_profile }}
          STATE_CANDIDATE_SHA: ${{ steps.finalizer_state.outputs.candidate_release }}
          DEPLOY_CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          STATE_RUN_ID: ${{ steps.finalizer_state.outputs.source_ci_run_id }}
          DEPLOY_RUN_ID: ${{ needs.deploy.outputs.source_ci_run_id }}
          RESOLVED_RUN_ID: ${{ steps.finalizer_release_source.outputs.source_run_id }}
          STATE_RUN_ATTEMPT: ${{ steps.finalizer_state.outputs.source_ci_run_attempt }}
          DEPLOY_RUN_ATTEMPT: ${{ needs.deploy.outputs.source_ci_run_attempt }}
          RESOLVED_RUN_ATTEMPT: ${{ steps.finalizer_release_source.outputs.source_run_attempt }}
          STATE_GATE_RUN_ATTEMPT: ${{ steps.finalizer_state.outputs.gate_ci_run_attempt }}
          DEPLOY_GATE_RUN_ATTEMPT: ${{ needs.deploy.outputs.gate_ci_run_attempt }}
          RESOLVED_GATE_RUN_ATTEMPT: ${{ steps.finalizer_release_source.outputs.gate_run_attempt }}
          STATE_ARTIFACT_ID: ${{ steps.finalizer_state.outputs.source_artifact_id }}
          DEPLOY_ARTIFACT_ID: ${{ needs.deploy.outputs.source_artifact_id }}
          RESOLVED_ARTIFACT_ID: ${{ steps.finalizer_release_source.outputs.artifact_id }}
          STATE_ARTIFACT_DIGEST: ${{ steps.finalizer_state.outputs.source_artifact_digest }}
          DEPLOY_ARTIFACT_DIGEST: ${{ needs.deploy.outputs.source_artifact_digest }}
          RESOLVED_ARTIFACT_DIGEST: ${{ steps.finalizer_release_source.outputs.artifact_digest }}
          STATE_ARTIFACT_NAME: ${{ steps.finalizer_state.outputs.source_artifact_name }}
          DEPLOY_ARTIFACT_NAME: ${{ needs.deploy.outputs.source_artifact_name }}
          RESOLVED_ARTIFACT_NAME: ${{ steps.finalizer_release_source.outputs.artifact_name }}
          RESOLVED_CONTROL_SHA: ${{ steps.finalizer_release_source.outputs.control_sha }}
        run: |
          set -euo pipefail
          normalize_digest() {
            case "$1" in
              sha256:*) printf '%s\n' "$1" ;;
              *) printf 'sha256:%s\n' "$1" ;;
            esac
          }
          test "$(printf '%s' "$STATE_CANDIDATE_SHA" | grep -E '^[a-f0-9]{40}$')" = "$STATE_CANDIDATE_SHA"
          test "$DEPLOY_CANDIDATE_SHA" = "$STATE_CANDIDATE_SHA"
          test "$RESOLVED_CONTROL_SHA" = "$STATE_CANDIDATE_SHA"
          test "$(printf '%s' "$STATE_RUN_ID" | grep -E '^[1-9][0-9]*$')" = "$STATE_RUN_ID"
          test "$DEPLOY_RUN_ID" = "$STATE_RUN_ID"
          test "$RESOLVED_RUN_ID" = "$STATE_RUN_ID"
          test "$(printf '%s' "$STATE_RUN_ATTEMPT" | grep -E '^[1-9][0-9]*$')" = "$STATE_RUN_ATTEMPT"
          test "$DEPLOY_RUN_ATTEMPT" = "$STATE_RUN_ATTEMPT"
          test "$RESOLVED_RUN_ATTEMPT" = "$STATE_RUN_ATTEMPT"
          test "$(printf '%s' "$STATE_GATE_RUN_ATTEMPT" | grep -E '^[1-9][0-9]*$')" = "$STATE_GATE_RUN_ATTEMPT"
          test "$DEPLOY_GATE_RUN_ATTEMPT" = "$STATE_GATE_RUN_ATTEMPT"
          test "$RESOLVED_GATE_RUN_ATTEMPT" = "$STATE_GATE_RUN_ATTEMPT"
          test "$(printf '%s' "$STATE_ARTIFACT_ID" | grep -E '^[1-9][0-9]*$')" = "$STATE_ARTIFACT_ID"
          test "$DEPLOY_ARTIFACT_ID" = "$STATE_ARTIFACT_ID"
          test "$RESOLVED_ARTIFACT_ID" = "$STATE_ARTIFACT_ID"
          state_digest="$(normalize_digest "$STATE_ARTIFACT_DIGEST")"
          test "$(printf '%s' "$state_digest" | grep -E '^sha256:[a-f0-9]{64}$')" = "$state_digest"
          test "$(normalize_digest "$DEPLOY_ARTIFACT_DIGEST")" = "$state_digest"
          test "$(normalize_digest "$RESOLVED_ARTIFACT_DIGEST")" = "$state_digest"
          test -n "$STATE_ARTIFACT_NAME"
          test "$DEPLOY_ARTIFACT_NAME" = "$STATE_ARTIFACT_NAME"
          test "$RESOLVED_ARTIFACT_NAME" = "$STATE_ARTIFACT_NAME"
          case "$RELEASE_PROFILE" in
            frontend-only)
              database_required=false
              edge_required=false
              ;;
            edge-only)
              database_required=false
              edge_required=true
              ;;
            database-auth)
              database_required=true
              edge_required=false
              ;;
            full-release)
              database_required=true
              edge_required=true
              ;;
            *)
              echo G12_STAGING_FINALIZER_RELEASE_PROFILE_REFUSED >&2
              exit 1
              ;;
          esac
          printf 'release_profile=%s\n' "$RELEASE_PROFILE" >> "$GITHUB_OUTPUT"
          printf 'database_required=%s\n' "$database_required" >> "$GITHUB_OUTPUT"
          printf 'edge_required=%s\n' "$edge_required" >> "$GITHUB_OUTPUT"
      - name: Download the persisted unified release package by immutable artifact ID
        id: finalizer_release_download
        if: always() && steps.finalizer_release_contract.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.finalizer_state.outputs.source_artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.finalizer_state.outputs.source_ci_run_id }}
          path: ${{ runner.temp }}/g12-staging-finalizer-release-package
      - name: Verify the persisted unified release package before recovery mutation
        id: finalizer_release_package
        if: always() && steps.finalizer_release_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-staging-release-package.mjs
          --package "$RUNNER_TEMP/g12-staging-finalizer-release-package"
          --candidate "${{ steps.finalizer_state.outputs.candidate_release }}"
          --profile "${{ steps.finalizer_release_contract.outputs.release_profile }}"
          --run-id "${{ steps.finalizer_state.outputs.source_ci_run_id }}"
          --run-attempt "${{ steps.finalizer_state.outputs.source_ci_run_attempt }}"
      - name: Materialize the persisted database payload only when the profile requires it
        id: finalizer_database_payload
        if: >-
          always() && steps.finalizer_release_package.outcome == 'success' &&
          steps.finalizer_release_contract.outputs.database_required == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: control
        env:
          RELEASE_PROFILE: ${{ steps.finalizer_release_contract.outputs.release_profile }}
          CANDIDATE_SHA: ${{ steps.finalizer_state.outputs.candidate_release }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/g12-staging-finalizer-release-package/staging-release-package.json"
          test "$(jq -er '.components.database.files | length' "$manifest")" = 1
          payload_name="$(jq -er '.components.database.files[0].path' "$manifest")"
          payload_sha256="$(jq -er '.components.database.files[0].sha256' "$manifest")"
          expected_name="database-release-staging-${CANDIDATE_SHA}-${RELEASE_PROFILE}.g12db"
          test "$payload_name" = "$expected_name"
          test "$(printf '%s' "$payload_sha256" | grep -E '^[a-f0-9]{64}$')" = "$payload_sha256"
          node scripts/ev2/phase12/verify-database-release-payload.mjs \
            --payload "$RUNNER_TEMP/g12-staging-finalizer-release-package/database/$payload_name" \
            --output "$RUNNER_TEMP/g12-staging-finalizer-database-project" \
            --candidate "$CANDIDATE_SHA" \
            --environment staging \
            --profile "$RELEASE_PROFILE" \
            --expected-payload-sha256 "$payload_sha256"
      - name: Install pinned Supabase CLI for forward-backend recovery
        id: finalizer_supabase_cli
        if: >-
          always() && steps.finalizer_release_package.outcome == 'success' &&
          (steps.finalizer_release_contract.outputs.database_required == 'true' ||
          steps.finalizer_release_contract.outputs.edge_required == 'true')
        continue-on-error: true
        timeout-minutes: 5
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Converge exact candidate staging migrations after deploy failure
        id: finalizer_recovery_database
        if: >-
          always() && steps.finalizer_release_contract.outputs.database_required == 'true' &&
          steps.finalizer_database_payload.outcome == 'success' &&
          steps.finalizer_supabase_cli.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{ steps.finalizer_database_payload.outputs.project_directory }}
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = "glcqsosxwgmlhzgcsnzv"
          mkdir -p "$RUNNER_TEMP/g12-staging-finalizer-evidence"
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF" --yes
          supabase db push --linked --include-all --dry-run
          supabase db push --linked --include-all --yes
          node "$GITHUB_WORKSPACE/control/scripts/ev2/phase12/verify-staging-database.mjs" --source . |
            tee "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-database-finalizer-recovery.json"
      - name: Converge exact candidate staging Auth after deploy failure
        id: finalizer_recovery_auth
        if: >-
          always() && steps.finalizer_release_contract.outputs.database_required == 'true' &&
          steps.finalizer_recovery_database.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ${{ steps.finalizer_database_payload.outputs.project_directory }}
        shell: bash
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g12-staging-finalizer-evidence"
          node scripts/ev2/phase12/configure-staging-auth.mjs |
            tee "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-auth-finalizer-recovery.json"
      - name: Converge exact candidate staging Edge configuration after deploy failure
        id: finalizer_recovery_edge_configuration
        if: >-
          always() && steps.finalizer_release_contract.outputs.edge_required == 'true' &&
          steps.finalizer_supabase_cli.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: control
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_CANDIDATE_SHA: ${{ steps.finalizer_state.outputs.candidate_release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g12-staging-finalizer-evidence"
          node "$RUNNER_TEMP/g12-staging-finalizer-release-package/edge/source/scripts/ev2/phase12/configure-staging-edge-public-secrets.mjs" |
            tee "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-edge-public-secrets-finalizer-recovery.json"
          node "$RUNNER_TEMP/g12-staging-finalizer-release-package/edge/source/scripts/ev2/phase12/configure-staging-ai-provider-secrets.mjs" |
            tee "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-ai-provider-finalizer-recovery.json"
      - name: Converge exact candidate Edge Functions after deploy failure
        id: finalizer_recovery_functions
        if: >-
          always() && steps.finalizer_release_contract.outputs.edge_required == 'true' &&
          steps.finalizer_recovery_edge_configuration.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 90
        working-directory: control
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/g12-staging-finalizer-release-package"
          release_manifest="$package/staging-release-package.json"
          edge_manifest_sha256="$(jq -er '.components.edge.files[] | select(.path == "manifest.json") | .sha256' "$release_manifest")"
          test "$(printf '%s' "$edge_manifest_sha256" | grep -E '^[a-f0-9]{64}$')" = "$edge_manifest_sha256"
          mkdir -p "$RUNNER_TEMP/g12-staging-finalizer-evidence"
          node scripts/ev2/phase12/deploy-staging-functions.mjs \
            --candidate-artifact "$package/edge" \
            --artifact-manifest-sha256 "$edge_manifest_sha256" \
            --baseline-artifact ../recovery/edge-baseline \
            --baseline-manifest-sha256 "${{ steps.finalizer_state.outputs.edge_baseline_manifest_sha256 }}" \
            --candidate "${{ steps.finalizer_state.outputs.candidate_release }}" \
            --mode reconcile-candidate \
            --report "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-function-finalizer-recovery.json"
          supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF" --output json > \
            "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-functions-finalizer-recovery.json"
          node scripts/ev2/phase12/verify-production-functions.mjs \
            --file "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-functions-finalizer-recovery.json" \
            --receipt "$RUNNER_TEMP/g12-staging-finalizer-evidence/g12-staging-function-finalizer-recovery.json" \
            --source "$package/edge/source" \
            --candidate "${{ steps.finalizer_state.outputs.candidate_release }}" \
            --environment staging --project-ref "$STAGING_SUPABASE_PROJECT_REF"
      - name: Prove required backend domains recovered and omitted domains stayed skipped
        id: finalizer_backend_recovery
        if: >-
          always() && steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_state.outcome == 'success' &&
          steps.finalizer_decision.outcome == 'success' &&
          steps.recovery_artifact_verification.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          RELEASE_SOURCE_OUTCOME: ${{ steps.finalizer_release_source.outcome }}
          RELEASE_CONTRACT_OUTCOME: ${{ steps.finalizer_release_contract.outcome }}
          RELEASE_DOWNLOAD_OUTCOME: ${{ steps.finalizer_release_download.outcome }}
          RELEASE_PACKAGE_OUTCOME: ${{ steps.finalizer_release_package.outcome }}
          RELEASE_PACKAGE_NAME: ${{ steps.finalizer_release_package.outputs.artifact_name }}
          STATE_ARTIFACT_NAME: ${{ steps.finalizer_state.outputs.source_artifact_name }}
          DATABASE_REQUIRED: ${{ steps.finalizer_release_contract.outputs.database_required }}
          EDGE_REQUIRED: ${{ steps.finalizer_release_contract.outputs.edge_required }}
          DATABASE_PAYLOAD_OUTCOME: ${{ steps.finalizer_database_payload.outcome }}
          SUPABASE_CLI_OUTCOME: ${{ steps.finalizer_supabase_cli.outcome }}
          DATABASE_OUTCOME: ${{ steps.finalizer_recovery_database.outcome }}
          AUTH_OUTCOME: ${{ steps.finalizer_recovery_auth.outcome }}
          EDGE_CONFIGURATION_OUTCOME: ${{ steps.finalizer_recovery_edge_configuration.outcome }}
          EDGE_FUNCTIONS_OUTCOME: ${{ steps.finalizer_recovery_functions.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "$RELEASE_SOURCE_OUTCOME" \
            "$RELEASE_CONTRACT_OUTCOME" \
            "$RELEASE_DOWNLOAD_OUTCOME" \
            "$RELEASE_PACKAGE_OUTCOME"
          do
            test "$outcome" = success
          done
          test -n "$STATE_ARTIFACT_NAME"
          test "$RELEASE_PACKAGE_NAME" = "$STATE_ARTIFACT_NAME"
          case "$DATABASE_REQUIRED:$EDGE_REQUIRED" in
            false:false|false:true|true:false|true:true) ;;
            *) echo G12_STAGING_FINALIZER_DOMAIN_REQUIREMENTS_REFUSED >&2; exit 1 ;;
          esac
          if [ "$DATABASE_REQUIRED" = true ]; then
            test "$DATABASE_PAYLOAD_OUTCOME" = success
            test "$DATABASE_OUTCOME" = success
            test "$AUTH_OUTCOME" = success
          else
            test "$DATABASE_PAYLOAD_OUTCOME" = skipped
            test "$DATABASE_OUTCOME" = skipped
            test "$AUTH_OUTCOME" = skipped
          fi
          if [ "$EDGE_REQUIRED" = true ]; then
            test "$EDGE_CONFIGURATION_OUTCOME" = success
            test "$EDGE_FUNCTIONS_OUTCOME" = success
          else
            test "$EDGE_CONFIGURATION_OUTCOME" = skipped
            test "$EDGE_FUNCTIONS_OUTCOME" = skipped
          fi
          if [ "$DATABASE_REQUIRED" = true ] || [ "$EDGE_REQUIRED" = true ]; then
            test "$SUPABASE_CLI_OUTCOME" = success
          else
            test "$SUPABASE_CLI_OUTCOME" = skipped
          fi
          printf 'recovered=true\n' >> "$GITHUB_OUTPUT"
      - name: Install the exact locked Wrangler only for compensation
        id: finalizer_compensation_install
        if: >-
          always() && steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_decision.outputs.action == 'restore-original' &&
          steps.finalizer_backend_recovery.outcome == 'success' &&
          steps.recovery_artifact_verification.outcome == 'success'
        timeout-minutes: 10
        working-directory: control
        run: npm ci --ignore-scripts
      - name: Compensate only this run's still-canonical staging candidate
        id: finalizer_compensation
        if: >-
          always() && steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_decision.outputs.action == 'restore-original' &&
          steps.finalizer_backend_recovery.outcome == 'success' &&
          steps.recovery_artifact_verification.outcome == 'success' &&
          steps.finalizer_compensation_install.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: true
        working-directory: control
        env: *staging_reconcile_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery/dist
          --seal ../recovery/outputs/staging-baseline-dist-seal.json
      - name: Retry ambiguous compensation after a fresh canonical recheck
        id: finalizer_compensation_retry
        if: >-
          always() && steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_decision.outputs.action == 'restore-original' &&
          steps.finalizer_backend_recovery.outcome == 'success' &&
          steps.recovery_artifact_verification.outcome == 'success' &&
          steps.finalizer_compensation_install.outcome == 'success' &&
          steps.finalizer_compensation.outcome != 'success'
        timeout-minutes: 15
        continue-on-error: true
        working-directory: control
        env: *staging_reconcile_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery/dist
          --seal ../recovery/outputs/staging-baseline-dist-seal.json
      - name: Terminal canonical recheck for the retained bridge deployment
        id: finalizer_terminal_bridge
        if: >-
          always() && steps.dag_outcome.outputs.succeeded == 'true' &&
          steps.mutation_boundary.outputs.mode == 'armed'
        continue-on-error: true
        timeout-minutes: 3
        working-directory: control
        env: *staging_reconcile_environment
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-original
      - name: Terminal canonical recheck after staging compensation
        id: finalizer_terminal_original
        if: >-
          always() && steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_backend_recovery.outcome == 'success' &&
          (steps.finalizer_decision.outputs.action == 'already-original' ||
          steps.finalizer_compensation.outcome == 'success' ||
          steps.finalizer_compensation_retry.outcome == 'success')
        continue-on-error: true
        timeout-minutes: 3
        working-directory: control
        env: *staging_reconcile_environment
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-original
      - name: Probe the terminal staging frontend against the forward backend
        id: finalizer_probe
        if: >-
          always() && steps.finalizer_state.outcome == 'success' &&
          steps.finalizer_decision.outcome == 'success' &&
          ((steps.dag_outcome.outputs.succeeded == 'true' &&
          steps.finalizer_terminal_bridge.outcome == 'success') ||
          (steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_backend_recovery.outcome == 'success' &&
          steps.finalizer_terminal_original.outcome == 'success'))
        timeout-minutes: 10
        working-directory: control
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.dag_outcome.outputs.succeeded == 'true' && steps.finalizer_state.outputs.candidate_release || steps.finalizer_state.outputs.original_release }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          # Redeploying the function inventory leaves every public route cold, which inflates the
          # tail while the p50 stays healthy. Warmup exists to keep that out of the measurement.
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-terminal-probe.json
        run: node scripts/ev2/phase12/rollout-probe.mjs
      - name: Upload mandatory terminal staging evidence
        id: terminal_evidence_upload
        if: always() && steps.finalizer_probe.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            g12-staging-terminal-probe.json
            candidate/outputs/finalizer-browser-recovery.json
            ${{ runner.temp }}/g12-staging-finalizer-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Compare and clear redundant staging state after terminal success
        id: clear_recovery_state
        if: >-
          always() && steps.finalizer_state.outcome == 'success' &&
          steps.finalizer_candidate_checkout.outcome == 'success' &&
          steps.finalizer_browser_recovery.outcome == 'success' &&
          steps.finalizer_decision.outcome == 'success' &&
          steps.real_browser_rendezvous_cleanup.outcome == 'success' &&
          steps.finalizer_probe.outcome == 'success' &&
          steps.terminal_evidence_upload.outcome == 'success' &&
          ((steps.dag_outcome.outputs.succeeded == 'true' &&
          steps.finalizer_terminal_bridge.outcome == 'success') ||
          (steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_backend_recovery.outcome == 'success' &&
          steps.finalizer_terminal_original.outcome == 'success' &&
          (steps.finalizer_decision.outputs.action == 'already-original' ||
          (steps.finalizer_decision.outputs.action == 'restore-original' &&
          steps.recovery_artifact_download.outcome == 'success' &&
          steps.recovery_artifact_verification.outcome == 'success' &&
          steps.finalizer_compensation_install.outcome == 'success' &&
          (steps.finalizer_compensation.outcome == 'success' ||
          steps.finalizer_compensation_retry.outcome == 'success')))))
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs clear
          --kind staging-deploy --file "${{ steps.finalizer_state.outputs.state_path }}"
          --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          --control-sha "${{ github.sha }}"
      - name: Fail closed when staging did not finish in the required canonical state
        if: >-
          always() && (steps.mutation_boundary.outcome != 'success' ||
          (steps.mutation_boundary.outputs.mode != 'armed' &&
          steps.mutation_boundary.outputs.mode != 'pre-mutation') ||
          (steps.mutation_boundary.outputs.mode == 'pre-mutation' &&
          steps.pre_mutation_finalize.outcome != 'success') ||
          (steps.mutation_boundary.outputs.mode == 'armed' &&
          (steps.finalizer_state.outcome != 'success' ||
          steps.finalizer_candidate_checkout.outcome != 'success' ||
          steps.finalizer_browser_recovery.outcome != 'success' ||
          steps.real_browser_rendezvous_cleanup.outcome != 'success' ||
          steps.finalizer_decision.outcome != 'success' ||
          steps.finalizer_probe.outcome != 'success' ||
          steps.terminal_evidence_upload.outcome != 'success' ||
          steps.clear_recovery_state.outcome != 'success' ||
          (steps.dag_outcome.outputs.succeeded == 'true' &&
          steps.finalizer_terminal_bridge.outcome != 'success') ||
          (steps.dag_outcome.outputs.succeeded != 'true' &&
          (steps.finalizer_backend_recovery.outcome != 'success' ||
          steps.recovery_artifact_download.outcome != 'success' ||
          steps.recovery_artifact_verification.outcome != 'success' ||
          steps.finalizer_terminal_original.outcome != 'success')) ||
          (steps.dag_outcome.outputs.succeeded != 'true' &&
          steps.finalizer_decision.outputs.action == 'restore-original' &&
          (steps.finalizer_compensation_install.outcome != 'success' ||
          (steps.finalizer_compensation.outcome != 'success' &&
          steps.finalizer_compensation_retry.outcome != 'success'))))))
        run: exit 1

  pipeline-metrics:
    needs:
      - preflight
      - validate_source
      - validate_live_baseline
      - deploy
      - post_deploy_frontend_readonly
      - post_deploy_backend_readonly
      - browser_attestation
      - evidence
      - diagnostic
      - finalize
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Capture staging duration and its actual bottleneck
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROFILE: >-
            ${{ inputs.diagnostic_run && 'diagnostic' ||
            needs.deploy.outputs.release_profile || 'full-release' }}
          EXPECTED_STAGES: >-
            ${{ inputs.diagnostic_run && 'diagnostic' ||
            'preflight,validate_source,validate_live_baseline,deploy,post_deploy_frontend_readonly,post_deploy_backend_readonly,browser_attestation,evidence,finalize' }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/pipeline-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > "$RUNNER_TEMP/pipeline-jobs.json"
          captured_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/ev2/phase12/write-pipeline-duration-report.mjs \
            --run "$RUNNER_TEMP/pipeline-run.json" \
            --jobs "$RUNNER_TEMP/pipeline-jobs.json" \
            --baseline .github/release-controls/pipeline-slo-baseline.json \
            --profile "$RELEASE_PROFILE" \
            --scope component \
            --expected-stages "$EXPECTED_STAGES" \
            --candidate-sha "${{ needs.deploy.outputs.candidate_sha }}" \
            --captured-at "$captured_at" \
            --output "$RUNNER_TEMP/pipeline-duration-report.json"
      - name: Preserve staging duration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-duration-staging-${{ needs.deploy.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-duration-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Select only a complete terminal-green release chain for aggregation
        id: end_to_end_gate
        env:
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOURCE_RESULT: ${{ needs.validate_source.result }}
          LIVE_RESULT: ${{ needs.validate_live_baseline.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          FRONTEND_RESULT: ${{ needs.post_deploy_frontend_readonly.result }}
          BACKEND_RESULT: ${{ needs.post_deploy_backend_readonly.result }}
          BROWSER_RESULT: ${{ needs.browser_attestation.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          DIAGNOSTIC_RESULT: ${{ needs.diagnostic.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
        run: |
          set -euo pipefail
          eligible=false
          if [ "$DIAGNOSTIC_RUN" = false ] && \
             [ "$PREFLIGHT_RESULT" = success ] && \
             [ "$SOURCE_RESULT" = success ] && \
             [ "$LIVE_RESULT" = success ] && \
             [ "$DEPLOY_RESULT" = success ] && \
             [ "$FRONTEND_RESULT" = success ] && \
             [ "$BACKEND_RESULT" = success ] && \
             [ "$BROWSER_RESULT" = success ] && \
             [ "$EVIDENCE_RESULT" = success ] && \
             [ "$DIAGNOSTIC_RESULT" = skipped ] && \
             [ "$FINALIZE_RESULT" = success ]; then
            eligible=true
          fi
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"
      - name: Resolve the exact green CI duration artifact
        id: ci_duration
        if: steps.end_to_end_gate.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ev2/phase12/resolve-pipeline-duration-artifact.mjs
          --component ci
          --run-id "${{ needs.deploy.outputs.source_ci_run_id }}"
          --run-attempt "${{ needs.deploy.outputs.gate_ci_run_attempt }}"
          --candidate-sha "${{ needs.deploy.outputs.candidate_sha }}"
          --control-sha "${{ needs.deploy.outputs.candidate_sha }}"
      - name: Resolve the exact green bridge duration artifact
        id: bridge_duration
        if: steps.end_to_end_gate.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
        run: >-
          node scripts/ev2/phase12/resolve-pipeline-duration-artifact.mjs
          --component bridge
          --run-id "$BRIDGE_RUN_ID"
          --run-attempt "${{ needs.deploy.outputs.bridge_run_attempt }}"
          --candidate-sha "${{ needs.deploy.outputs.candidate_sha }}"
          --control-sha "${{ needs.deploy.outputs.bridge_control_sha }}"
      - name: Download the CI duration by immutable artifact ID
        if: steps.end_to_end_gate.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.ci_duration.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ needs.deploy.outputs.source_ci_run_id }}
          path: ${{ runner.temp }}/pipeline-duration-ci
      - name: Download the bridge duration by immutable artifact ID
        if: steps.end_to_end_gate.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.bridge_duration.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ inputs.frontend_bridge_run_id }}
          path: ${{ runner.temp }}/pipeline-duration-bridge
      - name: Bind exact attempts, policy and immutable artifact bytes into one release chain
        if: steps.end_to_end_gate.outputs.eligible == 'true'
        env:
          CANDIDATE_SHA: ${{ needs.deploy.outputs.candidate_sha }}
          RELEASE_PROFILE: ${{ needs.deploy.outputs.release_profile }}
          MATRIX_SHA256: ${{ needs.deploy.outputs.matrix_sha256 }}
          POLICY_SHA256: ${{ needs.deploy.outputs.policy_sha256 }}
          CI_RUN_ID: ${{ needs.deploy.outputs.source_ci_run_id }}
          CI_GATE_ATTEMPT: ${{ needs.deploy.outputs.gate_ci_run_attempt }}
          CI_PRODUCER_ATTEMPT: ${{ needs.deploy.outputs.source_ci_run_attempt }}
          BRIDGE_RUN_ID: ${{ inputs.frontend_bridge_run_id }}
          BRIDGE_RUN_ATTEMPT: ${{ needs.deploy.outputs.bridge_run_attempt }}
          BRIDGE_CONTROL_SHA: ${{ needs.deploy.outputs.bridge_control_sha }}
          ARTIFACT_NAME: ${{ needs.deploy.outputs.source_artifact_name }}
          ARTIFACT_ID: ${{ needs.deploy.outputs.source_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.deploy.outputs.source_artifact_digest }}
          ARCHIVE_SHA256: ${{ needs.deploy.outputs.archive_sha256 }}
          TREE_SHA256: ${{ needs.deploy.outputs.tree_sha256 }}
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/pipeline-duration-ci" -maxdepth 1 -type f -name pipeline-duration-report.json | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/pipeline-duration-bridge" -maxdepth 1 -type f -name pipeline-duration-report.json | wc -l)" -eq 1
          captured_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/ev2/phase12/write-pipeline-chain-binding.mjs \
            --candidate "$CANDIDATE_SHA" \
            --profile "$RELEASE_PROFILE" \
            --matrix-sha256 "$MATRIX_SHA256" \
            --policy-sha256 "$POLICY_SHA256" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-gate-run-attempt "$CI_GATE_ATTEMPT" \
            --ci-producer-run-attempt "$CI_PRODUCER_ATTEMPT" \
            --ci-control-sha "$CANDIDATE_SHA" \
            --bridge-run-id "$BRIDGE_RUN_ID" \
            --bridge-run-attempt "$BRIDGE_RUN_ATTEMPT" \
            --bridge-control-sha "$BRIDGE_CONTROL_SHA" \
            --staging-run-id "$GITHUB_RUN_ID" \
            --staging-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --staging-control-sha "$GITHUB_SHA" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --tree-sha256 "$TREE_SHA256" \
            --captured-at "$captured_at" \
            --output "$RUNNER_TEMP/pipeline-chain-binding.json"
      - name: Generate the exact end-to-end duration report without relaxing gates
        if: steps.end_to_end_gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          captured_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/ev2/phase12/write-pipeline-end-to-end-report.mjs \
            --ci-report "$RUNNER_TEMP/pipeline-duration-ci/pipeline-duration-report.json" \
            --bridge-report "$RUNNER_TEMP/pipeline-duration-bridge/pipeline-duration-report.json" \
            --staging-report "$RUNNER_TEMP/pipeline-duration-report.json" \
            --baseline "$GITHUB_WORKSPACE/.github/release-controls/pipeline-slo-baseline.json" \
            --chain "$RUNNER_TEMP/pipeline-chain-binding.json" \
            --captured-at "$captured_at" \
            --output "$RUNNER_TEMP/pipeline-end-to-end-report.json"
      - name: Preserve the exact terminal release chain and end-to-end SLO evidence
        if: steps.end_to_end_gate.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-end-to-end-${{ needs.deploy.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pipeline-chain-binding.json
            ${{ runner.temp }}/pipeline-end-to-end-report.json
            ${{ runner.temp }}/pipeline-duration-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
