name: Deploy production

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: SHA completo, imutável, aprovado e contido em main
        required: true
      approval_record:
        description: Caminho .github/release-controls/approvals/G12_<sha>.json versionado em main
        required: true
      change_reference:
        description: Identificador da mudança aprovado no G12
        required: true
      confirmation:
        description: Digite AUTORIZO-G12-PRODUCAO:<SHA>
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == format('AUTORIZO-G12-PRODUCAO:{0}', inputs.candidate_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout release controls from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: control
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
          cache: npm
          cache-dependency-path: |
            control/package-lock.json
            candidate/package-lock.json
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Verify exact candidate belongs to main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(printf '%s' "$CANDIDATE_SHA" | grep -E '^[a-f0-9]{40}$')" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C control merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
      - name: Verify protected GitHub controls
        working-directory: control
        run: node scripts/ev2/phase12/check-github-controls.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - name: Verify production configuration is isolated
        working-directory: control
        run: node scripts/ev2/phase12/validate-production-config.mjs
        env:
          PRODUCTION_CLOUDFLARE_PROJECT: gaiatec-website
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SITE_ORIGIN: ${{ vars.PRODUCTION_SITE_ORIGIN }}
      - name: Verify the complete production backend configuration before mutation
        working-directory: control
        run: node scripts/ev2/phase12/validate-production-backend-config.mjs
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SITE_ORIGIN: ${{ vars.PRODUCTION_SITE_ORIGIN }}
          ALLOWED_ORIGINS: https://gaiatecsistemas.com.br,https://www.gaiatecsistemas.com.br
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          LEAD_NOTIFICATION_TO: ${{ vars.LEAD_NOTIFICATION_TO }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          EVIDENCE_SALT: ${{ secrets.EVIDENCE_SALT }}
          LEAD_EVIDENCE_SALT: ${{ secrets.LEAD_EVIDENCE_SALT }}
          OUTBOX_WORKER_SECRET: ${{ secrets.OUTBOX_WORKER_SECRET }}
          CMS_EV2_PRODUCTION_ENABLED: "true"
          CMS_AI_EXTERNAL_PROVIDER_ENABLED: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CONTACT_CAPTCHA_ALWAYS: "true"
      - name: Verify immutable G12 approval
        id: approval
        working-directory: control
        env:
          APPROVAL_RECORD: ${{ inputs.approval_record }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
        run: >-
          node scripts/ev2/phase12/verify-approval.mjs --file "$APPROVAL_RECORD"
          --candidate "$CANDIDATE_SHA" --environment production --change-reference "$CHANGE_REFERENCE"
      - name: Install and validate exact candidate
        working-directory: candidate
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Build production shell with every EV2 candidate default-off
        working-directory: candidate
        run: npm run build
        env:
          VITE_RELEASE: ${{ inputs.candidate_sha }}
          VITE_CMS_ENVIRONMENT: production
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_EV2_DRAFT_V2_CANDIDATE: "false"
          VITE_EV2_MASTER_DATA_CANDIDATE: "false"
          VITE_EV2_PIM_CANDIDATE: "false"
          VITE_EV2_DAM_CANDIDATE: "false"
          VITE_EV2_SEARCH_QUALITY_CANDIDATE: "false"
          VITE_EV2_COLLABORATION_BULK_CANDIDATE: "false"
          VITE_EV2_RBAC_SCOPED_CANDIDATE: "false"
          VITE_EV2_VISUAL_STUDIO_CANDIDATE: "false"
          VITE_EV2_MULTISITE_CANDIDATE: "false"
          VITE_EV2_AI_ASSIST_CANDIDATE: "false"
          VITE_EV2_SYSTEM_ASSURANCE_CANDIDATE: "false"
      - name: Seal release manifest
        working-directory: candidate
        run: env -u GITHUB_SHA npm run artifact:manifest
        env:
          VITE_RELEASE: ${{ inputs.candidate_sha }}
      - name: Deploy the same artifact to an isolated production-project preview
        id: preflight
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: control
          command: >-
            pages deploy ../candidate/dist --project-name gaiatec-website --branch ev2-g12-preflight
            --commit-hash ${{ inputs.candidate_sha }} --commit-dirty=false
      - name: Probe immutable shell in the isolated production-project preview
        working-directory: control
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: ${{ steps.preflight.outputs.deployment-url }}
          EV2_G12_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EV2_G12_ENVIRONMENT: production-preview
          EV2_G12_PROBE_PROFILE: technical
          EV2_G12_SAMPLE_COUNT: "5"
          EV2_G12_REPORT_PATH: ../g12-preflight-technical.json
      - name: Capture approved rollback baseline
        id: baseline
        working-directory: control
        run: node scripts/ev2/phase12/cloudflare-pages.mjs latest-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-website
      - name: Confirm live baseline equals the approved rollback target
        env:
          LIVE_DEPLOYMENT: ${{ steps.baseline.outputs.deployment_id }}
          LIVE_RELEASE: ${{ steps.baseline.outputs.release }}
          APPROVED_DEPLOYMENT: ${{ steps.approval.outputs.rollback_deployment_id }}
          APPROVED_RELEASE: ${{ steps.approval.outputs.rollback_release }}
        run: |
          test "$LIVE_DEPLOYMENT" = "$APPROVED_DEPLOYMENT"
          test "$LIVE_RELEASE" = "$APPROVED_RELEASE"
      - name: Apply the exact candidate migrations to the isolated production database
        working-directory: candidate
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: supabase db push --db-url "$PRODUCTION_SUPABASE_DB_URL" --include-all --yes
      - name: Configure production Edge Function secrets without exposing their values
        working-directory: control
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: https://gaiatecsistemas.com.br,https://www.gaiatecsistemas.com.br
          PUBLIC_SITE_ORIGIN: https://gaiatecsistemas.com.br
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          EVIDENCE_SALT: ${{ secrets.EVIDENCE_SALT }}
          LEAD_EVIDENCE_SALT: ${{ secrets.LEAD_EVIDENCE_SALT }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          LEAD_NOTIFICATION_TO: ${{ vars.LEAD_NOTIFICATION_TO }}
          OUTBOX_WORKER_SECRET: ${{ secrets.OUTBOX_WORKER_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/g12-production-functions.env"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'ALLOWED_ORIGINS=%s\n' "$ALLOWED_ORIGINS"
            printf 'PUBLIC_SITE_ORIGIN=%s\n' "$PUBLIC_SITE_ORIGIN"
            printf 'RATE_LIMIT_SALT=%s\n' "$RATE_LIMIT_SALT"
            printf 'EVIDENCE_SALT=%s\n' "$EVIDENCE_SALT"
            printf 'LEAD_EVIDENCE_SALT=%s\n' "$LEAD_EVIDENCE_SALT"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
            printf 'CONTACT_CAPTCHA_ALWAYS=true\n'
            printf 'CONTACT_NOTIFY_EMAIL=%s\n' "$LEAD_NOTIFICATION_TO"
            printf 'CONTACT_FROM_EMAIL=%s\n' "$EMAIL_FROM"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
            printf 'LEAD_NOTIFICATION_TO=%s\n' "$LEAD_NOTIFICATION_TO"
            printf 'CMS_ENVIRONMENT=production\n'
            printf 'CMS_ADMIN_ORIGIN=https://gaiatecsistemas.com.br\n'
            printf 'CMS_ADMIN_URL=https://gaiatecsistemas.com.br/admin\n'
            printf 'OUTBOX_WORKER_SECRET=%s\n' "$OUTBOX_WORKER_SECRET"
            printf 'CMS_EV2_PRODUCTION_ENABLED=true\n'
            printf 'CMS_AI_EXTERNAL_PROVIDER_ENABLED=true\n'
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'OPENROUTER_MODEL=%s\n' "$OPENROUTER_MODEL"
          } > "$secrets_file"
          supabase secrets set --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" --env-file "$secrets_file"
          rm -f "$secrets_file"
          trap - EXIT
      - name: Deploy the complete exact-candidate Edge Function inventory
        working-directory: control
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ev2/phase12/deploy-production-functions.mjs --source ../candidate
      - name: Lock production authentication to approved domains
        working-directory: control
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ev2/phase12/configure-production-auth.mjs
      - name: Bind the scheduled outbox worker through Supabase Vault
        working-directory: control
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OUTBOX_WORKER_SECRET: ${{ secrets.OUTBOX_WORKER_SECRET }}
        run: node scripts/ev2/phase12/configure-production-vault.mjs
      - name: Verify database, RLS, cron, Vault and deployed function modes
        working-directory: control
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" --output json > ../g12-production-functions.json
          node scripts/ev2/phase12/verify-production-functions.mjs --file ../g12-production-functions.json
          node scripts/ev2/phase12/verify-production-database.mjs | tee ../g12-production-backend.json
      - name: Publish the approved clean-room launch content through the governed CMS flow
        working-directory: control
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRODUCTION_AUTHORIZATION: ${{ inputs.confirmation }}
        run: |
          keys_json="$(supabase projects api-keys --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" --reveal --output json)"
          service_key="$(printf '%s' "$keys_json" | node -e 'let value="";process.stdin.on("data",chunk=>value+=chunk).on("end",()=>{const key=JSON.parse(value).find(item=>item.id==="service_role")?.api_key;if(!key)process.exit(1);process.stdout.write(key)})')"
          printf '::add-mask::%s\n' "$service_key"
          GAIATEC_SUPABASE_URL="$PRODUCTION_SUPABASE_URL" \
          GAIATEC_SUPABASE_ANON_KEY="$PRODUCTION_SUPABASE_ANON_KEY" \
          GAIATEC_SUPABASE_SERVICE_ROLE_KEY="$service_key" \
          GAIATEC_SUPABASE_PROJECT_REF="$PRODUCTION_SUPABASE_PROJECT_REF" \
          GAIATEC_CMS_TARGET_ENVIRONMENT=production \
          GAIATEC_PRODUCTION_CANDIDATE_SHA="$CANDIDATE_SHA" \
          GAIATEC_PRODUCTION_AUTHORIZATION="$PRODUCTION_AUTHORIZATION" \
          node scripts/phase9/publish-staging-clean-room-pages.mjs | tee ../g12-production-content.json
          GAIATEC_SUPABASE_URL="$PRODUCTION_SUPABASE_URL" \
          GAIATEC_SUPABASE_ANON_KEY="$PRODUCTION_SUPABASE_ANON_KEY" \
          GAIATEC_SUPABASE_SERVICE_ROLE_KEY="$service_key" \
          GAIATEC_SUPABASE_PROJECT_REF="$PRODUCTION_SUPABASE_PROJECT_REF" \
          GAIATEC_CMS_TARGET_ENVIRONMENT=production \
          GAIATEC_PRODUCTION_CANDIDATE_SHA="$CANDIDATE_SHA" \
          GAIATEC_PRODUCTION_AUTHORIZATION="$PRODUCTION_AUTHORIZATION" \
          node scripts/phase7/configure-staging-forms.mjs | tee ../g12-production-forms.json
          unset service_key keys_json
      - name: Probe the complete candidate against the prepared production backend
        working-directory: control
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: ${{ steps.preflight.outputs.deployment-url }}
          EV2_G12_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EV2_G12_ENVIRONMENT: production-preview
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "5"
          EV2_G12_REPORT_PATH: ../g12-preflight-probe.json
      - name: Promote the already-tested artifact
        id: promote
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: control
          command: >-
            pages deploy ../candidate/dist --project-name gaiatec-website --branch main
            --commit-hash ${{ inputs.candidate_sha }} --commit-dirty=false
      - name: Probe production after promotion
        id: production_probe
        continue-on-error: true
        working-directory: control
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://gaiatecsistemas.com.br
          EV2_G12_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EV2_G12_ENVIRONMENT: production
          EV2_G12_PRODUCTION_AUTHORIZED: "true"
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_REPORT_PATH: ../g12-production-probe.json
      - name: Automatically restore the approved prior production deployment
        if: steps.production_probe.outcome == 'failure'
        working-directory: control
        run: node scripts/ev2/phase12/cloudflare-pages.mjs rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-website
          CLOUDFLARE_DEPLOYMENT_ID: ${{ steps.baseline.outputs.deployment_id }}
          CLOUDFLARE_EXPECTED_RELEASE: ${{ steps.baseline.outputs.release }}
      - name: Confirm rollback routes after a failed production probe
        if: steps.production_probe.outcome == 'failure'
        working-directory: control
        run: node scripts/phase2/http-smoke.mjs https://gaiatecsistemas.com.br
      - name: Fail the release after automatic rollback
        if: steps.production_probe.outcome == 'failure'
        run: exit 1
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-release-${{ inputs.candidate_sha }}
          path: |
            candidate/dist/release-manifest.json
            g12-preflight-technical.json
            g12-preflight-probe.json
            g12-production-backend.json
            g12-production-content.json
            g12-production-forms.json
            g12-production-functions.json
            g12-production-probe.json
          if-no-files-found: warn
          retention-days: 90
