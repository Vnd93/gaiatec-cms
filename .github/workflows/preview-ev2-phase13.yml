name: EV2.13 Candidate Preview (not a gate)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA completo e exato aprovado para o preview isolado EV2.13
        required: true
      confirmation:
        description: Digite PREVIEW-G13-STAGING
        required: true
      runtime_manifest_candidate:
        description: Confirmar o manifesto runtime fail-closed no candidato isolado
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ev2-g13-candidate-preview
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.ref_name == 'ev2/fase-13-hardening-pre-producao' &&
      inputs.confirmation == 'PREVIEW-G13-STAGING' &&
      inputs.runtime_manifest_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      PREVIEW_DEPLOY_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.STAGING_SUPABASE_URL != '' && secrets.STAGING_SUPABASE_ANON_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Validate immutable candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(printf '%s' "$EXPECTED_SHA" | grep -E '^[a-f0-9]{40}$')" = "$EXPECTED_SHA"
          git fetch origin refs/heads/ev2/fase-13-hardening-pre-producao:refs/remotes/origin/ev2/fase-13-hardening-pre-producao --no-tags
          git merge-base --is-ancestor "$EXPECTED_SHA" "origin/ev2/fase-13-hardening-pre-producao"
      - name: Require isolated Pages preview configuration
        run: test "$PREVIEW_DEPLOY_CONFIGURED" = "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Build isolated runtime candidate
        run: npm run build:staging
        env:
          VITE_RELEASE: ${{ inputs.expected_sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - run: npm run artifact:manifest
        env:
          GITHUB_SHA: ${{ inputs.expected_sha }}
      - id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist --project-name gaiatec-cms-staging --branch ev2-g13-canary
            --commit-hash ${{ inputs.expected_sha }} --commit-dirty=false
      - run: npm run smoke:http -- "${{ steps.deploy.outputs.deployment-url }}"
      - run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          PLAYWRIGHT_EDGE: "1"
      - run: npm run probe:ev2:phase12
        env:
          EV2_G12_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
          EV2_G12_EXPECTED_SHA: ${{ inputs.expected_sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_SAMPLE_COUNT: "5"
          EV2_G12_REPORT_PATH: g13-http-probe.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ev2-g13-candidate-preview-${{ inputs.expected_sha }}
          path: g13-http-probe.json
          if-no-files-found: error
          retention-days: 30
