name: EV2.12 Canary Preview

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA completo e exato aprovado para o canary EV2.12
        required: true
      confirmation:
        description: Digite CANARY-G12-STAGING:<SHA>:FULL
        required: true
      ev2_full_candidate:
        description: Habilitar a integração EV2 somente no build isolado de staging
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ev2-g12-canary
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      CANARY_DEPLOY_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.STAGING_SUPABASE_URL != '' && secrets.STAGING_SUPABASE_ANON_KEY != '' }}
    steps:
      - name: Validate G12 canary dispatch authorization before checkout
        env:
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FULL_CANDIDATE: ${{ inputs.ev2_full_candidate }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF_NAME" != "ev2/desenvolvimento-fases-1-a-12" ]; then
            echo "::error::The G12 canary must be dispatched from its approved branch."
            exit 1
          fi
          if ! [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [ "$CONFIRMATION" != "CANARY-G12-STAGING:$EXPECTED_SHA:FULL" ] || [ "$FULL_CANDIDATE" != "true" ]; then
            echo "::error::The G12 canary authorization is invalid."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Validate immutable candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(printf '%s' "$EXPECTED_SHA" | grep -E '^[a-f0-9]{40}$')" = "$EXPECTED_SHA"
          git fetch origin refs/heads/ev2/desenvolvimento-fases-1-a-12:refs/remotes/origin/ev2/desenvolvimento-fases-1-a-12 --no-tags
          git merge-base --is-ancestor "$EXPECTED_SHA" "origin/ev2/desenvolvimento-fases-1-a-12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Build isolated full EV2 candidate
        run: npm run build:staging
        env:
          VITE_RELEASE: ${{ inputs.expected_sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_EV2_DRAFT_V2_CANDIDATE: "true"
          VITE_EV2_MASTER_DATA_CANDIDATE: "true"
          VITE_EV2_PIM_CANDIDATE: "true"
          VITE_EV2_DAM_CANDIDATE: "true"
          VITE_EV2_SEARCH_QUALITY_CANDIDATE: "true"
          VITE_EV2_COLLABORATION_BULK_CANDIDATE: "true"
          VITE_EV2_RBAC_SCOPED_CANDIDATE: "true"
          VITE_EV2_VISUAL_STUDIO_CANDIDATE: "true"
          VITE_EV2_MULTISITE_CANDIDATE: "true"
          VITE_EV2_AI_ASSIST_CANDIDATE: "true"
          VITE_EV2_SYSTEM_ASSURANCE_CANDIDATE: "true"
      - run: npm run artifact:manifest
        env:
          GITHUB_SHA: ${{ inputs.expected_sha }}
      - if: env.CANARY_DEPLOY_CONFIGURED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ev2-g12-canary-${{ inputs.expected_sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist --project-name gaiatec-cms-staging --branch ev2-g12-canary
            --commit-hash ${{ inputs.expected_sha }} --commit-dirty=false
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        run: npm run smoke:http -- "${{ steps.deploy.outputs.deployment-url }}"
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          PLAYWRIGHT_EDGE: "1"
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        run: npm run probe:ev2:phase12
        env:
          EV2_G12_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
          EV2_G12_EXPECTED_SHA: ${{ inputs.expected_sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_SAMPLE_COUNT: "5"
          EV2_G12_REPORT_PATH: g12-probe.json
      - if: always() && env.CANARY_DEPLOY_CONFIGURED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ev2-g12-probe-${{ inputs.expected_sha }}
          path: g12-probe.json
          if-no-files-found: error
          retention-days: 30
