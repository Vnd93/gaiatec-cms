name: Promote staging cms-public hotfix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Digite a autorizacao literal vinculada ao hotfix e ao rollback imutaveis.
        required: true
      promotion_ci_run_id:
        description: Successful CI run bound to this exact promotion control SHA
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.run_attempt == '1' && 'staging' || format('staging-hotfix-rerun-refused-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

env:
  HOTFIX_SHA: e40eb0c2cc81c27fbf8f23e8671136f9dfc6f282
  HOTFIX_PARENT_SHA: 4f96e78bad1d29fbee245a11c7536986f2bf79c6
  ROLLBACK_SHA: c8aec5cad25830580bf9ca8a89594ebce1aa3570
  EDGE_RUNTIME_IMAGE: >-
    ghcr.io/supabase/edge-runtime:v1.74.3@sha256:c52405002a890ca9fcf77978671c57f3a988e03174afb277f84ac65bc917013c
  EDGE_RUNTIME_INDEX_DIGEST: sha256:c52405002a890ca9fcf77978671c57f3a988e03174afb277f84ac65bc917013c
  EDGE_RUNTIME_AMD64_DIGEST: sha256:cc355c3d0e9c063a351cad56d1c4c52a3c4d85aff4e1fad9d91688e75f9aad09
  RECOVERED_BASELINE_RUN_ID: "35303083920"
  RECOVERED_BASELINE_RUN_ATTEMPT: "1"
  RECOVERED_BASELINE_TERMINAL_ARTIFACT_ID: "10529724829"
  RECOVERED_BASELINE_RECEIPT_ARTIFACT_ID: "10530705305"

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.candidate_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate_artifact.outputs.artifact-digest }}
      artifact_name: ${{ steps.names.outputs.candidate }}
    steps:
      - name: Validate the exact operator, branch and literal authorization
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_SHA: ${{ github.sha }}
          PROMOTION_CI_RUN_ID: ${{ inputs.promotion_ci_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = 1
          test "$DISPATCH_REF" = refs/heads/main
          test "${DISPATCH_ACTOR,,}" = vnd93
          test "${TRIGGERING_ACTOR,,}" = vnd93
          [[ "$PROMOTION_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          expected="PROMOTE_STAGING_CMS_PUBLIC_${HOTFIX_SHA}_CONTROL_${CONTROL_SHA}_CI_${PROMOTION_CI_RUN_ID}_RECOVERY_RUN_${RECOVERED_BASELINE_RUN_ID}_ATTEMPT_${RECOVERED_BASELINE_RUN_ATTEMPT}_TERMINAL_${RECOVERED_BASELINE_TERMINAL_ARTIFACT_ID}_RECEIPT_${RECOVERED_BASELINE_RECEIPT_ARTIFACT_ID}_ROLLBACK_${ROLLBACK_SHA}"
          test "$CONFIRMATION" = "$expected"
      - name: Checkout the exact workflow control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Use the repository-pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Verify the fresh promotion control and its exact successful CI
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          PROMOTION_CI_RUN_ID: ${{ inputs.promotion_ci_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs verify-promotion-dispatch
          --control-sha "$CONTROL_SHA"
          --ci-run-id "$PROMOTION_CI_RUN_ID"
          --confirmation "$CONFIRMATION"
          --output ../promotion-dispatch-evidence.json
      - name: Checkout the immutable cms-public hotfix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HOTFIX_SHA }}
          fetch-depth: 0
          path: candidate-source
          persist-credentials: false
      - name: Checkout the immutable hotfix parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HOTFIX_PARENT_SHA }}
          fetch-depth: 0
          path: parent-source
          persist-credentials: false
      - name: Checkout the immutable rollback baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ROLLBACK_SHA }}
          fetch-depth: 0
          path: rollback-source
          persist-credentials: false
      - name: Verify the exact successful CI run bound to the hotfix bytes
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs verify-candidate-ci
          --output ../candidate-ci-evidence.json
      - name: Prove all source, lock and function-scope identities
        working-directory: control
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs verify-sources
          --candidate ../candidate-source
          --parent ../parent-source
          --rollback ../rollback-source
          --output ../candidate-source-evidence.json
      - name: Prepare the complete read-only candidate input tree
        working-directory: control
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs prepare-bundle-input
          --source ../candidate-source
          --output ../bundle-input
      - name: Verify and pull the immutable linux amd64 edge-runtime image
        env:
          INDEX_MANIFEST: ${{ runner.temp }}/g12-edge-runtime-index.json
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$EDGE_RUNTIME_IMAGE" > "$INDEX_MANIFEST"
          test "sha256:$(sha256sum "$INDEX_MANIFEST" | awk '{print $1}')" = "$EDGE_RUNTIME_INDEX_DIGEST"
          test "$(jq -r --arg digest "$EDGE_RUNTIME_AMD64_DIGEST" \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $digest)] | length' \
            "$INDEX_MANIFEST")" = 1
          docker pull --platform linux/amd64 "$EDGE_RUNTIME_IMAGE"
      - name: Build the primary candidate online with canonical JSR identities
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/g12-primary" "$RUNNER_TEMP/g12-primary-cache"
          input_tree="$(jq -r .inputTreeSha256 bundle-input/bundle-input-manifest.json)"
          input_count="$(jq -r .inputFileCount bundle-input/bundle-input-manifest.json)"
          jsr_manifest="$(jq -r .jsrMirror.manifestSha256 bundle-input/bundle-input-manifest.json)"
          jsr_files_manifest="$(jq -r .jsrMirror.filesManifestSha256 bundle-input/bundle-input-manifest.json)"
          jsr_tree="$(jq -r .jsrMirror.treeSha256 bundle-input/bundle-input-manifest.json)"
          jsr_count="$(jq -r .jsrMirror.fileCount bundle-input/bundle-input-manifest.json)"
          jsr_bytes="$(jq -r .jsrMirror.bytes bundle-input/bundle-input-manifest.json)"
          source_deno_lock_sha256="$(jq -r .sourceDenoLockSha256 bundle-input/bundle-input-manifest.json)"
          bundle_deno_lock_sha256="$(jq -r .bundleDenoLockSha256 bundle-input/bundle-input-manifest.json)"
          bundle_deno_lock_npm_roots="$(jq -c .bundleDenoLock.npmRootSpecifiers bundle-input/bundle-input-manifest.json)"
          bundle_deno_lock_evidence="$(jq -c .bundleDenoLock bundle-input/bundle-input-manifest.json)"
          docker run --rm --platform linux/amd64 --network bridge --read-only \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864,mode=1777 \
            --volume "$GITHUB_WORKSPACE/bundle-input:/workspace:ro" \
            --volume "$RUNNER_TEMP/g12-primary:/output:rw" \
            --volume "$RUNNER_TEMP/g12-primary-cache:/deno-cache:rw" \
            --volume "$GITHUB_WORKSPACE/control/scripts/ev2/phase12/staging-cms-public-hotfix-bundle.sh:/g12-builder.sh:ro" \
            --env HOME=/tmp --env DENO_DIR=/deno-cache --env DENO_NO_PACKAGE_JSON=1 \
            --env JSR_URL=https://jsr.io/ \
            --env G12_EDGE_RUNTIME_INDEX_DIGEST="$EDGE_RUNTIME_INDEX_DIGEST" \
            --env G12_EDGE_RUNTIME_AMD64_DIGEST="$EDGE_RUNTIME_AMD64_DIGEST" \
            --env G12_PLATFORM=linux/amd64 \
            --env G12_INPUT_TREE_SHA256="$input_tree" \
            --env G12_INPUT_FILE_COUNT="$input_count" \
            --env G12_JSR_MIRROR_MANIFEST_SHA256="$jsr_manifest" \
            --env G12_JSR_MIRROR_FILES_MANIFEST_SHA256="$jsr_files_manifest" \
            --env G12_JSR_MIRROR_TREE_SHA256="$jsr_tree" \
            --env G12_JSR_MIRROR_FILE_COUNT="$jsr_count" \
            --env G12_JSR_MIRROR_BYTES="$jsr_bytes" \
            --env G12_SOURCE_DENO_LOCK_SHA256="$source_deno_lock_sha256" \
            --env G12_BUNDLE_DENO_LOCK_SHA256="$bundle_deno_lock_sha256" \
            --env G12_BUNDLE_DENO_LOCK_NPM_ROOT_SPECIFIERS="$bundle_deno_lock_npm_roots" \
            --env G12_BUNDLE_DENO_LOCK_EVIDENCE_JSON="$bundle_deno_lock_evidence" \
            --entrypoint /bin/sh "$EDGE_RUNTIME_IMAGE" /g12-builder.sh online-primary default
      - name: Rebuild independently online with canonical JSR identities
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/g12-rebuild" "$RUNNER_TEMP/g12-rebuild-cache"
          input_tree="$(jq -r .inputTreeSha256 bundle-input/bundle-input-manifest.json)"
          input_count="$(jq -r .inputFileCount bundle-input/bundle-input-manifest.json)"
          jsr_manifest="$(jq -r .jsrMirror.manifestSha256 bundle-input/bundle-input-manifest.json)"
          jsr_files_manifest="$(jq -r .jsrMirror.filesManifestSha256 bundle-input/bundle-input-manifest.json)"
          jsr_tree="$(jq -r .jsrMirror.treeSha256 bundle-input/bundle-input-manifest.json)"
          jsr_count="$(jq -r .jsrMirror.fileCount bundle-input/bundle-input-manifest.json)"
          jsr_bytes="$(jq -r .jsrMirror.bytes bundle-input/bundle-input-manifest.json)"
          source_deno_lock_sha256="$(jq -r .sourceDenoLockSha256 bundle-input/bundle-input-manifest.json)"
          bundle_deno_lock_sha256="$(jq -r .bundleDenoLockSha256 bundle-input/bundle-input-manifest.json)"
          bundle_deno_lock_npm_roots="$(jq -c .bundleDenoLock.npmRootSpecifiers bundle-input/bundle-input-manifest.json)"
          bundle_deno_lock_evidence="$(jq -c .bundleDenoLock bundle-input/bundle-input-manifest.json)"
          docker run --rm --platform linux/amd64 --network bridge --read-only \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864,mode=1777 \
            --volume "$GITHUB_WORKSPACE/bundle-input:/workspace:ro" \
            --volume "$RUNNER_TEMP/g12-rebuild:/output:rw" \
            --volume "$RUNNER_TEMP/g12-rebuild-cache:/deno-cache:rw" \
            --volume "$GITHUB_WORKSPACE/control/scripts/ev2/phase12/staging-cms-public-hotfix-bundle.sh:/g12-builder.sh:ro" \
            --env HOME=/tmp --env DENO_DIR=/deno-cache --env DENO_NO_PACKAGE_JSON=1 \
            --env JSR_URL=https://jsr.io/ \
            --env G12_EDGE_RUNTIME_INDEX_DIGEST="$EDGE_RUNTIME_INDEX_DIGEST" \
            --env G12_EDGE_RUNTIME_AMD64_DIGEST="$EDGE_RUNTIME_AMD64_DIGEST" \
            --env G12_PLATFORM=linux/amd64 \
            --env G12_INPUT_TREE_SHA256="$input_tree" \
            --env G12_INPUT_FILE_COUNT="$input_count" \
            --env G12_JSR_MIRROR_MANIFEST_SHA256="$jsr_manifest" \
            --env G12_JSR_MIRROR_FILES_MANIFEST_SHA256="$jsr_files_manifest" \
            --env G12_JSR_MIRROR_TREE_SHA256="$jsr_tree" \
            --env G12_JSR_MIRROR_FILE_COUNT="$jsr_count" \
            --env G12_JSR_MIRROR_BYTES="$jsr_bytes" \
            --env G12_SOURCE_DENO_LOCK_SHA256="$source_deno_lock_sha256" \
            --env G12_BUNDLE_DENO_LOCK_SHA256="$bundle_deno_lock_sha256" \
            --env G12_BUNDLE_DENO_LOCK_NPM_ROOT_SPECIFIERS="$bundle_deno_lock_npm_roots" \
            --env G12_BUNDLE_DENO_LOCK_EVIDENCE_JSON="$bundle_deno_lock_evidence" \
            --entrypoint /bin/sh "$EDGE_RUNTIME_IMAGE" /g12-builder.sh online-rebuild default
      - name: Verify and report the bounded raw ESZIP sizes
        run: |
          set -euo pipefail
          maximum_raw_eszip_bytes=67108864
          primary_eszip="$RUNNER_TEMP/g12-primary/output.eszip"
          rebuild_eszip="$RUNNER_TEMP/g12-rebuild/output.eszip"
          primary_attestation="$RUNNER_TEMP/g12-primary/build-attestation.env"
          rebuild_attestation="$RUNNER_TEMP/g12-rebuild/build-attestation.env"
          refuse() {
            printf '%s\n' "$1" >&2
            exit 1
          }
          attested_bytes() {
            awk -F= '
              $1 == "RAW_ESZIP_BYTES" { count += 1; value = $2 }
              END {
                if (count != 1 || value !~ /^[1-9][0-9]*$/) exit 1
                print value
              }
            ' "$1"
          }
          for path in "$primary_eszip" "$rebuild_eszip" "$primary_attestation" "$rebuild_attestation"; do
            test -f "$path" && test ! -L "$path" || \
              refuse G12_STAGING_CMS_PUBLIC_HOTFIX_SIZE_EVIDENCE_FILE_REFUSED
          done
          if ! primary_bytes="$(stat -c %s -- "$primary_eszip")"; then
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_PRIMARY_ESZIP_STAT_REFUSED
          fi
          if ! rebuild_bytes="$(stat -c %s -- "$rebuild_eszip")"; then
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_REBUILD_ESZIP_STAT_REFUSED
          fi
          if ! primary_attested_bytes="$(attested_bytes "$primary_attestation")"; then
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_PRIMARY_ESZIP_ATTESTATION_REFUSED
          fi
          if ! rebuild_attested_bytes="$(attested_bytes "$rebuild_attestation")"; then
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_REBUILD_ESZIP_ATTESTATION_REFUSED
          fi
          test "$primary_bytes" = "$primary_attested_bytes" || \
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_PRIMARY_ESZIP_SIZE_REFUSED
          test "$rebuild_bytes" = "$rebuild_attested_bytes" || \
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_REBUILD_ESZIP_SIZE_REFUSED
          test "$primary_bytes" = "$rebuild_bytes" || \
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_REPRODUCIBLE_ESZIP_SIZE_REFUSED
          printf '{"event":"g12.staging.cms_public_hotfix.raw_eszip_boundary","primaryRawEszipBytes":%s,"rebuildRawEszipBytes":%s,"maximumRawEszipBytes":%s}\n' \
            "$primary_bytes" "$rebuild_bytes" "$maximum_raw_eszip_bytes"
          test "$primary_bytes" -le "$maximum_raw_eszip_bytes" || \
            refuse G12_STAGING_CMS_PUBLIC_HOTFIX_RAW_ESZIP_SIZE_REFUSED
      - name: Cold-boot the exact byte-identical candidate without external egress
        run: >-
          sh control/scripts/ev2/phase12/staging-cms-public-hotfix-boot-smoke.sh
          "$RUNNER_TEMP/g12-primary/output.eszip"
      - name: Seal only byte-identical independent online builds
        working-directory: control
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs seal-candidate
          --bundle-input ../bundle-input
          --primary "$RUNNER_TEMP/g12-primary"
          --rebuild "$RUNNER_TEMP/g12-rebuild"
          --output ../candidate-sealed
      - name: Derive the unique candidate artifact name
        id: names
        run: >-
          printf 'candidate=staging-cms-public-hotfix-candidate-%s-%s\n'
          "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload the sealed candidate exactly once
        id: candidate_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.candidate }}
          path: candidate-sealed
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
          include-hidden-files: false
      - name: Verify candidate artifact metadata against this exact run
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs verify-run-artifact
          --kind candidate
          --artifact-id "${{ steps.candidate_artifact.outputs.artifact-id }}"
          --artifact-name "${{ steps.names.outputs.candidate }}"
          --artifact-digest "${{ steps.candidate_artifact.outputs.artifact-digest }}"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --control-sha "$GITHUB_SHA"
          --workflow-path .github/workflows/promote-staging-cms-public-hotfix.yml

  promote:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    steps:
      - name: Validate the exact promotion identity
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_SHA: ${{ github.sha }}
          PROMOTION_CI_RUN_ID: ${{ inputs.promotion_ci_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build-candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.build-candidate.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = 1
          test "$DISPATCH_REF" = refs/heads/main
          test "${DISPATCH_ACTOR,,}" = vnd93
          test "${TRIGGERING_ACTOR,,}" = vnd93
          [[ "$PROMOTION_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          expected="PROMOTE_STAGING_CMS_PUBLIC_${HOTFIX_SHA}_CONTROL_${CONTROL_SHA}_CI_${PROMOTION_CI_RUN_ID}_RECOVERY_RUN_${RECOVERED_BASELINE_RUN_ID}_ATTEMPT_${RECOVERED_BASELINE_RUN_ATTEMPT}_TERMINAL_${RECOVERED_BASELINE_TERMINAL_ARTIFACT_ID}_RECEIPT_${RECOVERED_BASELINE_RECEIPT_ARTIFACT_ID}_ROLLBACK_${ROLLBACK_SHA}"
          test "$CONFIRMATION" = "$expected"
          test -n "$CANDIDATE_ARTIFACT_ID"
          test "$CANDIDATE_ARTIFACT_NAME" = \
            "staging-cms-public-hotfix-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Checkout the exact trusted control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Use the repository-pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Fail closed on every occupied staging recovery domain
        id: initial_recovery_fence
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs fence
          --owner-kind staging-cms-public-hotfix --require-empty
          --file ../initial-recovery-fence.json
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --control-sha "$GITHUB_SHA"
      - name: Verify the exact candidate artifact before download
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs verify-run-artifact
          --kind candidate
          --artifact-id "${{ needs.build-candidate.outputs.artifact_id }}"
          --artifact-name "${{ needs.build-candidate.outputs.artifact_name }}"
          --artifact-digest "${{ needs.build-candidate.outputs.artifact_digest }}"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --control-sha "$GITHUB_SHA"
          --workflow-path .github/workflows/promote-staging-cms-public-hotfix.yml
      - name: Download only the resolved immutable candidate into a fresh directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-candidate.outputs.artifact_id }}
          digest-mismatch: error
          path: candidate-roundtrip
          merge-multiple: true
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Materialize the exact candidate ESZIP from the round trip
        working-directory: control
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs materialize-candidate-eszip
          --candidate ../candidate-roundtrip
          --output "$RUNNER_TEMP/g12-consumer-input/output.eszip"
      - name: Reparse every candidate module with the immutable runtime offline
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/g12-consumer-input" "$RUNNER_TEMP/g12-consumer-unbundled"
          test -s "$RUNNER_TEMP/g12-consumer-input/output.eszip"
          docker pull --platform linux/amd64 "$EDGE_RUNTIME_IMAGE"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864,mode=1777 \
            --volume "$RUNNER_TEMP/g12-consumer-input:/candidate:ro" \
            --volume "$RUNNER_TEMP/g12-consumer-unbundled:/output:rw" \
            --env HOME=/tmp \
            --entrypoint /bin/sh "$EDGE_RUNTIME_IMAGE" -c \
            'edge-runtime unbundle --eszip /candidate/output.eszip --output /output/supabase/functions/cms-public'
      - name: Bind the runtime reparse to both sealed build manifests
        working-directory: control
        run: >-
          node scripts/ev2/phase12/staging-cms-public-hotfix.mjs verify-runtime-unbundle
          --candidate ../candidate-roundtrip
          --unbundled "$RUNNER_TEMP/g12-consumer-unbundled"
      - name: Cold-boot the round-tripped candidate before any mutation
        run: >-
          sh control/scripts/ev2/phase12/staging-cms-public-hotfix-boot-smoke.sh
          "$RUNNER_TEMP/g12-consumer-input/output.eszip"
      - name: Download the immutable trusted terminal baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "10373653337"
          digest-mismatch: error
          path: trusted-baseline
          merge-multiple: true
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "34908383307"
      - name: Download the immutable recovered baseline terminal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "10529724829"
          digest-mismatch: error
          path: trusted-recovery-terminal
          merge-multiple: true
