name: EV2.8 Canary Preview

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA exato aprovado para o canary EV2.8
        required: true
      ev2_rbac_scoped_candidate:
        description: Habilitar a interface candidata EV2.8
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ev2-g8-canary
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref_name == 'ev2/desenvolvimento-fases-1-a-12'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - run: test "${{ inputs.ev2_rbac_scoped_candidate }}" = "true"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:staging
        env:
          VITE_RELEASE: ${{ github.sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_EV2_DRAFT_V2_CANDIDATE: "false"
          VITE_EV2_MASTER_DATA_CANDIDATE: "false"
          VITE_EV2_PIM_CANDIDATE: "false"
          VITE_EV2_DAM_CANDIDATE: "false"
          VITE_EV2_SEARCH_QUALITY_CANDIDATE: "false"
          VITE_EV2_COLLABORATION_BULK_CANDIDATE: "false"
          VITE_EV2_RBAC_SCOPED_CANDIDATE: ${{ inputs.ev2_rbac_scoped_candidate }}
      - run: npm run artifact:manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
      - if: env.CLOUDFLARE_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ev2-g8-canary-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - if: env.CLOUDFLARE_CONFIGURED == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gaiatec-cms-staging --branch ev2-g8-canary
      - if: env.CLOUDFLARE_CONFIGURED == 'true'
        run: npm run smoke:http -- "${{ steps.deploy.outputs.deployment-url }}"
