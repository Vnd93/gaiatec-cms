name: Promote staging frontend bridge watchdog

on:
  workflow_run:
    workflows: ["Promote staging frontend bridge"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-recovery-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  compensate-incomplete-frontend-bridge:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/promote-staging-frontend-bridge.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - name: Checkout the exact trusted bridge control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Recover HMAC state independently of workflow artifacts
        id: variable_state
        continue-on-error: true
        working-directory: control
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs get
          --allow-missing
          --kind staging-deploy --file ../state-variable/staging-frontend-bridge-state.json
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
      - name: Inventory exact immutable recovery state and baseline artifacts
        id: recovery_inventory
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          async function main() {
            const repository = process.env.GITHUB_REPOSITORY;
            const runId = process.env.TRIGGER_RUN_ID;
            const runAttempt = process.env.TRIGGER_RUN_ATTEMPT;
            const token = process.env.GITHUB_TOKEN || "";
            if (repository !== "Vnd93/gaiatec-cms" || !/^[1-9]\d*$/.test(runId || "") ||
                !/^[1-9]\d*$/.test(runAttempt || "") || token.length < 30)
              throw new Error("G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_INPUT_REFUSED");
            const expectedNames = {
              state: `staging-frontend-bridge-state-${runId}-${runAttempt}`,
              recovery: `staging-frontend-bridge-recovery-${runId}-${runAttempt}`,
            };
            const response = await fetch(
              `https://api.github.com/repos/${repository}/actions/runs/${runId}/artifacts?per_page=100`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                },
                signal: AbortSignal.timeout(30_000),
              },
            );
            if (!response.ok)
              throw new Error(`G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_API_REFUSED:${response.status}`);
            const payload = await response.json().catch(() => null);
            if (!payload || !Number.isSafeInteger(payload.total_count) || payload.total_count < 0 ||
                payload.total_count > 100 || !Array.isArray(payload.artifacts) ||
                payload.artifacts.length !== payload.total_count)
              throw new Error("G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_RESPONSE_REFUSED");
            const resolve = (role) => {
              const matches = payload.artifacts.filter((artifact) => artifact?.name === expectedNames[role]);
              if (matches.length > 1) throw new Error("G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_AMBIGUOUS");
              if (matches.length === 0)
                return { present: false, id: "", digest: "", name: expectedNames[role] };
              const artifact = matches[0];
              const rawDigest = artifact.digest || "";
              const normalizedDigest = rawDigest.startsWith("sha256:")
                ? rawDigest
                : `sha256:${rawDigest}`;
              if (!Number.isSafeInteger(artifact.id) || artifact.id < 1 || artifact.expired !== false ||
                  !/^sha256:[a-f0-9]{64}$/.test(normalizedDigest))
                throw new Error("G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_IDENTITY_REFUSED");
              return { present: true, id: String(artifact.id), digest: normalizedDigest, name: artifact.name };
            };
            const state = resolve("state");
            const recovery = resolve("recovery");
            appendFileSync(process.env.GITHUB_OUTPUT, [
              `state_present=${state.present}`,
              `state_id=${state.id}`,
              `state_digest=${state.digest}`,
              `state_name=${state.name}`,
              `recovery_present=${recovery.present}`,
              `recovery_id=${recovery.id}`,
              `recovery_digest=${recovery.digest}`,
              `recovery_name=${recovery.name}`,
            ].join("\n") + "\n");
          }
          main().catch((error) => {
            const message = error instanceof Error && error.message.startsWith("G12_")
              ? error.message
              : "G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_REQUEST_FAILED";
            console.error(message);
            process.exitCode = 1;
          });
          NODE
      - name: Download immutable pre-mutation state by exact artifact ID
        id: recovery_state_artifact
        if: steps.recovery_inventory.outputs.state_present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.recovery_inventory.outputs.state_id }}
          digest-mismatch: error
          path: state-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Download immutable pre-mutation baseline by exact artifact ID
        id: recovery_artifact
        if: steps.recovery_inventory.outputs.recovery_present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.recovery_inventory.outputs.recovery_id }}
          digest-mismatch: error
          path: recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate exact bridge state and immutable ancestry
        id: watchdog_state
        working-directory: control
        env:
          VARIABLE_STATE_OUTCOME: ${{ steps.variable_state.outcome }}
          VARIABLE_STATE_PRESENT: ${{ steps.variable_state.outputs.state_present }}
          ARTIFACT_INVENTORY_OUTCOME: ${{ steps.recovery_inventory.outcome }}
          STATE_ARTIFACT_PRESENT: ${{ steps.recovery_inventory.outputs.state_present }}
          STATE_ARTIFACT_ID: ${{ steps.recovery_inventory.outputs.state_id }}
          STATE_ARTIFACT_DIGEST: ${{ steps.recovery_inventory.outputs.state_digest }}
          STATE_ARTIFACT_NAME: ${{ steps.recovery_inventory.outputs.state_name }}
          STATE_ARTIFACT_OUTCOME: ${{ steps.recovery_state_artifact.outcome }}
          RECOVERY_ARTIFACT_PRESENT: ${{ steps.recovery_inventory.outputs.recovery_present }}
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery_inventory.outputs.recovery_id }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.recovery_inventory.outputs.recovery_digest }}
          RECOVERY_ARTIFACT_NAME: ${{ steps.recovery_inventory.outputs.recovery_name }}
          RECOVERY_ARTIFACT_OUTCOME: ${{ steps.recovery_artifact.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          if (!process.env.TRIGGER_CONCLUSION || process.env.TRIGGER_CONCLUSION === "success")
            throw new Error("G12_STAGING_BRIDGE_WATCHDOG_CONCLUSION_REFUSED");
          const variablePresent = process.env.VARIABLE_STATE_OUTCOME === "success" &&
            process.env.VARIABLE_STATE_PRESENT === "true";
          const variableAbsent = process.env.VARIABLE_STATE_OUTCOME === "success" &&
            process.env.VARIABLE_STATE_PRESENT === "false";
          const inventoryValid = process.env.ARTIFACT_INVENTORY_OUTCOME === "success";
          const stateArtifactPresent = inventoryValid && process.env.STATE_ARTIFACT_PRESENT === "true";
          const stateArtifactAbsent = inventoryValid && process.env.STATE_ARTIFACT_PRESENT === "false";
          const recoveryArtifactPresent = inventoryValid && process.env.RECOVERY_ARTIFACT_PRESENT === "true";
          const recoveryArtifactAbsent = inventoryValid && process.env.RECOVERY_ARTIFACT_PRESENT === "false";
          if ((!variablePresent && !variableAbsent) ||
              (!stateArtifactPresent && !stateArtifactAbsent) ||
              (!recoveryArtifactPresent && !recoveryArtifactAbsent))
            throw new Error("G12_STAGING_BRIDGE_WATCHDOG_STATE_SOURCE_REFUSED");
          if (stateArtifactPresent !== recoveryArtifactPresent)
            throw new Error("G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_PAIR_REFUSED");
          if (variablePresent && (!stateArtifactPresent || !recoveryArtifactPresent))
            throw new Error("G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_MISSING_WITH_STATE");
          if (variableAbsent) {
            appendFileSync(process.env.GITHUB_OUTPUT,
              `recovery_required=false\nclear_required=false\nstate_absence=confirmed\nartifact_present=${stateArtifactPresent}\n`);
            process.exit(0);
          }
          if (process.env.STATE_ARTIFACT_OUTCOME !== "success" ||
              process.env.RECOVERY_ARTIFACT_OUTCOME !== "success")
            throw new Error("G12_STAGING_BRIDGE_WATCHDOG_ARTIFACT_DOWNLOAD_REFUSED");
          const artifactStatePath = "../state-artifact/staging-frontend-bridge-state.json";
          const artifactStateBytes = readFileSync(artifactStatePath);
          if (variablePresent) {
            const variableStateBytes = readFileSync("../state-variable/staging-frontend-bridge-state.json");
            if (!variableStateBytes.equals(artifactStateBytes))
              throw new Error("G12_STAGING_BRIDGE_WATCHDOG_STATE_REDUNDANCY_REFUSED");
          }
          const statePath = "../state-variable/staging-frontend-bridge-state.json";
          const state = JSON.parse(artifactStateBytes.toString("utf8"));
          const sha = /^[a-f0-9]{40}$/;
          const sha256 = /^[a-f0-9]{64}$/;
          const artifactDigest = /^sha256:[a-f0-9]{64}$/;
          const positiveInteger = /^[1-9]\d*$/;
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const compensationMarker = /^g12-staging-(?:deploy|rollback|bridge)-compensation-[1-9]\d*-[1-9]\d*$/;
          const exact = (value, keys) => value && typeof value === "object" && !Array.isArray(value) &&
            JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());
          if (
            !exact(state, ["schemaVersion", "event", "workflow", "project", "branch", "runMarker",
              "compensationMarker", "candidateRelease", "original", "recovery"]) ||
            !exact(state.workflow, ["runId", "runAttempt", "controlSha"]) ||
            !exact(state.original, ["deploymentId", "release", "createdOn", "commitMessage"]) ||
            !exact(state.recovery, ["artifact", "seal"]) ||
            !exact(state.recovery?.artifact, ["id", "digest", "name"]) ||
            !exact(state.recovery?.seal, ["schemaVersion", "candidateSha", "fileCount", "byteCount",
              "treeSha256", "archiveFile", "archiveBytes", "archiveSha256"]) ||
            state.schemaVersion !== 1 || state.event !== "g12.staging.deploy.prepared" ||
            String(state.workflow.runId) !== process.env.TRIGGER_RUN_ID ||
            Number(state.workflow.runAttempt) !== Number(process.env.TRIGGER_RUN_ATTEMPT) ||
            state.workflow.controlSha !== process.env.TRIGGER_HEAD_SHA ||
            state.project !== "gaiatec-cms-staging" || state.branch !== "ev2-g17-canary" ||
            !sha.test(state.candidateRelease || "") || !sha.test(state.original.release || "") ||
            (state.candidateRelease === state.original.release &&
              !compensationMarker.test(state.original.commitMessage || "")) ||
            !uuid.test(state.original.deploymentId || "") ||
            !Number.isFinite(Date.parse(state.original.createdOn || "")) ||
            typeof state.original.commitMessage !== "string" || state.original.commitMessage.includes("\0") ||
            Buffer.byteLength(state.original.commitMessage, "utf8") > 4096 ||
            Buffer.from(state.original.commitMessage, "utf8").toString("utf8") !== state.original.commitMessage ||
            state.recovery.artifact.id !== process.env.RECOVERY_ARTIFACT_ID ||
            state.recovery.artifact.digest !== process.env.RECOVERY_ARTIFACT_DIGEST ||
            state.recovery.artifact.name !== process.env.RECOVERY_ARTIFACT_NAME ||
            !positiveInteger.test(process.env.STATE_ARTIFACT_ID || "") ||
            !artifactDigest.test(process.env.STATE_ARTIFACT_DIGEST || "") ||
            process.env.STATE_ARTIFACT_NAME !== `staging-frontend-bridge-state-${process.env.TRIGGER_RUN_ID}-${process.env.TRIGGER_RUN_ATTEMPT}` ||
            !positiveInteger.test(state.recovery.artifact.id || "") ||
            !artifactDigest.test(state.recovery.artifact.digest || "") ||
            state.recovery.seal.candidateSha !== state.original.release ||
            !Number.isSafeInteger(state.recovery.seal.fileCount) || state.recovery.seal.fileCount < 1 ||
            !Number.isSafeInteger(state.recovery.seal.byteCount) || state.recovery.seal.byteCount < 1 ||
            !Number.isSafeInteger(state.recovery.seal.archiveBytes) || state.recovery.seal.archiveBytes < 1 ||
            !sha256.test(state.recovery.seal.treeSha256 || "") ||
            !sha256.test(state.recovery.seal.archiveSha256 || "") ||
            typeof state.recovery.seal.archiveFile !== "string" ||
            !/^[A-Za-z0-9._-]+\.tar$/.test(state.recovery.seal.archiveFile) ||
            state.runMarker !== `g12-staging-bridge-run-${process.env.TRIGGER_RUN_ID}-${process.env.TRIGGER_RUN_ATTEMPT}` ||
            state.compensationMarker !== `g12-staging-bridge-compensation-${process.env.TRIGGER_RUN_ID}-${process.env.TRIGGER_RUN_ATTEMPT}`
          ) throw new Error("G12_STAGING_BRIDGE_WATCHDOG_STATE_REFUSED");
          appendFileSync(process.env.GITHUB_OUTPUT, [
            "recovery_required=true",
            "clear_required=true",
            "state_absence=false",
            "artifact_present=true",
            `candidate_release=${state.candidateRelease}`,
            `original_release=${state.original.release}`,
            `original_deployment=${state.original.deploymentId}`,
            `original_created_on=${new Date(state.original.createdOn).toISOString()}`,
            `original_commit_message_b64=${Buffer.from(state.original.commitMessage, "utf8").toString("base64")}`,
            `run_marker=${state.runMarker}`,
            `compensation_marker=${state.compensationMarker}`,
            `state_path=${statePath}`,
          ].join("\n") + "\n");
          NODE
      - name: Reverify exact immutable recovery bytes before any watchdog mutation
        id: watchdog_recovery_bytes
        if: steps.watchdog_state.outputs.recovery_required == 'true'
        timeout-minutes: 10
        working-directory: control
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import {
            stagingBridgeRecoveryProvenanceModeForArchive,
            verifyStagingBridgeRecoveryOutputs,
          } from "./scripts/ev2/phase12/staging-bridge-recovery-artifact-lib.mjs";
          const state = JSON.parse(readFileSync("../state-artifact/staging-frontend-bridge-state.json", "utf8"));
          const seal = JSON.parse(readFileSync("../recovery/outputs/staging-baseline-dist-seal.json", "utf8"));
          const identity = {
            schemaVersion: seal.schemaVersion,
            candidateSha: seal.candidateSha,
            fileCount: seal.fileCount,
            byteCount: seal.byteCount,
            treeSha256: seal.treeSha256,
            archiveFile: seal.archiveFile,
            archiveBytes: seal.archiveBytes,
            archiveSha256: seal.archiveSha256,
          };
          if (JSON.stringify(state.recovery?.seal) !== JSON.stringify(identity) ||
              state.original?.release !== identity.candidateSha)
            throw new Error("G12_STAGING_BRIDGE_WATCHDOG_RECOVERY_BINDING_REFUSED");
          await verifyStagingBridgeRecoveryOutputs({
            outputsDirectory: "../recovery/outputs",
            expectedProvenanceMode: stagingBridgeRecoveryProvenanceModeForArchive(identity.archiveFile),
          });
          NODE
          node scripts/ev2/phase12/verify-production-dist-seal.mjs \
            --dist ../recovery/dist \
            --seal ../recovery/outputs/staging-baseline-dist-seal.json \
            --candidate "${{ steps.watchdog_state.outputs.original_release }}"
      - name: Record a proven pre-arm terminal outcome
        id: no_state_evidence
        if: steps.watchdog_state.outputs.recovery_required == 'false'
        working-directory: control
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATE_ABSENCE: ${{ steps.watchdog_state.outputs.state_absence }}
          CLEAR_REQUIRED: ${{ steps.watchdog_state.outputs.clear_required }}
          ARTIFACT_PRESENT: ${{ steps.watchdog_state.outputs.artifact_present }}
        run: |
          mkdir -p outputs
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const sha = /^[a-f0-9]{40}$/;
          if (!/^[1-9]\d*$/.test(process.env.TRIGGER_RUN_ID || "") ||
              !/^[1-9]\d*$/.test(process.env.TRIGGER_RUN_ATTEMPT || "") ||
              !sha.test(process.env.TRIGGER_HEAD_SHA || "") ||
              !process.env.TRIGGER_CONCLUSION || process.env.TRIGGER_CONCLUSION === "success" ||
              process.env.STATE_ABSENCE !== "confirmed" ||
              process.env.CLEAR_REQUIRED !== "false" ||
              !["true", "false"].includes(process.env.ARTIFACT_PRESENT))
            throw new Error("G12_STAGING_BRIDGE_WATCHDOG_NO_STATE_REFUSED");
          const report = {
            schemaVersion: 1,
            event: "g12.staging.frontend_bridge.watchdog",
            status: "no-state-no-mutation",
            workflow: {
              runId: process.env.TRIGGER_RUN_ID,
              runAttempt: Number(process.env.TRIGGER_RUN_ATTEMPT),
              controlSha: process.env.TRIGGER_HEAD_SHA,
              conclusion: process.env.TRIGGER_CONCLUSION,
            },
            recoveryStateConfirmedAbsent: true,
            recoveryStateClearRequired: false,
            recoveryArtifactAvailable: process.env.ARTIFACT_PRESENT === "true",
            remoteMutationPossibleByWorkflowOrder: false,
            secretsPersisted: false,
          };
          writeFileSync("outputs/staging-frontend-bridge-watchdog-no-state.json",
            JSON.stringify(report, null, 2) + "\n", { mode: 0o600, flag: "wx" });
          NODE
      - name: Verify baseline candidate and control ancestry
        if: >-
          steps.watchdog_state.outputs.recovery_required == 'true' &&
          steps.watchdog_recovery_bytes.outcome == 'success'
        working-directory: control
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${{ github.event.workflow_run.head_sha }}^{commit}"
          git cat-file -e "${{ steps.watchdog_state.outputs.original_release }}^{commit}"
          git cat-file -e "${{ steps.watchdog_state.outputs.candidate_release }}^{commit}"
          git merge-base --is-ancestor "${{ steps.watchdog_state.outputs.original_release }}" "${{ steps.watchdog_state.outputs.candidate_release }}"
          git merge-base --is-ancestor "${{ steps.watchdog_state.outputs.candidate_release }}" "${{ github.event.workflow_run.head_sha }}"
      - name: Install pinned recovery tooling
        if: >-
          steps.watchdog_state.outputs.recovery_required == 'true' &&
          steps.watchdog_recovery_bytes.outcome == 'success'
        working-directory: control
        run: npm ci --ignore-scripts
      - name: Recover any preview fixture owned by the incomplete run
        id: preview_fixture_recovery
        if: >-
          steps.watchdog_state.outputs.recovery_required == 'true' &&
          steps.watchdog_recovery_bytes.outcome == 'success'
        continue-on-error: true
        working-directory: control
        run: node scripts/qa/cms-public-bridge-fixture.mjs recover
        env:
          QA_CMS_BRIDGE_ENVIRONMENT: staging
          QA_CMS_BRIDGE_CANDIDATE_SHA: ${{ steps.watchdog_state.outputs.candidate_release }}
          QA_CMS_BRIDGE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          QA_CMS_BRIDGE_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QA_CMS_BRIDGE_INSTANCE: preview
          QA_CMS_BRIDGE_STATE_PATH: outputs/staging-bridge-preview-state.json
          QA_CMS_BRIDGE_REPORT_PATH: outputs/staging-bridge-preview-recovery.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Recover any canonical fixture owned by the incomplete run
        id: canonical_fixture_recovery
        if: >-
          steps.watchdog_state.outputs.recovery_required == 'true' &&
          steps.watchdog_recovery_bytes.outcome == 'success'
        continue-on-error: true
        working-directory: control
        run: node scripts/qa/cms-public-bridge-fixture.mjs recover
        env:
          QA_CMS_BRIDGE_ENVIRONMENT: staging
          QA_CMS_BRIDGE_CANDIDATE_SHA: ${{ steps.watchdog_state.outputs.candidate_release }}
          QA_CMS_BRIDGE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          QA_CMS_BRIDGE_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QA_CMS_BRIDGE_INSTANCE: canonical
          QA_CMS_BRIDGE_STATE_PATH: outputs/staging-bridge-canonical-state.json
          QA_CMS_BRIDGE_REPORT_PATH: outputs/staging-bridge-canonical-recovery.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Decide canonical staging compensation from a fresh read
        id: watchdog_decision
        if: >-
          steps.watchdog_state.outputs.recovery_required == 'true' &&
          steps.watchdog_recovery_bytes.outcome == 'success'
        continue-on-error: true
        working-directory: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          STAGING_ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.watchdog_state.outputs.original_created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.watchdog_state.outputs.original_commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.watchdog_state.outputs.candidate_release }}
          STAGING_RUN_MARKER: ${{ steps.watchdog_state.outputs.run_marker }}
          STAGING_COMPENSATION_MARKER: ${{ steps.watchdog_state.outputs.compensation_marker }}
        run: node scripts/ev2/phase12/staging-pages-state.mjs decide
      - name: Restore baseline only while the owned bridge remains canonical
        id: watchdog_compensation
        if: always() && steps.watchdog_decision.outputs.action == 'restore-original'
        continue-on-error: true
        working-directory: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          STAGING_ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.watchdog_state.outputs.original_created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.watchdog_state.outputs.original_commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.watchdog_state.outputs.candidate_release }}
          STAGING_RUN_MARKER: ${{ steps.watchdog_state.outputs.run_marker }}
          STAGING_COMPENSATION_MARKER: ${{ steps.watchdog_state.outputs.compensation_marker }}
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery/dist
          --seal ../recovery/outputs/staging-baseline-dist-seal.json
      - name: Recheck canonical state after reconciliation
        id: canonical_recheck
        if: >-
          always() && (steps.watchdog_decision.outputs.action == 'already-original' ||
          steps.watchdog_compensation.outcome == 'success')
        working-directory: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          STAGING_ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.watchdog_state.outputs.original_created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.watchdog_state.outputs.original_commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.watchdog_state.outputs.candidate_release }}
          STAGING_RUN_MARKER: ${{ steps.watchdog_state.outputs.run_marker }}
          STAGING_COMPENSATION_MARKER: ${{ steps.watchdog_state.outputs.compensation_marker }}
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-original
      - name: Probe the restored old-backend baseline
        id: watchdog_probe
        if: always() && steps.canonical_recheck.outcome == 'success'
        working-directory: control
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.watchdog_state.outputs.original_release }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_REPORT_PATH: outputs/staging-frontend-bridge-watchdog-probe.json
      - name: Persist terminal watchdog evidence
        id: watchdog_evidence
        if: >-
          always() && ((steps.watchdog_state.outputs.recovery_required == 'true' &&
          steps.watchdog_recovery_bytes.outcome == 'success' &&
          steps.preview_fixture_recovery.outcome == 'success' &&
          steps.canonical_fixture_recovery.outcome == 'success' &&
          steps.watchdog_probe.outcome == 'success') ||
          (steps.watchdog_state.outputs.recovery_required == 'false' &&
          steps.no_state_evidence.outcome == 'success'))
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-frontend-bridge-watchdog-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            control/outputs/staging-frontend-bridge-watchdog-no-state.json
            control/outputs/staging-bridge-preview-recovery.json
            control/outputs/staging-bridge-canonical-recovery.json
            control/outputs/staging-frontend-bridge-watchdog-probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Clear exact redundant state after proven recovery
        id: clear_state
        if: >-
          always() && steps.watchdog_state.outputs.clear_required == 'true' &&
          steps.watchdog_evidence.outcome == 'success'
        working-directory: control
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs clear --kind staging-deploy
          --file "${{ steps.watchdog_state.outputs.state_path }}"
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
      - name: Fail closed unless fixtures and canonical baseline are proven recovered
        if: >-
          always() && (steps.watchdog_state.outcome != 'success' ||
          (steps.watchdog_state.outputs.recovery_required == 'true' &&
            (steps.watchdog_recovery_bytes.outcome != 'success' ||
            steps.preview_fixture_recovery.outcome != 'success' ||
            steps.canonical_fixture_recovery.outcome != 'success' ||
            steps.watchdog_decision.outcome != 'success' ||
            steps.canonical_recheck.outcome != 'success' ||
            steps.watchdog_probe.outcome != 'success' ||
            steps.watchdog_evidence.outcome != 'success' ||
            (steps.watchdog_state.outputs.clear_required == 'true' &&
              steps.clear_state.outcome != 'success') ||
            (steps.watchdog_state.outputs.clear_required == 'false' &&
              steps.clear_state.outcome != 'skipped'))) ||
          (steps.watchdog_state.outputs.recovery_required == 'false' &&
            (steps.no_state_evidence.outcome != 'success' ||
            steps.watchdog_evidence.outcome != 'success' ||
            (steps.watchdog_state.outputs.clear_required == 'true' &&
              steps.clear_state.outcome != 'success') ||
            (steps.watchdog_state.outputs.clear_required == 'false' &&
              steps.clear_state.outcome != 'skipped'))) ||
          !contains(fromJSON('["true","false"]'), steps.watchdog_state.outputs.recovery_required))
        run: exit 1

  # An incomplete bridge can leave the temporary legacy public backend live on staging when the
  # runner itself is lost, which the in-run always() restore cannot cover. This job owns that case
  # and is deliberately independent of the frontend compensation job.
  restore-legacy-public-backend:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/promote-staging-frontend-bridge.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout the exact trusted bridge control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Read any legacy public backend lease left by the incomplete run
        id: legacy_state
        continue-on-error: true
        working-directory: control
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs get
          --allow-missing
          --kind staging-cms-public-legacy
          --file ../legacy-state/staging-cms-public-legacy-state.json
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
      - name: Resolve the candidate release recorded in the lease
        id: legacy_plan
        if: steps.legacy_state.outputs.state_present == 'true'
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const state = JSON.parse(readFileSync("legacy-state/staging-cms-public-legacy-state.json", "utf8"));
          if (state.event !== "g12.staging.cms_public_legacy.engaged")
            throw new Error("G12_STAGING_LEGACY_WATCHDOG_STATE_REFUSED");
          if (state.environment !== "staging" || state.projectRef !== "glcqsosxwgmlhzgcsnzv")
            throw new Error("G12_STAGING_LEGACY_WATCHDOG_TARGET_REFUSED");
          if (state.functionSlug !== "cms-public")
            throw new Error("G12_STAGING_LEGACY_WATCHDOG_TARGET_REFUSED");
          const candidate = state.candidate?.sha ?? "";
          const legacy = state.legacy?.sha ?? "";
          if (!/^[a-f0-9]{40}$/.test(candidate) || !/^[a-f0-9]{40}$/.test(legacy) || candidate === legacy)
            throw new Error("G12_STAGING_LEGACY_WATCHDOG_RELEASE_REFUSED");
          appendFileSync(process.env.GITHUB_OUTPUT, `candidate_sha=${candidate}\nlegacy_sha=${legacy}\n`);
          NODE
      - name: Checkout the exact candidate backend recorded in the lease
        if: steps.legacy_state.outputs.state_present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.legacy_plan.outputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        if: steps.legacy_state.outputs.state_present == 'true'
        with:
          version: 2.116.0
      - name: Bind the recovered lease to the candidate checkout
        if: steps.legacy_state.outputs.state_present == 'true'
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "${{ steps.legacy_plan.outputs.candidate_sha }}"
          mkdir -p candidate/outputs
          cp legacy-state/staging-cms-public-legacy-state.json \
            candidate/outputs/staging-cms-public-legacy-state.json
      - name: Restore the candidate public backend recorded in the lease
        id: legacy_restore
        if: steps.legacy_state.outputs.state_present == 'true'
        continue-on-error: true
        working-directory: candidate
        run: >-
          node scripts/qa/cms-public-legacy-bridge.mjs restore
          --candidate-source .
          --state outputs/staging-cms-public-legacy-state.json
          --report outputs/staging-cms-public-legacy-watchdog-restore.json
        env:
          QA_CMS_LEGACY_BRIDGE_ENVIRONMENT: staging
          QA_CMS_LEGACY_BRIDGE_CANDIDATE_SHA: ${{ steps.legacy_plan.outputs.candidate_sha }}
          QA_CMS_LEGACY_BRIDGE_LEGACY_SHA: ${{ steps.legacy_plan.outputs.legacy_sha }}
          QA_CMS_LEGACY_BRIDGE_RUN_ID: ${{ github.event.workflow_run.id }}
          QA_CMS_LEGACY_BRIDGE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QA_CMS_LEGACY_BRIDGE_CONTROL_SHA: ${{ github.event.workflow_run.head_sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Upload the watchdog restore evidence
        id: legacy_restore_evidence_upload
        if: always() && steps.legacy_restore.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-cms-public-legacy-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/outputs/staging-cms-public-legacy-watchdog-restore.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify the watchdog restore artifact identity
        id: legacy_restore_evidence_identity
        if: always() && steps.legacy_restore_evidence_upload.outcome == 'success'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ steps.legacy_restore_evidence_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.legacy_restore_evidence_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[a-f0-9]{64}$ ]]
      - name: Release the legacy backend lease only after a proven restore
        id: clear_legacy_state
        if: >-
          steps.legacy_restore.outcome == 'success' &&
          steps.legacy_restore_evidence_upload.outcome == 'success' &&
          steps.legacy_restore_evidence_identity.outcome == 'success'
        working-directory: control
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs clear
          --kind staging-cms-public-legacy
          --file ../legacy-state/staging-cms-public-legacy-state.json
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
      - name: Fail closed unless every held legacy lease was restored
        if: always()
        env:
          STATE_READ: ${{ steps.legacy_state.outcome }}
          STATE_PRESENT: ${{ steps.legacy_state.outputs.state_present }}
          RESTORE: ${{ steps.legacy_restore.outcome }}
          RESTORE_EVIDENCE: ${{ steps.legacy_restore_evidence_upload.outcome }}
          RESTORE_EVIDENCE_IDENTITY: ${{ steps.legacy_restore_evidence_identity.outcome }}
          CLEAR: ${{ steps.clear_legacy_state.outcome }}
        run: |
          set -euo pipefail
          if [ "$STATE_READ" != success ]; then
            echo "::error::The legacy public backend lease could not be read."
            exit 1
          fi
          if [ "$STATE_PRESENT" = true ]; then
            test "$RESTORE" = success
            test "$RESTORE_EVIDENCE" = success
            test "$RESTORE_EVIDENCE_IDENTITY" = success
            test "$CLEAR" = success
            exit 0
          fi
          test "$RESTORE" = skipped
          test "$RESTORE_EVIDENCE" = skipped
          test "$RESTORE_EVIDENCE_IDENTITY" = skipped
          test "$CLEAR" = skipped
