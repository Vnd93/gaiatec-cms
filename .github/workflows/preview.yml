name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:staging
        env:
          VITE_RELEASE: ${{ github.sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_EV2_DRAFT_V2_CANDIDATE: ${{ github.head_ref == 'ev2/desenvolvimento-fases-1-a-12' }}
      - run: npm run artifact:manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
      - if: env.CLOUDFLARE_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - if: env.CLOUDFLARE_CONFIGURED != 'true'
        run: |
          echo "::warning::Cloudflare credentials are not configured; the validated preview was preserved as a GitHub artifact."
          echo "## Preview remoto" >> "$GITHUB_STEP_SUMMARY"
          echo "Credenciais Cloudflare ausentes. O build validado foi preservado como artefato desta execução." >> "$GITHUB_STEP_SUMMARY"
      - if: env.CLOUDFLARE_CONFIGURED == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gaiatec-cms-staging --branch pr-${{ github.event.pull_request.number }}
      - if: env.CLOUDFLARE_CONFIGURED == 'true'
        run: npm run smoke:http -- "${{ steps.deploy.outputs.deployment-url }}"
      - if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview não indexável: ${{ steps.deploy.outputs.deployment-url }}\n\nArtefato: \`${{ github.sha }}\``
            })
