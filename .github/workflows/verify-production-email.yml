name: Verify production email provider

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: SHA completo do candidato contido em main
        required: true
      confirmation:
        description: Digite VERIFY-RESEND-PRODUCTION:<SHA>
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: production-email-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate production email dispatch authorization before any external request
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::Production email verification must be dispatched from main."
            exit 1
          fi
          if [ "${DISPATCH_ACTOR,,}" != "vnd93" ] || [ "${TRIGGERING_ACTOR,,}" != "vnd93" ]; then
            echo "::error::Production email verification is restricted to the approved operator."
            exit 1
          fi
          if ! [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [ "$CONFIRMATION" != "VERIFY-RESEND-PRODUCTION:$CANDIDATE_SHA" ]; then
            echo "::error::Production email verification confirmation is not bound to candidate_sha."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Bind verification checkout and workflow run to the exact candidate at main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(printf '%s' "$CANDIDATE_SHA" | grep -E '^[a-f0-9]{40}$')" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
      - name: Verify CI and protected controls for the exact email candidate
        run: node scripts/ev2/phase12/check-github-controls.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - name: Prove synthetic email delivery without customer data
        env:
          EMAIL_PROVIDER: resend
          EMAIL_SENDING_DOMAIN: gaiatecsistemas.com
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          LEAD_NOTIFICATION_TO: ${{ vars.LEAD_NOTIFICATION_TO }}
          EMAIL_SYNTHETIC_TO: ${{ vars.EMAIL_SYNTHETIC_TO }}
          PRODUCTION_SITE_ORIGIN: https://gaiatecsistemas.com.br
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EMAIL_EVIDENCE_PATH: production-email-evidence.json
        run: node scripts/ev2/phase16/verify-email-provider.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-email-evidence-${{ inputs.candidate_sha }}
          path: production-email-evidence.json
          if-no-files-found: error
          retention-days: 30
