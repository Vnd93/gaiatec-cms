name: Rollback production watchdog

on:
  workflow_run:
    workflows: ["Rollback production"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  compensate-incomplete-rollback:
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/rollback-production.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout the exact trusted rollback control revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: control
      - name: Download the mandatory pre-mutation state from the incomplete run
        id: watchdog_state_artifact
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-rollback-state-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: handoff
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Recover HMAC production rollback state after artifact failure
        id: watchdog_state_variable
        if: always() && steps.watchdog_state_artifact.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs get
          --kind production-rollback --file ../handoff/rollback-production-state.json
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
      - name: Validate incomplete-run handoff and expose immutable identities
        id: watchdog_state
        working-directory: control
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATE_ARTIFACT_OUTCOME: ${{ steps.watchdog_state_artifact.outcome }}
          STATE_VARIABLE_OUTCOME: ${{ steps.watchdog_state_variable.outcome }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { appendFileSync, readFileSync } = require("node:fs");
          const state = JSON.parse(readFileSync("../handoff/rollback-production-state.json", "utf8"));
          const digest = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
          const reject = (reason) => {
            throw new Error("G12_ROLLBACK_WATCHDOG_HANDOFF_REJECTED:" + reason);
          };
          if (process.env.STATE_ARTIFACT_OUTCOME !== "success" && process.env.STATE_VARIABLE_OUTCOME !== "success")
            reject("unavailable");
          if (state.schemaVersion !== 3 || state.event !== "g12.production.rollback.prepared")
            reject("schema");
          if (!["cancelled", "failure", "timed_out"].includes(process.env.TRIGGER_CONCLUSION))
            reject("conclusion");
          if (
            state.workflow?.runId !== process.env.TRIGGER_RUN_ID ||
            Number(state.workflow?.runAttempt) !== Number(process.env.TRIGGER_RUN_ATTEMPT) ||
            state.workflow?.controlSha !== process.env.TRIGGER_HEAD_SHA
          )
            reject("workflow");
          const uuid =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if (
            !uuid.test(state.original?.deploymentId || "") ||
            !uuid.test(state.target?.deploymentId || "") ||
            !/^[a-f0-9]{40}$/.test(state.original?.release || "") ||
            !/^[a-f0-9]{40}$/.test(state.target?.release || "") ||
            !/^[a-f0-9]{40}$/.test(state.retainedBackend?.release || "") ||
            !/^[1-9]\d*$/.test(state.retainedBackend?.runId || "")
          )
            reject("identity");
          const originalCreated = Date.parse(state.original?.createdOn);
          const targetCreated = Date.parse(state.target?.createdOn);
          if (
            !Number.isFinite(originalCreated) ||
            !Number.isFinite(targetCreated) ||
            targetCreated > originalCreated
          )
            reject("chronology");
          for (const field of ["manifestSha256", "functionsSha256", "databaseSha256"])
            if (!/^[a-f0-9]{64}$/.test(state.retainedBackend[field] || "")) reject(field + "-format");
          if (process.env.STATE_ARTIFACT_OUTCOME === "success")
            for (const [field, file] of [
              ["manifestSha256", "../handoff/backend-evidence/manifest.json"],
              ["functionsSha256", "../handoff/backend-evidence/functions.json"],
              ["databaseSha256", "../handoff/backend-evidence/database.json"],
            ]) if (state.retainedBackend[field] !== digest(file)) reject(field);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              "original_deployment=" + state.original.deploymentId,
              "original_release=" + state.original.release,
              "target_deployment=" + state.target.deploymentId,
              "target_release=" + state.target.release,
              "forward_backend_release=" + state.retainedBackend.release,
              "forward_backend_run_id=" + state.retainedBackend.runId,
              "manifest_sha256=" + state.retainedBackend.manifestSha256,
              "functions_sha256=" + state.retainedBackend.functionsSha256,
              "database_sha256=" + state.retainedBackend.databaseSha256,
            ].join("\n") + "\n",
          );
          NODE
          git cat-file -e "${{ github.event.workflow_run.head_sha }}^{commit}"
          target_release="$(node -p "require('../handoff/rollback-production-state.json').target.release")"
          original_release="$(node -p "require('../handoff/rollback-production-state.json').original.release")"
          forward_release="$(node -p "require('../handoff/rollback-production-state.json').retainedBackend.release")"
          git cat-file -e "$target_release^{commit}"
          git cat-file -e "$original_release^{commit}"
          git cat-file -e "$forward_release^{commit}"
          git merge-base --is-ancestor "$target_release" "$original_release"
          git merge-base --is-ancestor "$original_release" "$forward_release"
          git merge-base --is-ancestor "$forward_release" "${{ github.event.workflow_run.head_sha }}"
      - name: Materialize HMAC-bound backend evidence
        id: watchdog_materialize_backend_evidence
        timeout-minutes: 5
        continue-on-error: true
        working-directory: control
        run: >-
          node scripts/ev2/phase12/materialize-production-rollback-evidence.mjs
          --state ../handoff/rollback-production-state.json
          --output ../recovered-backend-evidence
      - name: Reconcile incomplete rollback without overwriting external production
        id: watchdog_reconcile
        timeout-minutes: 8
        continue-on-error: true
        working-directory: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-website
          CLOUDFLARE_DEPLOYMENT_ID: ${{ steps.watchdog_state.outputs.original_deployment }}
          CLOUDFLARE_EXPECTED_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          OWNED_TARGET_DEPLOYMENT: ${{ steps.watchdog_state.outputs.target_deployment }}
          OWNED_TARGET_RELEASE: ${{ steps.watchdog_state.outputs.target_release }}
        run: |
          set -euo pipefail
          recheck_file="$(mktemp)"
          GITHUB_OUTPUT="$recheck_file" timeout 3m node scripts/ev2/phase12/cloudflare-pages.mjs latest-production
          current_deployment="$(grep '^deployment_id=' "$recheck_file" | cut -d= -f2-)"
          current_release="$(grep '^release=' "$recheck_file" | cut -d= -f2-)"
          current_created_on="$(grep '^created_on=' "$recheck_file" | cut -d= -f2-)"
          current_commit_message_b64="$(grep '^commit_message_b64=' "$recheck_file" | cut -d= -f2-)"
          echo "observed_deployment=$current_deployment" >> "$GITHUB_OUTPUT"
          echo "observed_release=$current_release" >> "$GITHUB_OUTPUT"
          if [ "$current_deployment" = "$ORIGINAL_DEPLOYMENT" ] && [ "$current_release" = "$ORIGINAL_RELEASE" ]; then
            echo "action=already-original" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current_deployment" = "$OWNED_TARGET_DEPLOYMENT" ] && [ "$current_release" = "$OWNED_TARGET_RELEASE" ]; then
            echo "action=restore-original" >> "$GITHUB_OUTPUT"
            CLOUDFLARE_EXPECTED_CURRENT_DEPLOYMENT_ID="$current_deployment" \
            CLOUDFLARE_EXPECTED_CURRENT_RELEASE="$current_release" \
            CLOUDFLARE_EXPECTED_CURRENT_CREATED_ON="$current_created_on" \
            CLOUDFLARE_EXPECTED_CURRENT_COMMIT_MESSAGE_B64="$current_commit_message_b64" \
              timeout 4m node scripts/ev2/phase12/cloudflare-pages.mjs rollback
            exit 0
          fi
          echo "action=external-conflict" >> "$GITHUB_OUTPUT"
          echo "::error title=G12_PRODUCTION_ROLLBACK_EXTERNAL_DEPLOYMENT::watchdog refused to overwrite an external canonical deployment"
          exit 1
      - name: Retry an ambiguous watchdog compensation safely
        id: watchdog_reconcile_retry
        if: always() && steps.watchdog_reconcile.outcome == 'failure'
        timeout-minutes: 8
        continue-on-error: true
        working-directory: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-website
          CLOUDFLARE_DEPLOYMENT_ID: ${{ steps.watchdog_state.outputs.original_deployment }}
          CLOUDFLARE_EXPECTED_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          OWNED_TARGET_DEPLOYMENT: ${{ steps.watchdog_state.outputs.target_deployment }}
          OWNED_TARGET_RELEASE: ${{ steps.watchdog_state.outputs.target_release }}
        run: |
          set -euo pipefail
          recheck_file="$(mktemp)"
          GITHUB_OUTPUT="$recheck_file" timeout 3m node scripts/ev2/phase12/cloudflare-pages.mjs latest-production
          current_deployment="$(grep '^deployment_id=' "$recheck_file" | cut -d= -f2-)"
          current_release="$(grep '^release=' "$recheck_file" | cut -d= -f2-)"
          current_created_on="$(grep '^created_on=' "$recheck_file" | cut -d= -f2-)"
          current_commit_message_b64="$(grep '^commit_message_b64=' "$recheck_file" | cut -d= -f2-)"
          echo "observed_deployment=$current_deployment" >> "$GITHUB_OUTPUT"
          echo "observed_release=$current_release" >> "$GITHUB_OUTPUT"
          if [ "$current_deployment" = "$ORIGINAL_DEPLOYMENT" ] && [ "$current_release" = "$ORIGINAL_RELEASE" ]; then
            echo "action=confirmed-original" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current_deployment" = "$OWNED_TARGET_DEPLOYMENT" ] && [ "$current_release" = "$OWNED_TARGET_RELEASE" ]; then
            echo "action=retry-restore-original" >> "$GITHUB_OUTPUT"
            CLOUDFLARE_EXPECTED_CURRENT_DEPLOYMENT_ID="$current_deployment" \
            CLOUDFLARE_EXPECTED_CURRENT_RELEASE="$current_release" \
            CLOUDFLARE_EXPECTED_CURRENT_CREATED_ON="$current_created_on" \
            CLOUDFLARE_EXPECTED_CURRENT_COMMIT_MESSAGE_B64="$current_commit_message_b64" \
              timeout 4m node scripts/ev2/phase12/cloudflare-pages.mjs rollback
            exit 0
          fi
          echo "action=external-conflict" >> "$GITHUB_OUTPUT"
          echo "::error title=G12_PRODUCTION_ROLLBACK_EXTERNAL_DEPLOYMENT::watchdog retry preserved the external canonical deployment"
          exit 1
      - name: Checkout exact retained backend after watchdog reconciliation
        id: watchdog_backend_checkout
        if: always() && (steps.watchdog_reconcile.outcome == 'success' || steps.watchdog_reconcile_retry.outcome == 'success')
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.watchdog_state.outputs.forward_backend_release }}
          fetch-depth: 0
          path: backend
      - name: Install pinned Supabase CLI after watchdog reconciliation
        id: watchdog_supabase_cli
        if: always() && (steps.watchdog_reconcile.outcome == 'success' || steps.watchdog_reconcile_retry.outcome == 'success')
        timeout-minutes: 5
        continue-on-error: true
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Repeat immutable backend evidence after watchdog compensation
        id: watchdog_backend_evidence
        if: always() && (steps.watchdog_reconcile.outcome == 'success' || steps.watchdog_reconcile_retry.outcome == 'success')
        timeout-minutes: 10
        continue-on-error: true
        working-directory: backend
        env:
          FORWARD_BACKEND_RELEASE: ${{ steps.watchdog_state.outputs.forward_backend_release }}
          FORWARD_BACKEND_RUN_ID: ${{ steps.watchdog_state.outputs.forward_backend_run_id }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          timeout 4m supabase functions list --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF" --output json > ../g12-production-rollback-watchdog-functions.json
          timeout 2m node scripts/ev2/phase12/verify-production-functions.mjs --file ../g12-production-rollback-watchdog-functions.json
          timeout 4m node scripts/ev2/phase12/verify-production-database.mjs --source . | tee ../g12-production-rollback-watchdog-database.json
          timeout 4m node ../control/scripts/ev2/phase12/verify-production-backend-evidence.mjs \
            --source . \
            --manifest ../recovered-backend-evidence/manifest.json \
            --sealed-functions ../recovered-backend-evidence/functions.json \
            --sealed-database ../recovered-backend-evidence/database.json \
            --live-functions ../g12-production-rollback-watchdog-functions.json \
            | tee ../g12-production-rollback-watchdog-backend-evidence.json
      - name: Re-probe original frontend after watchdog compensation
        id: watchdog_frontend_probe
        if: always() && (steps.watchdog_reconcile.outcome == 'success' || steps.watchdog_reconcile_retry.outcome == 'success')
        timeout-minutes: 8
        continue-on-error: true
        working-directory: control
        run: timeout 7m node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://gaiatecsistemas.com.br
          EV2_G12_EXPECTED_SHA: ${{ steps.watchdog_state.outputs.original_release }}
          EV2_G12_ENVIRONMENT: production
          EV2_G12_PRODUCTION_AUTHORIZED: "true"
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_REPORT_PATH: ../g12-production-rollback-watchdog-probe.json
      - name: Re-probe boundaries after watchdog compensation
        id: watchdog_boundary_probe
        if: always() && (steps.watchdog_reconcile.outcome == 'success' || steps.watchdog_reconcile_retry.outcome == 'success')
        timeout-minutes: 5
        continue-on-error: true
        working-directory: backend
        run: timeout 4m node scripts/ev2/phase12/probe-supabase-boundary.mjs | tee ../g12-production-rollback-watchdog-boundary.json
        env:
          CMS_BACKEND_ENVIRONMENT: production
          CMS_BACKEND_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          CMS_BACKEND_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          CMS_BACKEND_ORIGIN: https://gaiatecsistemas.com.br
      - name: Seal non-sensitive watchdog compensation evidence
        id: watchdog_evidence
        if: always()
        continue-on-error: true
        working-directory: control
        env:
          ACTION: ${{ steps.watchdog_reconcile.outputs.action }}
          RETRY_ACTION: ${{ steps.watchdog_reconcile_retry.outputs.action }}
          RECONCILE_OUTCOME: ${{ steps.watchdog_reconcile.outcome }}
          RETRY_OUTCOME: ${{ steps.watchdog_reconcile_retry.outcome }}
          BACKEND_CHECKOUT_OUTCOME: ${{ steps.watchdog_backend_checkout.outcome }}
          SUPABASE_CLI_OUTCOME: ${{ steps.watchdog_supabase_cli.outcome }}
          BACKEND_OUTCOME: ${{ steps.watchdog_backend_evidence.outcome }}
          FRONTEND_OUTCOME: ${{ steps.watchdog_frontend_probe.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.watchdog_boundary_probe.outcome }}
          WATCHDOG_RUN_ID: ${{ github.run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const state = JSON.parse(readFileSync("../handoff/rollback-production-state.json", "utf8"));
          const payload = {
            schemaVersion: 1,
            event: "g12.production.rollback.incomplete.compensated",
            original: state.original,
            target: state.target,
            retainedBackend: state.retainedBackend,
            action: process.env.RETRY_ACTION || process.env.ACTION || null,
            outcomes: {
              reconcile: process.env.RECONCILE_OUTCOME,
              retry: process.env.RETRY_OUTCOME,
              backendCheckout: process.env.BACKEND_CHECKOUT_OUTCOME,
              supabaseCli: process.env.SUPABASE_CLI_OUTCOME,
              backendEvidence: process.env.BACKEND_OUTCOME,
              frontend: process.env.FRONTEND_OUTCOME,
              boundaries: process.env.BOUNDARY_OUTCOME,
            },
            workflow: {
              watchdogRunId: process.env.WATCHDOG_RUN_ID,
              incompleteRunId: process.env.TRIGGER_RUN_ID,
              incompleteRunAttempt: Number(process.env.TRIGGER_RUN_ATTEMPT),
              originalConclusion: process.env.TRIGGER_CONCLUSION,
            },
            recordedAt: new Date().toISOString(),
            sensitiveValuesLogged: false,
          };
          writeFileSync("../g12-production-rollback-watchdog-outcome.json", JSON.stringify(payload, null, 2) + "\n", {
            mode: 0o600,
          });
          NODE
      - name: Upload watchdog compensation evidence
        id: watchdog_evidence_upload
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-rollback-watchdog-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            g12-production-rollback-watchdog-*.json
            recovered-backend-evidence/database.json
            recovered-backend-evidence/functions.json
            recovered-backend-evidence/manifest.json
            handoff/rollback-production-state.json
          if-no-files-found: error
          retention-days: 90
      - name: Recheck canonical production immediately before watchdog gate
        id: watchdog_terminal_canonical
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        working-directory: control
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 1m node scripts/ev2/phase12/cloudflare-pages.mjs latest-production; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] || sleep 5
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-website
      - name: Compare and clear production rollback recovery state
        id: clear_recovery_state
        if: >-
          always() && steps.watchdog_materialize_backend_evidence.outcome == 'success' &&
          steps.watchdog_backend_evidence.outcome == 'success' &&
          steps.watchdog_frontend_probe.outcome == 'success' &&
          steps.watchdog_boundary_probe.outcome == 'success' &&
          steps.watchdog_evidence_upload.outcome == 'success' &&
          steps.watchdog_terminal_canonical.outcome == 'success' &&
          steps.watchdog_terminal_canonical.outputs.deployment_id == steps.watchdog_state.outputs.original_deployment &&
          steps.watchdog_terminal_canonical.outputs.release == steps.watchdog_state.outputs.original_release
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs clear
          --kind production-rollback --file ../handoff/rollback-production-state.json
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
      - name: Enforce incomplete rollback compensation
        if: always()
        working-directory: control
        env:
          RECONCILE_OUTCOME: ${{ steps.watchdog_reconcile.outcome }}
          RETRY_OUTCOME: ${{ steps.watchdog_reconcile_retry.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.watchdog_materialize_backend_evidence.outcome }}
          BACKEND_CHECKOUT_OUTCOME: ${{ steps.watchdog_backend_checkout.outcome }}
          SUPABASE_CLI_OUTCOME: ${{ steps.watchdog_supabase_cli.outcome }}
          BACKEND_OUTCOME: ${{ steps.watchdog_backend_evidence.outcome }}
          FRONTEND_OUTCOME: ${{ steps.watchdog_frontend_probe.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.watchdog_boundary_probe.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.watchdog_evidence.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.watchdog_evidence_upload.outcome }}
          TERMINAL_CANONICAL_OUTCOME: ${{ steps.watchdog_terminal_canonical.outcome }}
          TERMINAL_DEPLOYMENT: ${{ steps.watchdog_terminal_canonical.outputs.deployment_id }}
          TERMINAL_RELEASE: ${{ steps.watchdog_terminal_canonical.outputs.release }}
          ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          FORWARD_BACKEND_RELEASE: ${{ steps.watchdog_state.outputs.forward_backend_release }}
          FORWARD_BACKEND_RUN_ID: ${{ steps.watchdog_state.outputs.forward_backend_run_id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.watchdog_state.outputs.manifest_sha256 }}
          EXPECTED_FUNCTIONS_SHA256: ${{ steps.watchdog_state.outputs.functions_sha256 }}
          EXPECTED_DATABASE_SHA256: ${{ steps.watchdog_state.outputs.database_sha256 }}
          CLEAR_RECOVERY_STATE_OUTCOME: ${{ steps.clear_recovery_state.outcome }}
        run: |
          set -euo pipefail
          state_release="$(node -p "require('../handoff/rollback-production-state.json').retainedBackend.release")"
          state_run_id="$(node -p "require('../handoff/rollback-production-state.json').retainedBackend.runId")"
          test "$state_release" = "$FORWARD_BACKEND_RELEASE"
          test "$state_run_id" = "$FORWARD_BACKEND_RUN_ID"
          test "$MATERIALIZE_OUTCOME" = success
          test "$(sha256sum ../recovered-backend-evidence/manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum ../recovered-backend-evidence/functions.json | cut -d' ' -f1)" = "$EXPECTED_FUNCTIONS_SHA256"
          test "$(sha256sum ../recovered-backend-evidence/database.json | cut -d' ' -f1)" = "$EXPECTED_DATABASE_SHA256"
          if [ "$RECONCILE_OUTCOME" != success ]; then
            test "$RETRY_OUTCOME" = success
          fi
          test "$BACKEND_CHECKOUT_OUTCOME" = success
          test "$SUPABASE_CLI_OUTCOME" = success
          test "$BACKEND_OUTCOME" = success
          test "$FRONTEND_OUTCOME" = success
          test "$BOUNDARY_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
          test "$EVIDENCE_UPLOAD_OUTCOME" = success
          test "$TERMINAL_CANONICAL_OUTCOME" = success
          test "$TERMINAL_DEPLOYMENT" = "$ORIGINAL_DEPLOYMENT"
          test "$TERMINAL_RELEASE" = "$ORIGINAL_RELEASE"
          test "$CLEAR_RECOVERY_STATE_OUTCOME" = success
          echo "G12 incomplete production rollback was safely compensated and revalidated."
