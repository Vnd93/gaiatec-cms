name: CI

on:
  # Contingencia sem consumo automatico de GitHub-hosted runners.
  # A validacao obrigatoria do desenvolvimento roda com `npm run validate:local`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run test:phase1
      - run: npm run test:phase3
      - run: npm audit --audit-level=high
      - run: npm run build:staging
        env:
          VITE_RELEASE: ${{ github.sha }}
      - run: npm run artifact:manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local --no-seed
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:staging
        env:
          VITE_RELEASE: ${{ github.sha }}
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 14
