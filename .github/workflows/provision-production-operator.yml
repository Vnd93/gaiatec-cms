name: Provision production CMS operator

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: SHA completo que esta ativo em producao e foi aprovado no G12
        required: true
      approval_record:
        description: Caminho .github/release-controls/approvals/G12_<sha>.json em main
        required: true
      change_reference:
        description: Identificador da mudanca aprovado no G12
        required: true
      confirmation:
        description: Digite AUTORIZO-RENOVAR-OPERADOR-CMS:<SHA>:<DIAS>-DIAS
        required: true
      validity_days:
        description: Validade individual EV2, renovavel e auditada (maximo de 365 dias)
        required: true
        type: choice
        default: "365"
        options:
          - "30"
          - "90"
          - "180"
          - "365"

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Validate exact production authorization before secrets are available
        id: dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRODUCTION_AUTHORIZATION: ${{ inputs.confirmation }}
          VALIDITY_DAYS: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "${DISPATCH_ACTOR,,}" = vnd93
          test "${TRIGGERING_ACTOR,,}" = vnd93
          test "$(printf '%s' "$CANDIDATE_SHA" | grep -E '^[a-f0-9]{40}$')" = "$CANDIDATE_SHA"
          case "$VALIDITY_DAYS" in 30|90|180|365) ;; *) exit 1 ;; esac
          test "$PRODUCTION_AUTHORIZATION" = "AUTORIZO-RENOVAR-OPERADOR-CMS:$CANDIDATE_SHA:$VALIDITY_DAYS-DIAS"
          echo "window_minutes=$((VALIDITY_DAYS * 1440))" >> "$GITHUB_OUTPUT"
      - name: Checkout release controls from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: control
      - name: Checkout exact production candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Verify main, candidate and provisioning control bytes
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          git -C control fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git -C control rev-parse HEAD)" = "$(git -C control rev-parse origin/main)"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C control merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git -C control diff --quiet "$CANDIDATE_SHA" HEAD -- \
            .github/workflows/provision-production-operator.yml \
            scripts/ev2/phase12/provision-production-operator.mjs \
            scripts/ev2/phase12/production-operator-identity-lib.mjs \
            supabase/migrations/0077_cms_production_operator_provisioning.sql \
            supabase/tests/rls_cms_production_operator_provisioning.test.sql \
            tests/contracts/cms-production-operator-provisioning.test.ts
      - name: Verify protected GitHub controls for the exact candidate
        working-directory: control
        run: node scripts/ev2/phase12/check-github-controls.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - name: Verify CI and protected controls for the current provisioning control commit
        working-directory: control
        run: node scripts/ev2/phase12/check-github-controls.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
      - name: Verify immutable G12 approval
        id: approval
        working-directory: control
        env:
          APPROVAL_RECORD: ${{ inputs.approval_record }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
        run: >-
          node scripts/ev2/phase12/verify-approval.mjs --file "$APPROVAL_RECORD"
          --candidate "$CANDIDATE_SHA" --environment production --change-reference "$CHANGE_REFERENCE"
      - name: Verify that production is serving the exact healthy candidate
        working-directory: control
        env:
          EV2_G12_ORIGIN: https://gaiatecsistemas.com.br
          EV2_G12_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EV2_G12_ENVIRONMENT: production
          EV2_G12_PRODUCTION_AUTHORIZED: "true"
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "5"
          EV2_G12_REPORT_PATH: ${{ runner.temp }}/production-operator-health.json
        run: node scripts/ev2/phase12/rollout-probe.mjs
      - name: Provision the confirmed MFA operator without exposing identity
        working-directory: control
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          G12_APPROVAL_RECORD_SHA256: ${{ steps.approval.outputs.approval_record_sha256 }}
          G12_PRODUCTION_AUTHORIZATION: ${{ inputs.confirmation }}
          PRODUCTION_OPERATOR_WINDOW_MINUTES: ${{ steps.dispatch.outputs.window_minutes }}
          PRODUCTION_OPERATOR_REQUEST_ID: ${{ github.run_id }}
          PRODUCTION_OPERATOR_EMAIL: ${{ secrets.PRODUCTION_OPERATOR_EMAIL }}
          PRODUCTION_AUTH_CANARY_EMAIL: ${{ secrets.PRODUCTION_AUTH_CANARY_EMAIL }}
          PRODUCTION_AUTH_CANARY_EMAIL_DOMAIN: ${{ vars.PRODUCTION_AUTH_CANARY_EMAIL_DOMAIN }}
          PRODUCTION_OPERATOR_REPORT_PATH: ${{ runner.temp }}/production-operator-provisioning.json
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ev2/phase12/provision-production-operator.mjs
      - name: Upload PII-free immutable provisioning evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-operator-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-operator-health.json
            ${{ runner.temp }}/production-operator-provisioning.json
          if-no-files-found: error
          retention-days: 90
