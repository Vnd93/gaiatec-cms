name: Rollback staging watchdog

on:
  workflow_run:
    workflows: ["Rollback staging"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-recovery-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  compensate-incomplete-staging-rollback:
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/rollback-staging.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    steps:
      - name: Checkout exact trusted rollback control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Recover HMAC state independently of the artifact service
        id: variable_state
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs get
          --kind staging-rollback --file ../variable-state/rollback-staging-state.json
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
          --allow-missing
      - name: Validate interrupted rollback state and immutable ancestry
        id: watchdog_state
        if: >-
          steps.variable_state.outcome == 'success' &&
          steps.variable_state.outputs.state_present == 'true'
        working-directory: control
        env:
          VARIABLE_OUTCOME: ${{ steps.variable_state.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require("node:fs");
          const path = "../variable-state/rollback-staging-state.json";
          if (process.env.VARIABLE_OUTCOME !== "success" || !existsSync(path))
            throw new Error("G12_STAGING_ROLLBACK_WATCHDOG_STATE_MISSING");
          const state = JSON.parse(readFileSync(path, "utf8"));
          const sha = /^[a-f0-9]{40}$/;
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const digest = /^sha256:[a-f0-9]{64}$/;
          if (
            !["cancelled", "failure", "timed_out"].includes(process.env.TRIGGER_CONCLUSION) ||
            state.schemaVersion !== 1 || state.event !== "g12.staging.rollback.prepared" ||
            state.workflow?.runId !== process.env.TRIGGER_RUN_ID ||
            Number(state.workflow?.runAttempt) !== Number(process.env.TRIGGER_RUN_ATTEMPT) ||
            state.workflow?.controlSha !== process.env.TRIGGER_HEAD_SHA ||
            state.project !== "gaiatec-cms-staging" || state.branch !== "ev2-g17-canary" ||
            !uuid.test(state.original?.deploymentId || "") || !sha.test(state.original?.release || "") ||
            !Number.isFinite(Date.parse(state.original?.createdOn || "")) ||
            typeof state.original?.commitMessage !== "string" || state.original.commitMessage.includes("\0") ||
            Buffer.byteLength(state.original.commitMessage, "utf8") > 4096 ||
            Buffer.from(state.original.commitMessage, "utf8").toString("utf8") !== state.original.commitMessage ||
            !sha.test(state.target?.release || "") || !sha.test(state.retainedBackend?.release || "") ||
            !/^[1-9]\d*$/.test(state.target?.artifact?.id || "") || !digest.test(state.target?.artifact?.digest || "") ||
            state.runMarker !== `g12-staging-rollback-${process.env.TRIGGER_RUN_ID}-${process.env.TRIGGER_RUN_ATTEMPT}` ||
            state.compensationMarker !== `g12-staging-rollback-compensation-${process.env.TRIGGER_RUN_ID}-${process.env.TRIGGER_RUN_ATTEMPT}`
          ) throw new Error("G12_STAGING_ROLLBACK_WATCHDOG_STATE_REFUSED");
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `state_path=${path}`,
            `original_deployment=${state.original.deploymentId}`,
            `original_release=${state.original.release}`,
            `original_created_on=${new Date(state.original.createdOn).toISOString()}`,
            `original_commit_message_b64=${Buffer.from(state.original.commitMessage, "utf8").toString("base64")}`,
            `target_release=${state.target.release}`,
            `backend_release=${state.retainedBackend.release}`,
            `run_marker=${state.runMarker}`,
            `compensation_marker=${state.compensationMarker}`,
          ].join("\n") + "\n");
          NODE
          test "$VARIABLE_OUTCOME" = success
          state_file=../variable-state/rollback-staging-state.json
          original_release="$(node -p "require('$state_file').original.release")"
          target_release="$(node -p "require('$state_file').target.release")"
          backend_release="$(node -p "require('$state_file').retainedBackend.release")"
          git cat-file -e "$original_release^{commit}"
          git cat-file -e "$target_release^{commit}"
          git cat-file -e "$backend_release^{commit}"
          git merge-base --is-ancestor "$original_release" "$backend_release"
          git merge-base --is-ancestor "$target_release" "$backend_release"
          git merge-base --is-ancestor "$backend_release" "${{ github.event.workflow_run.head_sha }}"
      - name: Install exact locked Wrangler for watchdog recovery
        if: steps.watchdog_state.outcome == 'success'
        timeout-minutes: 10
        working-directory: control
        run: npm ci --ignore-scripts
      - name: Reconcile interrupted rollback without overwriting external staging
        id: watchdog_decision
        if: always() && steps.watchdog_state.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        working-directory: control
        env: &staging_rollback_watchdog_environment
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          STAGING_ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.watchdog_state.outputs.original_created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.watchdog_state.outputs.original_commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.watchdog_state.outputs.target_release }}
          STAGING_RUN_MARKER: ${{ steps.watchdog_state.outputs.run_marker }}
          STAGING_COMPENSATION_MARKER: ${{ steps.watchdog_state.outputs.compensation_marker }}
        run: node scripts/ev2/phase12/staging-pages-state.mjs decide
      - name: Checkout the exact retained backend for read-only verification
        id: watchdog_backend_checkout
        if: >-
          always() && steps.watchdog_state.outcome == 'success' &&
          steps.watchdog_decision.outcome == 'success' &&
          (steps.watchdog_decision.outputs.action == 'already-original' ||
          steps.watchdog_decision.outputs.action == 'restore-original')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.watchdog_state.outputs.backend_release }}
          fetch-depth: 0
          path: backend-verification
      - name: Install pinned Supabase CLI for retained-backend read-only verification
        id: watchdog_supabase_cli
        if: always() && steps.watchdog_backend_checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Verify the retained staging backend without mutation
        id: watchdog_backend_verification
        if: always() && steps.watchdog_supabase_cli.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: backend-verification
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = "glcqsosxwgmlhzgcsnzv"
          test "$(git rev-parse HEAD)" = "${{ steps.watchdog_state.outputs.backend_release }}"
          mkdir -p "$RUNNER_TEMP/g12-staging-rollback-watchdog-evidence"
          supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF" --output json > \
            "$RUNNER_TEMP/g12-staging-rollback-watchdog-evidence/g12-staging-rollback-functions-watchdog.json"
          node scripts/ev2/phase12/verify-production-functions.mjs \
            --file "$RUNNER_TEMP/g12-staging-rollback-watchdog-evidence/g12-staging-rollback-functions-watchdog.json" \
            --environment staging --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            | tee "$RUNNER_TEMP/g12-staging-rollback-watchdog-evidence/g12-staging-rollback-functions-verification-watchdog.json"
          node scripts/ev2/phase12/verify-staging-database.mjs --source . |
            tee "$RUNNER_TEMP/g12-staging-rollback-watchdog-evidence/g12-staging-rollback-database-watchdog.json"
      - name: Download sealed original recovery bytes when available
        id: recovery_artifact
        if: always() && steps.watchdog_decision.outputs.action == 'restore-original'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-rollback-recovery-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          digest-mismatch: error
          path: recovery-artifact
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify downloaded recovery seal against HMAC state
        id: recovery_artifact_seal
        if: always() && steps.recovery_artifact.outcome == 'success'
        continue-on-error: true
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-staging-recovery-seal.mjs
          --state "${{ steps.watchdog_state.outputs.state_path }}"
          --seal ../recovery-artifact/outputs/staging-rollback-recovery-dist-seal.json
          --role recovery
      - name: Compensate only the owned rollback target
        id: watchdog_compensation
        if: >-
          always() && steps.watchdog_decision.outputs.action == 'restore-original' &&
          steps.watchdog_backend_verification.outcome == 'success' &&
          steps.recovery_artifact.outcome == 'success' &&
          steps.recovery_artifact_seal.outcome == 'success'
        timeout-minutes: 20
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_watchdog_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery-artifact/dist
          --seal ../recovery-artifact/outputs/staging-rollback-recovery-dist-seal.json
      - name: Retry ambiguous watchdog compensation safely
        id: watchdog_compensation_retry
        if: >-
          always() && steps.watchdog_decision.outputs.action == 'restore-original' &&
          steps.watchdog_backend_verification.outcome == 'success' &&
          steps.recovery_artifact.outcome == 'success' &&
          steps.recovery_artifact_seal.outcome == 'success' &&
          steps.watchdog_compensation.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_watchdog_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery-artifact/dist
          --seal ../recovery-artifact/outputs/staging-rollback-recovery-dist-seal.json
      - name: Terminal canonical recheck after rollback watchdog reconciliation
        id: watchdog_terminal_canonical
        if: >-
          always() && steps.watchdog_backend_verification.outcome == 'success' &&
          (steps.watchdog_decision.outputs.action == 'already-original' ||
          steps.watchdog_compensation.outcome == 'success' ||
          steps.watchdog_compensation_retry.outcome == 'success')
        timeout-minutes: 3
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_watchdog_environment
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-original
      - name: Prove original staging after watchdog reconciliation
        id: watchdog_probe
        if: >-
          always() && steps.watchdog_decision.outcome == 'success' &&
          steps.watchdog_backend_checkout.outcome == 'success' &&
          steps.watchdog_supabase_cli.outcome == 'success' &&
          steps.watchdog_backend_verification.outcome == 'success' &&
          steps.watchdog_terminal_canonical.outcome == 'success' &&
          (steps.watchdog_decision.outputs.action == 'already-original' ||
          steps.watchdog_compensation.outcome == 'success' ||
          steps.watchdog_compensation_retry.outcome == 'success')
        timeout-minutes: 10
        continue-on-error: true
        working-directory: control
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.watchdog_state.outputs.original_release }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-rollback-watchdog-probe.json
      - name: Seal non-sensitive watchdog evidence
        id: watchdog_evidence
        if: always() && steps.watchdog_state.outcome == 'success'
        continue-on-error: true
        working-directory: control
        env:
          DECISION_OUTCOME: ${{ steps.watchdog_decision.outcome }}
          DECISION_ACTION: ${{ steps.watchdog_decision.outputs.action }}
          BACKEND_CHECKOUT_OUTCOME: ${{ steps.watchdog_backend_checkout.outcome }}
          SUPABASE_CLI_OUTCOME: ${{ steps.watchdog_supabase_cli.outcome }}
          BACKEND_VERIFICATION_OUTCOME: ${{ steps.watchdog_backend_verification.outcome }}
          RECOVERY_ARTIFACT_OUTCOME: ${{ steps.recovery_artifact.outcome }}
          RECOVERY_SEAL_OUTCOME: ${{ steps.recovery_artifact_seal.outcome }}
          COMPENSATION_OUTCOME: ${{ steps.watchdog_compensation.outcome }}
          COMPENSATION_RETRY_OUTCOME: ${{ steps.watchdog_compensation_retry.outcome }}
          TERMINAL_CANONICAL_OUTCOME: ${{ steps.watchdog_terminal_canonical.outcome }}
          PROBE_OUTCOME: ${{ steps.watchdog_probe.outcome }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const state = JSON.parse(readFileSync("${{ steps.watchdog_state.outputs.state_path }}", "utf8"));
          writeFileSync("../g12-staging-rollback-watchdog-evidence.json", JSON.stringify({
            schemaVersion: 1, event: "g12.staging.rollback.incomplete.reconciled",
             workflow: state.workflow, original: state.original, target: state.target,
             retainedBackend: state.retainedBackend,
             outcomes: { decision: process.env.DECISION_OUTCOME, action: process.env.DECISION_ACTION || null,
               backendCheckout: process.env.BACKEND_CHECKOUT_OUTCOME,
               supabaseCli: process.env.SUPABASE_CLI_OUTCOME,
               backendVerification: process.env.BACKEND_VERIFICATION_OUTCOME,
               recoveryArtifact: process.env.RECOVERY_ARTIFACT_OUTCOME,
               recoverySeal: process.env.RECOVERY_SEAL_OUTCOME,
              compensation: process.env.COMPENSATION_OUTCOME, compensationRetry: process.env.COMPENSATION_RETRY_OUTCOME,
              terminalCanonical: process.env.TERMINAL_CANONICAL_OUTCOME,
              probe: process.env.PROBE_OUTCOME }, recordedAt: new Date().toISOString(), sensitiveValuesLogged: false,
           }, null, 2) + "\n", { mode: 0o600 });
           NODE
      - name: Record confirmed no-state watchdog evidence without mutation
        id: rollback_no_state_evidence
        if: >-
          always() && steps.variable_state.outcome == 'success' &&
          steps.variable_state.outputs.state_present == 'false'
        working-directory: control
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          writeFileSync("../g12-staging-rollback-watchdog-evidence.json", JSON.stringify({
            schemaVersion: 1,
            event: "g12.staging.rollback.incomplete.no-state",
            workflow: {
              runId: process.env.TRIGGER_RUN_ID,
              runAttempt: Number(process.env.TRIGGER_RUN_ATTEMPT),
              controlSha: process.env.TRIGGER_HEAD_SHA,
              conclusion: process.env.TRIGGER_CONCLUSION,
            },
            stateAbsent: true,
            recoveryAttempted: false,
            mutationsAttempted: false,
            recordedAt: new Date().toISOString(),
            sensitiveValuesLogged: false,
          }, null, 2) + "\n", { mode: 0o600 });
          NODE
      - name: Upload mandatory watchdog rollback evidence
        id: watchdog_evidence_upload
        if: >-
          always() && (steps.watchdog_evidence.outcome == 'success' ||
          steps.rollback_no_state_evidence.outcome == 'success')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-rollback-watchdog-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            g12-staging-rollback-watchdog-evidence.json
            g12-staging-rollback-watchdog-probe.json
            ${{ runner.temp }}/g12-staging-rollback-watchdog-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Compare and clear HMAC state after terminal recovery evidence
        id: clear_recovery_state
        if: >-
          always() && steps.watchdog_state.outcome == 'success' &&
          steps.watchdog_decision.outcome == 'success' &&
          steps.watchdog_backend_checkout.outcome == 'success' &&
          steps.watchdog_supabase_cli.outcome == 'success' &&
          steps.watchdog_backend_verification.outcome == 'success' &&
          steps.watchdog_terminal_canonical.outcome == 'success' &&
          steps.watchdog_probe.outcome == 'success' &&
          steps.watchdog_evidence.outcome == 'success' &&
          steps.watchdog_evidence_upload.outcome == 'success' &&
          (steps.watchdog_decision.outputs.action != 'restore-original' ||
          (steps.recovery_artifact.outcome == 'success' &&
          steps.recovery_artifact_seal.outcome == 'success' &&
          (steps.watchdog_compensation.outcome == 'success' ||
          steps.watchdog_compensation_retry.outcome == 'success')))
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs clear
          --kind staging-rollback --file "${{ steps.watchdog_state.outputs.state_path }}"
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
      - name: Enforce interrupted rollback terminal recovery
        if: always()
        env:
          VARIABLE_OUTCOME: ${{ steps.variable_state.outcome }}
          STATE_PRESENT: ${{ steps.variable_state.outputs.state_present }}
          STATE_VALIDATION_OUTCOME: ${{ steps.watchdog_state.outcome }}
          NO_STATE_EVIDENCE_OUTCOME: ${{ steps.rollback_no_state_evidence.outcome }}
          DECISION_OUTCOME: ${{ steps.watchdog_decision.outcome }}
          DECISION_ACTION: ${{ steps.watchdog_decision.outputs.action }}
          BACKEND_CHECKOUT_OUTCOME: ${{ steps.watchdog_backend_checkout.outcome }}
          SUPABASE_CLI_OUTCOME: ${{ steps.watchdog_supabase_cli.outcome }}
          BACKEND_VERIFICATION_OUTCOME: ${{ steps.watchdog_backend_verification.outcome }}
          RECOVERY_ARTIFACT_OUTCOME: ${{ steps.recovery_artifact.outcome }}
          RECOVERY_SEAL_OUTCOME: ${{ steps.recovery_artifact_seal.outcome }}
          COMPENSATION_OUTCOME: ${{ steps.watchdog_compensation.outcome }}
          COMPENSATION_RETRY_OUTCOME: ${{ steps.watchdog_compensation_retry.outcome }}
          TERMINAL_CANONICAL_OUTCOME: ${{ steps.watchdog_terminal_canonical.outcome }}
          PROBE_OUTCOME: ${{ steps.watchdog_probe.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.watchdog_evidence.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.watchdog_evidence_upload.outcome }}
          CLEAR_OUTCOME: ${{ steps.clear_recovery_state.outcome }}
        run: |
          set -euo pipefail
          test "$VARIABLE_OUTCOME" = success
          if [ "$STATE_PRESENT" = false ]; then
            test "$STATE_VALIDATION_OUTCOME" = skipped
            test "$NO_STATE_EVIDENCE_OUTCOME" = success
            test "$DECISION_OUTCOME" = skipped
            test "$BACKEND_CHECKOUT_OUTCOME" = skipped
            test "$SUPABASE_CLI_OUTCOME" = skipped
            test "$BACKEND_VERIFICATION_OUTCOME" = skipped
            test "$RECOVERY_ARTIFACT_OUTCOME" = skipped
            test "$RECOVERY_SEAL_OUTCOME" = skipped
            test "$COMPENSATION_OUTCOME" = skipped
            test "$COMPENSATION_RETRY_OUTCOME" = skipped
            test "$TERMINAL_CANONICAL_OUTCOME" = skipped
            test "$PROBE_OUTCOME" = skipped
            test "$EVIDENCE_OUTCOME" = skipped
            test "$EVIDENCE_UPLOAD_OUTCOME" = success
            test "$CLEAR_OUTCOME" = skipped
            exit 0
          fi
          test "$STATE_PRESENT" = true
          test "$STATE_VALIDATION_OUTCOME" = success
          test "$NO_STATE_EVIDENCE_OUTCOME" = skipped
          test "$DECISION_OUTCOME" = success
          test "$DECISION_ACTION" = already-original -o "$DECISION_ACTION" = restore-original
          test "$BACKEND_CHECKOUT_OUTCOME" = success
          test "$SUPABASE_CLI_OUTCOME" = success
          test "$BACKEND_VERIFICATION_OUTCOME" = success
          if [ "$DECISION_ACTION" = restore-original ]; then
            test "$RECOVERY_ARTIFACT_OUTCOME" = success
            test "$RECOVERY_SEAL_OUTCOME" = success
            test "$COMPENSATION_OUTCOME" = success -o "$COMPENSATION_RETRY_OUTCOME" = success
          else
            test "$RECOVERY_ARTIFACT_OUTCOME" = skipped
            test "$RECOVERY_SEAL_OUTCOME" = skipped
          fi
          test "$TERMINAL_CANONICAL_OUTCOME" = success
          test "$PROBE_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
          test "$EVIDENCE_UPLOAD_OUTCOME" = success
          test "$CLEAR_OUTCOME" = success
