name: EV2.16 CSP Canary

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA completo e exato do candidato CSP
        required: true
      confirmation:
        description: Digite CANARY-CSP-G16-STAGING
        required: true

permissions:
  contents: read

concurrency:
  group: ev2-g16-csp-canary
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.ref_name == 'ev2/fase-16-prontidao-producao-g12' &&
      inputs.confirmation == 'CANARY-CSP-G16-STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      CANARY_DEPLOY_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.STAGING_SUPABASE_URL != '' && secrets.STAGING_SUPABASE_ANON_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Validate immutable candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(printf '%s' "$EXPECTED_SHA" | grep -E '^[a-f0-9]{40}$')" = "$EXPECTED_SHA"
          git fetch origin refs/heads/ev2/fase-16-prontidao-producao-g12:refs/remotes/origin/ev2/fase-16-prontidao-producao-g12 --no-tags
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/ev2/fase-16-prontidao-producao-g12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Build isolated staging candidate
        run: npm run build:staging
        env:
          VITE_RELEASE: ${{ inputs.expected_sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - run: npm run artifact:manifest
        env:
          GITHUB_SHA: ${{ inputs.expected_sha }}
      - if: env.CANARY_DEPLOY_CONFIGURED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ev2-g16-csp-candidate-${{ inputs.expected_sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist --project-name gaiatec-cms-staging --branch ev2-g16-csp-canary
            --commit-hash ${{ inputs.expected_sha }} --commit-dirty=false
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        name: Stabilize the isolated edge before measurement
        env:
          CANARY_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for attempt in 1 2; do
            for route in / /produtos /contato /admin/login; do
              curl --fail --silent --show-error --max-time 10 "${CANARY_ORIGIN}${route}" >/dev/null
            done
          done
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        run: npm run probe:ev2:phase12
        env:
          EV2_G12_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
          EV2_G12_EXPECTED_SHA: ${{ inputs.expected_sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_CSP_MODE: enforce
          EV2_G12_SAMPLE_COUNT: "5"
          EV2_G12_REPORT_PATH: g16-csp-http-evidence.json
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        run: npx playwright install --with-deps chromium
      - if: env.CANARY_DEPLOY_CONFIGURED == 'true'
        run: npm run canary:ev2:phase16:csp
        env:
          CSP_CANARY_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
          CSP_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CSP_EVIDENCE_PATH: g16-csp-browser-evidence.json
      - if: always() && env.CANARY_DEPLOY_CONFIGURED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ev2-g16-csp-evidence-${{ inputs.expected_sha }}
          path: |
            g16-csp-http-evidence.json
            g16-csp-browser-evidence.json
          if-no-files-found: error
          retention-days: 90
