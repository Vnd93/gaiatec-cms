name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: SHA completo do frontend anteriormente aprovado
        required: true
      backend_ref:
        description: SHA completo do backend forward-compatible que permanece ativo
        required: true
      source_run_id:
        description: Run ID bem-sucedido de Deploy staging que reteve o candidato
        required: true
      source_run_attempt:
        description: Tentativa exata do run de Deploy staging
        required: true
        default: "1"
      candidate_artifact_id:
        description: Artifact ID imutável do staging-candidate
        required: true
      candidate_artifact_digest:
        description: Digest sha256 completo do staging-candidate
        required: true
      confirmation:
        description: Digite ROLLBACK-STAGING:<git_ref>:<backend_ref>:<source_run_id>:<source_run_attempt>:<candidate_artifact_id>
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    steps:
      - name: Validate staging rollback dispatch authorization before any mutation
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FRONTEND_REF: ${{ inputs.git_ref }}
          BACKEND_REF: ${{ inputs.backend_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::Staging rollback must be dispatched from main."
            exit 1
          fi
          if [ "${DISPATCH_ACTOR,,}" != "vnd93" ] || [ "${TRIGGERING_ACTOR,,}" != "vnd93" ]; then
            echo "::error::Staging rollback is restricted to the approved operator."
            exit 1
          fi
          expected_confirmation="ROLLBACK-STAGING:$FRONTEND_REF:$BACKEND_REF:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT:$CANDIDATE_ARTIFACT_ID"
          if [ "$CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::Staging rollback confirmation is invalid."
            exit 1
          fi
          if ! [[ "$FRONTEND_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::git_ref must be a full lowercase Git SHA."
            exit 1
          fi
          if ! [[ "$BACKEND_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::backend_ref must be a full lowercase Git SHA."
            exit 1
          fi
          for value in "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$CANDIDATE_ARTIFACT_ID"; do
            if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::source run, attempt and artifact ID must be positive integers."
              exit 1
            fi
          done
          if ! [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^(sha256:)?[a-f0-9]{64}$ ]]; then
            echo "::error::candidate_artifact_digest must be a complete SHA-256 digest."
            exit 1
          fi
      - name: Checkout exact frontend rollback target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          path: frontend
      - name: Checkout exact forward-compatible backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.backend_ref }}
          fetch-depth: 0
          path: backend
      - name: Checkout trusted rollback controls from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
      - name: Resolve and verify the exact rollback candidate
        id: candidate
        working-directory: frontend
        env:
          BACKEND_REF: ${{ inputs.backend_ref }}
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(printf '%s' "$candidate_sha" | grep -E '^[a-f0-9]{40}$')" = "$candidate_sha"
          git merge-base --is-ancestor "$candidate_sha" origin/main
          test "$(printf '%s' "$BACKEND_REF" | grep -E '^[a-f0-9]{40}$')" = "$BACKEND_REF"
          test "$(git -C ../backend rev-parse HEAD)" = "$BACKEND_REF"
          git merge-base --is-ancestor "$candidate_sha" "$BACKEND_REF"
          git merge-base --is-ancestor "$BACKEND_REF" origin/main
          test -z "$(git status --porcelain)"
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve staging-candidate by source run, artifact ID and digest
        id: target_artifact
        timeout-minutes: 5
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
        run: >-
          node scripts/ev2/phase12/resolve-staging-candidate-artifact.mjs
          --run-id "$SOURCE_RUN_ID"
          --run-attempt "$SOURCE_RUN_ATTEMPT"
          --artifact-id "$CANDIDATE_ARTIFACT_ID"
          --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"
          --candidate "${{ steps.candidate.outputs.sha }}"
      - name: Prove target ancestry against its trusted staging control revision
        working-directory: control
        run: |
          git cat-file -e "${{ steps.target_artifact.outputs.control_sha }}^{commit}"
          git merge-base --is-ancestor \
            "${{ steps.candidate.outputs.sha }}" "${{ steps.target_artifact.outputs.control_sha }}"
          git merge-base --is-ancestor \
            "${{ steps.target_artifact.outputs.control_sha }}" origin/main
      - name: Download only the resolved immutable staging-candidate artifact
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.target_artifact.outputs.artifact_id }}
          digest-mismatch: error
          path: target-artifact
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Materialize the exact target package with bounded legacy read-only compatibility
        id: target_package
        working-directory: control
        run: >-
          node scripts/ev2/phase12/materialize-staging-candidate-artifact.mjs
          --artifact-dir ../target-artifact
          --output-dist ../target-artifact-verified-dist
          --candidate "${{ steps.candidate.outputs.sha }}"
      - name: Prove the sealed rollback frontend accepts the retained AI model
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-ai-model-rollback-compatibility.mjs
          --source ../frontend --dist "${{ steps.target_package.outputs.dist_path }}"
          --report ../g12-staging-rollback-ai-model-compatibility.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
          cache: npm
          cache-dependency-path: control/package-lock.json
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Refuse authoritative rollback capture while any staging recovery is armed
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs fence
          --owner-kind staging-rollback --require-empty
          --file ../staging-rollback-initial-recovery-fence.json
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --control-sha "$GITHUB_SHA"
      - name: Verify rollback target against the retained backend
        working-directory: backend
        run: >-
          node scripts/ev2/phase12/verify-backend-forward-compatibility.mjs
          --candidate . --baseline ../frontend --report g12-backend-compatibility.json
      - name: Reconfirm the empty recovery fence immediately before authoritative rollback capture
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs fence
          --owner-kind staging-rollback --require-empty
          --file ../staging-rollback-capture-fence.json
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --control-sha "$GITHUB_SHA"
      - name: Capture immutable live staging state before any remote mutation
        id: original_staging
        timeout-minutes: 3
        working-directory: control
        run: node scripts/ev2/phase12/staging-pages-state.mjs capture-current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
      - name: Probe the exact live staging baseline before any mutation
        timeout-minutes: 10
        working-directory: control
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.original_staging.outputs.release }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-rollback-original-probe.json
      - name: Classify the exact immutable producer of the live staging deployment
        id: baseline_source
        working-directory: control
        run: >-
          node scripts/ev2/phase12/classify-staging-rollback-baseline.mjs
          --record .github/release-controls/staging-baseline-bootstrap.json
          --deployment-id "${{ steps.original_staging.outputs.deployment_id }}"
          --release "${{ steps.original_staging.outputs.release }}"
          --created-on "${{ steps.original_staging.outputs.created_on }}"
          --commit-message-b64 "${{ steps.original_staging.outputs.commit_message_b64 }}"
      - name: Resolve the deploy artifact tuple bound to the live deployment marker
        id: baseline_deploy_source
        if: steps.baseline_source.outputs.mode == 'deploy-v4'
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: >-
          node scripts/ev2/phase12/resolve-staging-rollback-deploy-artifact.mjs
          --run-id "${{ steps.baseline_source.outputs.producer_run_id }}"
          --run-attempt "${{ steps.baseline_source.outputs.producer_run_attempt }}"
          --candidate "${{ steps.original_staging.outputs.release }}"
          --deployment-id "${{ steps.original_staging.outputs.deployment_id }}"
          --created-on "${{ steps.original_staging.outputs.created_on }}"
          --commit-message-b64 "${{ steps.original_staging.outputs.commit_message_b64 }}"
      - name: Download deploy evidence that attests the candidate artifact tuple
        if: steps.baseline_source.outputs.mode == 'deploy-v4'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_deploy_source.outputs.evidence_artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_deploy_source.outputs.source_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-deploy-evidence
      - name: Verify deploy evidence binds the exact candidate ID digest and SHA
        id: baseline_deploy_evidence
        if: steps.baseline_source.outputs.mode == 'deploy-v4'
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-staging-rollback-deploy-evidence.mjs
          --file "$RUNNER_TEMP/g12-staging-rollback-deploy-evidence/candidate/outputs/staging-artifact-bindings.json"
          --candidate "${{ steps.original_staging.outputs.release }}"
          --artifact-id "${{ steps.baseline_deploy_source.outputs.artifact_id }}"
          --artifact-digest "${{ steps.baseline_deploy_source.outputs.artifact_digest }}"
      - name: Download exact deploy bytes by immutable artifact ID and digest
        if: steps.baseline_source.outputs.mode == 'deploy-v4'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_deploy_source.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_deploy_source.outputs.source_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-deploy-source
      - name: Materialize exact deploy bytes without rebuilding
        id: baseline_deploy_package
        if: steps.baseline_source.outputs.mode == 'deploy-v4'
        working-directory: control
        run: >-
          node scripts/ev2/phase12/materialize-staging-candidate-artifact.mjs
          --artifact-dir "$RUNNER_TEMP/g12-staging-rollback-deploy-source"
          --output-dist ../recovery-source/dist
          --candidate "${{ steps.original_staging.outputs.release }}"
      - name: Bind materialized deploy bytes to the deployment run evidence
        if: steps.baseline_source.outputs.mode == 'deploy-v4'
        env:
          ACTUAL_ARCHIVE: ${{ steps.baseline_deploy_package.outputs.archive_sha256 }}
          ACTUAL_TREE: ${{ steps.baseline_deploy_package.outputs.tree_sha256 }}
          ATTESTED_ARCHIVE: ${{ steps.baseline_deploy_evidence.outputs.archive_sha256 }}
          ATTESTED_TREE: ${{ steps.baseline_deploy_evidence.outputs.tree_sha256 }}
        run: |
          set -euo pipefail
          test "$ACTUAL_ARCHIVE" = "$ATTESTED_ARCHIVE"
          test "$ACTUAL_TREE" = "$ATTESTED_TREE"
      - name: Resolve immutable bridge evidence for the live deployment
        id: baseline_bridge_run
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: >-
          node scripts/ev2/phase12/verify-staging-frontend-bridge-run.mjs
          --run-id "${{ steps.baseline_source.outputs.producer_run_id }}"
          --expected-release "${{ steps.original_staging.outputs.release }}"
      - name: Bind bridge evidence attempt to the live deployment marker
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        env:
          MARKER_ATTEMPT: ${{ steps.baseline_source.outputs.producer_run_attempt }}
          RESOLVED_ATTEMPT: ${{ steps.baseline_bridge_run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          test "$MARKER_ATTEMPT" = "$RESOLVED_ATTEMPT"
      - name: Download immutable bridge evidence by artifact ID and digest
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_bridge_run.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_source.outputs.producer_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-bridge-evidence
      - name: Verify bridge evidence against the exact live deployment identity
        id: baseline_bridge
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        working-directory: control
        env:
          EXPECTED_RUN_ID: ${{ steps.baseline_source.outputs.producer_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.baseline_source.outputs.producer_run_attempt }}
          EXPECTED_CONTROL_SHA: ${{ steps.baseline_bridge_run.outputs.control_sha }}
          EXPECTED_RELEASE: ${{ steps.original_staging.outputs.release }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.original_staging.outputs.deployment_id }}
          EXPECTED_CANONICAL_CREATED_ON: ${{ steps.original_staging.outputs.created_on }}
        run: >-
          node scripts/ev2/phase12/verify-staging-frontend-bridge-evidence.mjs
          --artifact-dir "$RUNNER_TEMP/g12-staging-rollback-bridge-evidence"
      - name: Resolve the exact CI package attested by bridge evidence
        id: baseline_bridge_ci_source
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: >-
          node scripts/ev2/phase12/resolve-ci-staging-frontend-artifact.mjs
          --run-id "${{ steps.baseline_bridge.outputs.source_run_id }}"
          --run-attempt "${{ steps.baseline_bridge.outputs.source_run_attempt }}"
          --gate-run-attempt "${{ steps.baseline_bridge.outputs.gate_run_attempt }}"
          --sha "${{ steps.original_staging.outputs.release }}"
      - name: Bind the resolved CI tuple to bridge evidence
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        env:
          RESOLVED_ID: ${{ steps.baseline_bridge_ci_source.outputs.artifact_id }}
          RESOLVED_DIGEST: ${{ steps.baseline_bridge_ci_source.outputs.artifact_digest }}
          RESOLVED_NAME: ${{ steps.baseline_bridge_ci_source.outputs.artifact_name }}
          ATTESTED_ID: ${{ steps.baseline_bridge.outputs.artifact_id }}
          ATTESTED_DIGEST: ${{ steps.baseline_bridge.outputs.artifact_digest }}
          ATTESTED_NAME: ${{ steps.baseline_bridge.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test "$RESOLVED_ID" = "$ATTESTED_ID"
          test "$RESOLVED_DIGEST" = "$ATTESTED_DIGEST"
          test "$RESOLVED_NAME" = "$ATTESTED_NAME"
      - name: Download exact bridge source bytes by immutable artifact ID and digest
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_bridge_ci_source.outputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_bridge_ci_source.outputs.source_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-bridge-source
      - name: Materialize and verify exact bridge source bytes without rebuilding
        id: baseline_bridge_package
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        working-directory: control
        env: &staging_rollback_build_identity
          VITE_RELEASE: ${{ steps.original_staging.outputs.release }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_STAGING_SITE_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
          VITE_CONTACT_CAPTCHA_ALWAYS: "true"
          VITE_EV2_DRAFT_V2_CANDIDATE: "false"
        run: >-
          node scripts/ev2/phase12/verify-staging-frontend-package.mjs
          --package "$RUNNER_TEMP/g12-staging-rollback-bridge-source"
          --output ../recovery-source/dist
          --candidate "${{ steps.original_staging.outputs.release }}"
          --run-id "${{ steps.baseline_bridge_ci_source.outputs.source_run_id }}"
          --run-attempt "${{ steps.baseline_bridge_ci_source.outputs.source_run_attempt }}"
      - name: Bind materialized bridge bytes to the deployment evidence
        if: steps.baseline_source.outputs.mode == 'bridge-v5'
        env:
          ACTUAL_ARCHIVE: ${{ steps.baseline_bridge_package.outputs.archive_sha256 }}
          ACTUAL_TREE: ${{ steps.baseline_bridge_package.outputs.tree_sha256 }}
          ACTUAL_PROFILE: ${{ steps.baseline_bridge_package.outputs.profile_sha256 }}
          ACTUAL_ARCHIVE_BYTES: ${{ steps.baseline_bridge_package.outputs.archive_bytes }}
          ACTUAL_FILE_COUNT: ${{ steps.baseline_bridge_package.outputs.file_count }}
          ACTUAL_BYTE_COUNT: ${{ steps.baseline_bridge_package.outputs.byte_count }}
          ATTESTED_ARCHIVE: ${{ steps.baseline_bridge.outputs.archive_sha256 }}
          ATTESTED_TREE: ${{ steps.baseline_bridge.outputs.tree_sha256 }}
          ATTESTED_PROFILE: ${{ steps.baseline_bridge.outputs.profile_sha256 }}
          ATTESTED_ARCHIVE_BYTES: ${{ steps.baseline_bridge.outputs.archive_bytes }}
          ATTESTED_FILE_COUNT: ${{ steps.baseline_bridge.outputs.file_count }}
          ATTESTED_BYTE_COUNT: ${{ steps.baseline_bridge.outputs.byte_count }}
        run: |
          set -euo pipefail
          test "$ACTUAL_ARCHIVE" = "$ATTESTED_ARCHIVE"
          test "$ACTUAL_TREE" = "$ATTESTED_TREE"
          test "$ACTUAL_PROFILE" = "$ATTESTED_PROFILE"
          test "$ACTUAL_ARCHIVE_BYTES" = "$ATTESTED_ARCHIVE_BYTES"
          test "$ACTUAL_FILE_COUNT" = "$ATTESTED_FILE_COUNT"
          test "$ACTUAL_BYTE_COUNT" = "$ATTESTED_BYTE_COUNT"
      - name: Verify one-time bootstrap provenance against live GitHub metadata
        id: baseline_bootstrap
        if: >-
          steps.baseline_source.outputs.mode == 'bootstrap' ||
          steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: >-
          node scripts/ev2/phase12/resolve-staging-baseline-bootstrap.mjs
          --record .github/release-controls/staging-baseline-bootstrap.json
      - name: Resolve exact failed run and immutable compensation artifacts
        id: baseline_compensation
        if: >-
          steps.baseline_source.outputs.mode == 'deploy-compensation' ||
          steps.baseline_source.outputs.mode == 'bridge-compensation' ||
          steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: >-
          node scripts/ev2/phase12/resolve-staging-baseline-compensation.mjs
          --mode "${{ steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation' && 'deploy-compensation' || steps.baseline_source.outputs.mode }}"
          --run-id "${{ steps.baseline_source.outputs.producer_run_id }}"
          --run-attempt "${{ steps.baseline_source.outputs.producer_run_attempt }}"
      - name: Download exact deploy-compensation state by ID and digest
        if: >-
          steps.baseline_source.outputs.mode == 'deploy-compensation' ||
          steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_compensation.outputs.state_artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_source.outputs.producer_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-compensation-state
      - name: Download exact compensation recovery bytes by ID and digest
        if: >-
          steps.baseline_source.outputs.mode == 'deploy-compensation' ||
          steps.baseline_source.outputs.mode == 'bridge-compensation' ||
          steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_compensation.outputs.recovery_artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_source.outputs.producer_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-compensation-recovery
      - name: Verify compensation state and materialize exact recovery bytes
        id: baseline_compensation_package
        if: >-
          steps.baseline_source.outputs.mode == 'deploy-compensation' ||
          steps.baseline_source.outputs.mode == 'bridge-compensation'
        working-directory: control
        env: *staging_rollback_build_identity
        run: |
          set -euo pipefail
          state_args=()
          if [ "${{ steps.baseline_source.outputs.mode }}" = deploy-compensation ]; then
            state_args=(--state-dir "$RUNNER_TEMP/g12-staging-rollback-compensation-state")
          fi
          node scripts/ev2/phase12/materialize-staging-baseline-compensation.mjs \
            --mode "${{ steps.baseline_source.outputs.mode }}" \
            --record .github/release-controls/staging-baseline-bootstrap.json \
            --recovery-dir "$RUNNER_TEMP/g12-staging-rollback-compensation-recovery" \
            "${state_args[@]}" \
            --candidate "${{ steps.original_staging.outputs.release }}" \
            --run-id "${{ steps.baseline_source.outputs.producer_run_id }}" \
            --run-attempt "${{ steps.baseline_source.outputs.producer_run_attempt }}" \
            --control-sha "${{ steps.baseline_compensation.outputs.control_sha }}" \
            --recovery-artifact-id "${{ steps.baseline_compensation.outputs.recovery_artifact_id }}" \
            --recovery-artifact-digest "${{ steps.baseline_compensation.outputs.recovery_artifact_digest }}" \
            --recovery-artifact-name "${{ steps.baseline_compensation.outputs.recovery_artifact_name }}" \
            --output-dist ../recovery-source/dist
      - name: Verify pinned legacy bootstrap compensation before selecting bootstrap bytes
        if: steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-staging-legacy-bootstrap-compensation.mjs
          --record .github/release-controls/staging-baseline-bootstrap.json
          --state-artifact-dir "$RUNNER_TEMP/g12-staging-rollback-compensation-state"
          --recovery-artifact-dir "$RUNNER_TEMP/g12-staging-rollback-compensation-recovery"
          --candidate-sha "${{ steps.original_staging.outputs.release }}"
          --control-sha "${{ steps.baseline_compensation.outputs.control_sha }}"
          --run-id "${{ steps.baseline_source.outputs.producer_run_id }}"
          --run-attempt "${{ steps.baseline_source.outputs.producer_run_attempt }}"
          --state-artifact-id "${{ steps.baseline_compensation.outputs.state_artifact_id }}"
          --state-artifact-digest "${{ steps.baseline_compensation.outputs.state_artifact_digest }}"
          --state-artifact-name "${{ steps.baseline_compensation.outputs.state_artifact_name }}"
          --recovery-artifact-id "${{ steps.baseline_compensation.outputs.recovery_artifact_id }}"
          --recovery-artifact-digest "${{ steps.baseline_compensation.outputs.recovery_artifact_digest }}"
          --recovery-artifact-name "${{ steps.baseline_compensation.outputs.recovery_artifact_name }}"
      - name: Download exact bootstrap bridge evidence by ID and digest
        if: >-
          steps.baseline_source.outputs.mode == 'bootstrap' ||
          steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_bootstrap.outputs.bridge_artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_bootstrap.outputs.bridge_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-bootstrap-bridge
      - name: Download exact bootstrap source bytes by ID and digest
        if: >-
          steps.baseline_source.outputs.mode == 'bootstrap' ||
          steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline_bootstrap.outputs.source_artifact_id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: Vnd93/gaiatec-cms
          run-id: ${{ steps.baseline_bootstrap.outputs.source_run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-bootstrap-source
      - name: Resolve original CI tuple attested by deploy compensation
        id: baseline_compensation_ci_source
        if: steps.baseline_source.outputs.mode == 'deploy-compensation'
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: >-
          node scripts/ev2/phase12/resolve-ci-staging-frontend-artifact.mjs
          --run-id "${{ steps.baseline_compensation_package.outputs.source_run_id }}"
          --run-attempt "${{ steps.baseline_compensation_package.outputs.source_run_attempt }}"
          --gate-run-attempt "${{ steps.baseline_compensation_package.outputs.source_gate_run_attempt }}"
          --sha "${{ steps.original_staging.outputs.release }}"
      - name: Bind compensation recovery bytes to the original CI artifact tuple
        if: steps.baseline_source.outputs.mode == 'deploy-compensation'
        env:
          RECOVERED_ID: ${{ steps.baseline_compensation_package.outputs.source_artifact_id }}
          RECOVERED_DIGEST: ${{ steps.baseline_compensation_package.outputs.source_artifact_digest }}
          RECOVERED_NAME: ${{ steps.baseline_compensation_package.outputs.source_artifact_name }}
          RESOLVED_ID: ${{ steps.baseline_compensation_ci_source.outputs.artifact_id }}
          RESOLVED_DIGEST: ${{ steps.baseline_compensation_ci_source.outputs.artifact_digest }}
          RESOLVED_NAME: ${{ steps.baseline_compensation_ci_source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test "$RECOVERED_ID" = "$RESOLVED_ID"
          test "$RECOVERED_DIGEST" = "$RESOLVED_DIGEST"
          test "$RECOVERED_NAME" = "$RESOLVED_NAME"
      - name: Materialize exact bootstrap bytes without rebuilding
        id: baseline_bootstrap_package
        if: >-
          steps.baseline_source.outputs.mode == 'bootstrap' ||
          steps.baseline_source.outputs.mode == 'legacy-bootstrap-compensation'
        working-directory: control
        run: |
          set -euo pipefail
          mkdir -p ../recovery-source
          node scripts/ev2/phase12/materialize-staging-baseline-bootstrap.mjs \
            --record .github/release-controls/staging-baseline-bootstrap.json \
            --bridge-artifact-dir "$RUNNER_TEMP/g12-staging-rollback-bootstrap-bridge" \
            --source-artifact-dir "$RUNNER_TEMP/g12-staging-rollback-bootstrap-source" \
            --output-dist ../recovery-source/dist
      - name: Normalize only the selected immutable recovery archive and seal
        working-directory: control
        env:
          BASELINE_MODE: ${{ steps.baseline_source.outputs.mode }}
          DEPLOY_ARCHIVE: ${{ steps.baseline_deploy_package.outputs.archive_path }}
          DEPLOY_SEAL: ${{ steps.baseline_deploy_package.outputs.seal_path }}
          BRIDGE_ARCHIVE: ${{ runner.temp }}/g12-staging-rollback-bridge-source/staging-frontend-dist.tar
          BRIDGE_SEAL: ${{ runner.temp }}/g12-staging-rollback-bridge-source/staging-frontend-dist-seal.json
          BOOTSTRAP_ARCHIVE: ${{ steps.baseline_bootstrap_package.outputs.archive_path }}
          BOOTSTRAP_SEAL: ${{ steps.baseline_bootstrap_package.outputs.seal_path }}
          COMPENSATION_ARCHIVE: ${{ steps.baseline_compensation_package.outputs.archive_path }}
          COMPENSATION_SEAL: ${{ steps.baseline_compensation_package.outputs.seal_path }}
        run: |
          set -euo pipefail
          case "$BASELINE_MODE" in
            deploy-v4) archive="$DEPLOY_ARCHIVE"; seal="$DEPLOY_SEAL" ;;
            bridge-v5) archive="$BRIDGE_ARCHIVE"; seal="$BRIDGE_SEAL" ;;
            bootstrap|legacy-bootstrap-compensation)
              archive="$BOOTSTRAP_ARCHIVE"; seal="$BOOTSTRAP_SEAL" ;;
            deploy-compensation|bridge-compensation)
              archive="$COMPENSATION_ARCHIVE"; seal="$COMPENSATION_SEAL" ;;
            *) echo G12_STAGING_ROLLBACK_BASELINE_MODE_REFUSED >&2; exit 1 ;;
          esac
          test -f "$archive"
          test -f "$seal"
          mkdir -p ../recovery-source/outputs
          cp "$archive" ../recovery-source/outputs/staging-rollback-recovery-dist.tar
          cp "$seal" ../recovery-source/outputs/staging-rollback-recovery-dist-seal.json
      - name: Verify exact recovered bytes before durable upload or mutation
        working-directory: control
        run: >-
          node scripts/ev2/phase12/verify-production-dist-seal.mjs
          --dist ../recovery-source/dist
          --seal ../recovery-source/outputs/staging-rollback-recovery-dist-seal.json
          --candidate "${{ steps.original_staging.outputs.release }}"
      - name: Upload mandatory exact rollback recovery bytes before state or mutation
        id: recovery_artifact_upload
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-rollback-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-source/dist
            recovery-source/outputs/staging-rollback-recovery-dist.tar
            recovery-source/outputs/staging-rollback-recovery-dist-seal.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Persist credential-free staging rollback state
        id: rollback_state
        working-directory: control
        env:
          ORIGINAL_DEPLOYMENT: ${{ steps.original_staging.outputs.deployment_id }}
          ORIGINAL_RELEASE: ${{ steps.original_staging.outputs.release }}
          ORIGINAL_CREATED_ON: ${{ steps.original_staging.outputs.created_on }}
          ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.original_staging.outputs.commit_message_b64 }}
          TARGET_RELEASE: ${{ steps.candidate.outputs.sha }}
          BACKEND_RELEASE: ${{ inputs.backend_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          TARGET_ARTIFACT_ID: ${{ steps.target_artifact.outputs.artifact_id }}
          TARGET_ARTIFACT_DIGEST: ${{ steps.target_artifact.outputs.artifact_digest }}
          TARGET_ARTIFACT_NAME: ${{ steps.target_artifact.outputs.artifact_name }}
          TARGET_SEAL_PATH: ${{ steps.target_package.outputs.seal_path }}
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery_artifact_upload.outputs.artifact-id }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.recovery_artifact_upload.outputs.artifact-digest }}
          RECOVERY_ARTIFACT_NAME: staging-rollback-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync, writeFileSync } = require("node:fs");
          const targetSeal = JSON.parse(readFileSync(process.env.TARGET_SEAL_PATH, "utf8"));
          const recoverySeal = JSON.parse(readFileSync("../recovery-source/outputs/staging-rollback-recovery-dist-seal.json", "utf8"));
          const identity = (seal) => ({
            schemaVersion: seal.schemaVersion, candidateSha: seal.candidateSha,
            fileCount: seal.fileCount, byteCount: seal.byteCount, treeSha256: seal.treeSha256,
            archiveFile: seal.archiveFile, archiveBytes: seal.archiveBytes,
            archiveSha256: seal.archiveSha256,
          });
          const runId = process.env.GITHUB_RUN_ID;
          const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const encodedCommitMessage = process.env.ORIGINAL_COMMIT_MESSAGE_B64;
          if (!Object.hasOwn(process.env, "ORIGINAL_COMMIT_MESSAGE_B64") ||
              !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encodedCommitMessage))
            throw new Error("G12_STAGING_ROLLBACK_COMMIT_MESSAGE_ENCODING_REFUSED");
          const originalCommitMessage = Buffer.from(encodedCommitMessage, "base64").toString("utf8");
          if (Buffer.byteLength(originalCommitMessage, "utf8") > 4096 || originalCommitMessage.includes("\0") ||
              Buffer.from(originalCommitMessage, "utf8").toString("base64") !== encodedCommitMessage)
            throw new Error("G12_STAGING_ROLLBACK_COMMIT_MESSAGE_ENCODING_REFUSED");
          const state = {
            schemaVersion: 1,
            event: "g12.staging.rollback.prepared",
            workflow: { runId, runAttempt, controlSha: process.env.CONTROL_SHA },
            project: "gaiatec-cms-staging", branch: "ev2-g17-canary",
            runMarker: `g12-staging-rollback-${runId}-${runAttempt}`,
            compensationMarker: `g12-staging-rollback-compensation-${runId}-${runAttempt}`,
            original: {
              deploymentId: process.env.ORIGINAL_DEPLOYMENT,
              release: process.env.ORIGINAL_RELEASE,
              createdOn: process.env.ORIGINAL_CREATED_ON,
              commitMessage: originalCommitMessage,
            },
            target: {
              release: process.env.TARGET_RELEASE,
              sourceRunId: process.env.SOURCE_RUN_ID,
              sourceRunAttempt: Number(process.env.SOURCE_RUN_ATTEMPT),
              artifact: { id: process.env.TARGET_ARTIFACT_ID, digest: process.env.TARGET_ARTIFACT_DIGEST, name: process.env.TARGET_ARTIFACT_NAME },
              seal: identity(targetSeal),
            },
            recovery: {
              release: process.env.ORIGINAL_RELEASE,
              seal: identity(recoverySeal),
              artifact: {
                id: process.env.RECOVERY_ARTIFACT_ID,
                digest: process.env.RECOVERY_ARTIFACT_DIGEST,
                name: process.env.RECOVERY_ARTIFACT_NAME,
              },
            },
            retainedBackend: { release: process.env.BACKEND_RELEASE },
            recordedAt: new Date().toISOString(), sensitiveValuesLogged: false,
          };
          writeFileSync("../rollback-staging-state.json", JSON.stringify(state, null, 2) + "\n", { mode: 0o600 });
          appendFileSync(process.env.GITHUB_OUTPUT, `run_marker=${state.runMarker}\ncompensation_marker=${state.compensationMarker}\n`);
          NODE
      - name: Upload redundant staging rollback state
        id: rollback_state_upload
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-rollback-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-staging-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Download the just-uploaded rollback state by immutable artifact ID
        id: rollback_state_download
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.rollback_state_upload.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-state-pre-mutation
      - name: Download the just-uploaded recovery bytes by immutable artifact ID
        id: recovery_artifact_download
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.recovery_artifact_upload.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ secrets.RELEASE_GUARD_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/g12-staging-rollback-recovery-pre-mutation
      - name: Reverify downloaded state and exact recovery bytes before mutation
        id: durable_recovery_remote
        working-directory: control
        env:
          STATE_ARTIFACT_ID: ${{ steps.rollback_state_upload.outputs.artifact-id }}
          STATE_ARTIFACT_DIGEST: ${{ steps.rollback_state_upload.outputs.artifact-digest }}
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery_artifact_upload.outputs.artifact-id }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.recovery_artifact_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          id='^[1-9][0-9]*$'
          digest='^sha256:[a-f0-9]{64}$'
          [[ "$STATE_ARTIFACT_ID" =~ $id ]]
          [[ "$RECOVERY_ARTIFACT_ID" =~ $id ]]
          [[ "$STATE_ARTIFACT_DIGEST" =~ $digest ]]
          [[ "$RECOVERY_ARTIFACT_DIGEST" =~ $digest ]]
          cmp -s ../rollback-staging-state.json \
            "$RUNNER_TEMP/g12-staging-rollback-state-pre-mutation/rollback-staging-state.json"
          local_archive=../recovery-source/outputs/staging-rollback-recovery-dist.tar
          remote_archive="$RUNNER_TEMP/g12-staging-rollback-recovery-pre-mutation/outputs/staging-rollback-recovery-dist.tar"
          local_seal=../recovery-source/outputs/staging-rollback-recovery-dist-seal.json
          remote_seal="$RUNNER_TEMP/g12-staging-rollback-recovery-pre-mutation/outputs/staging-rollback-recovery-dist-seal.json"
          cmp -s "$local_archive" "$remote_archive"
          cmp -s "$local_seal" "$remote_seal"
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");
          const root = process.env.RUNNER_TEMP + "/g12-staging-rollback-recovery-pre-mutation";
          const seal = JSON.parse(readFileSync(`${root}/outputs/staging-rollback-recovery-dist-seal.json`, "utf8"));
          const archive = readFileSync(`${root}/outputs/staging-rollback-recovery-dist.tar`);
          if (createHash("sha256").update(archive).digest("hex") !== seal.archiveSha256 ||
              statSync(`${root}/outputs/staging-rollback-recovery-dist.tar`).size !== seal.archiveBytes)
            throw new Error("G12_STAGING_ROLLBACK_REMOTE_ARCHIVE_REFUSED");
          const state = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/g12-staging-rollback-state-pre-mutation/rollback-staging-state.json`, "utf8"));
          if (state.recovery?.artifact?.id !== process.env.RECOVERY_ARTIFACT_ID ||
              state.recovery?.artifact?.digest !== process.env.RECOVERY_ARTIFACT_DIGEST ||
              state.recovery?.artifact?.name !== `staging-rollback-recovery-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}` ||
              state.recovery?.seal?.archiveSha256 !== seal.archiveSha256 ||
              state.recovery?.seal?.treeSha256 !== seal.treeSha256)
            throw new Error("G12_STAGING_ROLLBACK_REMOTE_STATE_BINDING_REFUSED");
          NODE
          node scripts/ev2/phase12/verify-staging-recovery-seal.mjs \
            --state "$RUNNER_TEMP/g12-staging-rollback-state-pre-mutation/rollback-staging-state.json" \
            --seal "$remote_seal" \
            --role recovery
          node scripts/ev2/phase12/verify-production-dist-seal.mjs \
            --dist "$RUNNER_TEMP/g12-staging-rollback-recovery-pre-mutation/dist" \
            --seal "$remote_seal" \
            --candidate "${{ steps.original_staging.outputs.release }}"
      - name: Persist redundant HMAC rollback state after both durable uploads are verified
        id: hmac_state
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
          CONTROL_SHA: ${{ github.sha }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs put
          --kind staging-rollback --file ../rollback-staging-state.json
      - name: Verify the retained staging backend without mutation
        id: backend_convergence
        continue-on-error: true
        working-directory: backend
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = "glcqsosxwgmlhzgcsnzv"
          supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF" --output json > ../g12-staging-rollback-functions.json
          node scripts/ev2/phase12/verify-production-functions.mjs \
            --file ../g12-staging-rollback-functions.json \
            --environment staging --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            | tee ../g12-staging-rollback-functions-verification.json
          node scripts/ev2/phase12/verify-staging-database.mjs --source . | tee ../g12-staging-rollback-database.json
      - name: Install exact locked Wrangler after durable pre-state
        id: install_wrangler
        if: >-
          always() && steps.durable_recovery_remote.outcome == 'success' &&
          steps.hmac_state.outcome == 'success' &&
          steps.backend_convergence.outcome == 'success'
        timeout-minutes: 10
        working-directory: control
        run: npm ci --ignore-scripts
      - name: Reconfirm original staging immediately before Pages mutation
        id: original_recheck
        if: >-
          always() && steps.durable_recovery_remote.outcome == 'success' &&
          steps.hmac_state.outcome == 'success' &&
          steps.backend_convergence.outcome == 'success' &&
          steps.install_wrangler.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        working-directory: control
        env: &staging_rollback_environment
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.original_staging.outputs.deployment_id }}
          STAGING_ORIGINAL_RELEASE: ${{ steps.original_staging.outputs.release }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.original_staging.outputs.created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.original_staging.outputs.commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.candidate.outputs.sha }}
          STAGING_RUN_MARKER: ${{ steps.rollback_state.outputs.run_marker }}
          STAGING_COMPENSATION_MARKER: ${{ steps.rollback_state.outputs.compensation_marker }}
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-original
      - name: Restore only the exact retained and sealed staging-candidate bytes
        id: deploy
        if: >-
          always() && steps.durable_recovery_remote.outcome == 'success' &&
          steps.hmac_state.outcome == 'success' &&
          steps.backend_convergence.outcome == 'success' &&
          steps.install_wrangler.outcome == 'success' &&
          steps.original_recheck.outcome == 'success'
        timeout-minutes: 20
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_environment
        run: >-
          node scripts/ev2/phase12/deploy-sealed-staging-dist.mjs
          --archive "${{ steps.target_package.outputs.archive_path }}"
          --seal "${{ steps.target_package.outputs.seal_path }}"
          --candidate "${{ steps.candidate.outputs.sha }}"
          --branch ev2-g17-canary
          --commit-message "${{ steps.rollback_state.outputs.run_marker }}"
          --wrangler-script node_modules/wrangler/bin/wrangler.js
      - name: Confirm only this rollback target became canonical
        id: target_canonical
        if: always() && steps.deploy.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_environment
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-owned
      - name: Verify the restored frontend with the retained backend
        id: target_probe
        if: always() && steps.target_canonical.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-rollback-probe.json
      - name: Probe retained public, anonymous, CORS and secret boundaries
        id: target_boundary
        if: always() && steps.target_canonical.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: node scripts/ev2/phase12/probe-supabase-boundary.mjs | tee ../g12-staging-rollback-boundary.json
        env:
          CMS_BACKEND_ENVIRONMENT: staging
          CMS_BACKEND_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          CMS_BACKEND_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          CMS_BACKEND_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
      - name: Seal credential-free rollback evidence
        id: target_evidence
        if: always()
        continue-on-error: true
        working-directory: control
        env:
          BACKEND_OUTCOME: ${{ steps.backend_convergence.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CANONICAL_OUTCOME: ${{ steps.target_canonical.outcome }}
          PROBE_OUTCOME: ${{ steps.target_probe.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.target_boundary.outcome }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const state = JSON.parse(readFileSync("../rollback-staging-state.json", "utf8"));
          writeFileSync("../g12-staging-rollback-evidence.json", JSON.stringify({
            schemaVersion: 1, event: "g12.staging.rollback.target_evaluated",
            workflow: state.workflow, original: state.original, target: state.target,
            retainedBackend: state.retainedBackend,
            outcomes: { backend: process.env.BACKEND_OUTCOME, pagesMutation: process.env.DEPLOY_OUTCOME,
              canonicalIdentity: process.env.CANONICAL_OUTCOME, frontendProbe: process.env.PROBE_OUTCOME,
              boundaryProbe: process.env.BOUNDARY_OUTCOME },
            recordedAt: new Date().toISOString(), sensitiveValuesLogged: false,
          }, null, 2) + "\n", { mode: 0o600 });
          NODE
      - name: Upload mandatory target rollback evidence
        id: target_evidence_upload
        if: always() && steps.target_evidence.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-rollback-${{ steps.candidate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rollback-staging-state.json
            backend/g12-backend-compatibility.json
            g12-staging-rollback-ai-model-compatibility.json
            g12-staging-rollback-database.json
            g12-staging-rollback-boundary.json
            g12-staging-rollback-functions.json
            g12-staging-rollback-functions-verification.json
            g12-staging-rollback-original-probe.json
            g12-staging-rollback-probe.json
            g12-staging-rollback-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Decide compensation without overwriting an external deployment
        id: compensation_decision
        if: >-
          always() && steps.durable_recovery_remote.outcome == 'success' &&
          steps.hmac_state.outcome == 'success' &&
          (steps.backend_convergence.outcome != 'success' || steps.deploy.outcome != 'success' ||
          steps.target_canonical.outcome != 'success' || steps.target_probe.outcome != 'success' ||
          steps.target_boundary.outcome != 'success' || steps.target_evidence.outcome != 'success' ||
          steps.target_evidence_upload.outcome != 'success')
        timeout-minutes: 3
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_environment
        run: node scripts/ev2/phase12/staging-pages-state.mjs decide
      - name: Compensate only the still-canonical rollback target
        id: compensation
        if: >-
          always() && steps.durable_recovery_remote.outcome == 'success' &&
          steps.hmac_state.outcome == 'success' &&
          steps.compensation_decision.outputs.action == 'restore-original'
        timeout-minutes: 20
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery-source/dist
          --seal ../recovery-source/outputs/staging-rollback-recovery-dist-seal.json
      - name: Retry ambiguous rollback compensation safely
        id: compensation_retry
        if: >-
          always() && steps.durable_recovery_remote.outcome == 'success' &&
          steps.hmac_state.outcome == 'success' &&
          steps.compensation_decision.outputs.action == 'restore-original' &&
          steps.compensation.outcome != 'success'
        timeout-minutes: 20
        continue-on-error: true
        working-directory: control
        env: *staging_rollback_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery-source/dist
          --seal ../recovery-source/outputs/staging-rollback-recovery-dist-seal.json
      - name: Re-probe original staging after compensation
        id: compensation_probe
        if: >-
          always() && steps.compensation_decision.outcome == 'success' &&
          (steps.compensation_decision.outputs.action == 'already-original' ||
          steps.compensation.outcome == 'success' || steps.compensation_retry.outcome == 'success')
        timeout-minutes: 10
        continue-on-error: true
        working-directory: control
        run: node scripts/ev2/phase12/rollout-probe.mjs
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.original_staging.outputs.release }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-rollback-compensation-probe.json
      - name: Upload mandatory compensation evidence
        id: compensation_evidence_upload
        if: always() && steps.compensation_probe.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-rollback-compensation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rollback-staging-state.json
            g12-staging-rollback-compensation-probe.json
            g12-staging-rollback-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Clear redundant recovery state only after proven target success
        id: clear_recovery_state
        if: >-
          always() && steps.backend_convergence.outcome == 'success' && steps.deploy.outcome == 'success' &&
          steps.target_canonical.outcome == 'success' && steps.target_probe.outcome == 'success' &&
          steps.target_boundary.outcome == 'success' && steps.target_evidence.outcome == 'success' &&
          steps.target_evidence_upload.outcome == 'success'
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs clear
          --kind staging-rollback --file ../rollback-staging-state.json
          --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          --control-sha "${{ github.sha }}"
      - name: Enforce fail-closed rollback, compensation and evidence outcome
        if: always()
        env:
          BACKEND_OUTCOME: ${{ steps.backend_convergence.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CANONICAL_OUTCOME: ${{ steps.target_canonical.outcome }}
          PROBE_OUTCOME: ${{ steps.target_probe.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.target_boundary.outcome }}
          TARGET_EVIDENCE_OUTCOME: ${{ steps.target_evidence.outcome }}
          TARGET_EVIDENCE_UPLOAD_OUTCOME: ${{ steps.target_evidence_upload.outcome }}
          CLEAR_OUTCOME: ${{ steps.clear_recovery_state.outcome }}
          COMPENSATION_DECISION_OUTCOME: ${{ steps.compensation_decision.outcome }}
          COMPENSATION_ACTION: ${{ steps.compensation_decision.outputs.action }}
          COMPENSATION_OUTCOME: ${{ steps.compensation.outcome }}
          COMPENSATION_RETRY_OUTCOME: ${{ steps.compensation_retry.outcome }}
          COMPENSATION_PROBE_OUTCOME: ${{ steps.compensation_probe.outcome }}
          COMPENSATION_EVIDENCE_OUTCOME: ${{ steps.compensation_evidence_upload.outcome }}
        run: |
          set -euo pipefail
          if [ "$BACKEND_OUTCOME" = success ] && [ "$DEPLOY_OUTCOME" = success ] && \
             [ "$CANONICAL_OUTCOME" = success ] && [ "$PROBE_OUTCOME" = success ] && \
             [ "$BOUNDARY_OUTCOME" = success ] && [ "$TARGET_EVIDENCE_OUTCOME" = success ] && \
             [ "$TARGET_EVIDENCE_UPLOAD_OUTCOME" = success ] && [ "$CLEAR_OUTCOME" = success ]; then
            exit 0
          fi
          test "$COMPENSATION_DECISION_OUTCOME" = success
          test "$COMPENSATION_ACTION" = already-original -o "$COMPENSATION_ACTION" = restore-original
          if [ "$COMPENSATION_ACTION" = restore-original ]; then
            test "$COMPENSATION_OUTCOME" = success -o "$COMPENSATION_RETRY_OUTCOME" = success
          fi
          test "$COMPENSATION_PROBE_OUTCOME" = success
          test "$COMPENSATION_EVIDENCE_OUTCOME" = success
          echo "::error title=G12_STAGING_ROLLBACK_FAILED_COMPENSATED::original staging was restored and evidenced"
          exit 1
