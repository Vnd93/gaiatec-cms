name: Deploy staging watchdog

on:
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  # Um run de diagnostico de Deploy staging termina em failure por desenho e nao publica nada: o
  # job `deploy` e pulado inteiro. O watchdog acordava assim mesmo e morria em
  # G12_STAGING_WATCHDOG_STATE_UNAVAILABLE, deixando um run vermelho por passada de diagnostico.
  # Falha esperada que se acumula esconde a falha real: uma compensacao que nao aconteceu ficaria
  # indistinguivel do ruido. A discriminacao nao olha o input do pai, olha o fato que importa —
  # se o job mutante chegou a executar e se o finalizador ja encerrou a recuperacao.
  classify-parent-run:
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/deploy-staging.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      recovery_required: >-
        ${{ steps.parent.outcome == 'success' && steps.parent.outputs.recovery_required ||
        steps.parent_fallback.outputs.recovery_required }}
      mutation_mode: >-
        ${{ steps.parent.outcome == 'success' && steps.parent.outputs.mutation_mode ||
        steps.parent_fallback.outputs.mutation_mode }}
    steps:
      - name: Checkout the exact parent control revision for classification
        id: parent_control_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: control
      - name: Use the parent repository-pinned Node runtime for classification
        id: parent_control_node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Decide whether the incomplete run still requires recovery
        id: parent
        if: >-
          steps.parent_control_checkout.outcome == 'success' &&
          steps.parent_control_node.outcome == 'success'
        continue-on-error: true
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          PARENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          MUTATION_BOUNDARY_JOBS_FILE: ${{ runner.temp }}/g12-staging-parent-jobs.json
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/attempts/$PARENT_RUN_ATTEMPT/jobs?per_page=100" \
            > "$MUTATION_BOUNDARY_JOBS_FILE"
          node scripts/ev2/phase12/staging-mutation-boundary.mjs watchdog-jobs
      - name: Fail closed when the parent classifier itself does not complete
        id: parent_fallback
        if: >-
          always() && (steps.parent.outcome != 'success' ||
          steps.parent.outputs.recovery_required == '' ||
          steps.parent.outputs.mutation_mode == '')
        env:
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          PARENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          printf '{"event":"g12.staging.watchdog.parent-classification-failed","runId":"%s","runAttempt":"%s","recoveryRequired":true,"mutationMode":"ambiguous"}\n' \
            "$PARENT_RUN_ID" "$PARENT_RUN_ATTEMPT"
          echo "recovery_required=true" >> "$GITHUB_OUTPUT"
          echo "mutation_mode=ambiguous" >> "$GITHUB_OUTPUT"

  compensate-incomplete-staging-deploy:
    needs: classify-parent-run
    if: >-
      always() && needs.classify-parent-run.outputs.recovery_required != 'false' &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/deploy-staging.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    steps:
      - name: Checkout the exact trusted staging control revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: control
      - name: Use the parent repository-pinned Node runtime for watchdog recovery
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: control/.nvmrc
      - name: Recover HMAC staging state independently of artifacts
        id: variable_state
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs get
          --allow-missing
          --kind staging-deploy --file ../state-variable/staging-deploy-state.json
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
      - name: Download mandatory pre-mutation state from the incomplete run
        id: artifact_state
        if: >-
          always() && needs.classify-parent-run.outputs.mutation_mode != 'pre-mutation' &&
          (steps.variable_state.outcome != 'success' ||
          steps.variable_state.outputs.state_present != 'true')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-deploy-state-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          digest-mismatch: error
          path: state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate incomplete-run state and immutable ancestry
        id: watchdog_state
        if: >-
          always() && (needs.classify-parent-run.outputs.mutation_mode != 'pre-mutation' ||
          steps.variable_state.outputs.state_present == 'true')
        working-directory: control
        env:
          VARIABLE_STATE_OUTCOME: ${{ steps.variable_state.outcome }}
          VARIABLE_STATE_PRESENT: ${{ steps.variable_state.outputs.state_present }}
          ARTIFACT_STATE_OUTCOME: ${{ steps.artifact_state.outcome }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const statePath = process.env.VARIABLE_STATE_PRESENT === "true"
            ? "../state-variable/staging-deploy-state.json"
            : "../state/staging-deploy-state.json";
          if (process.env.VARIABLE_STATE_PRESENT !== "true" && process.env.ARTIFACT_STATE_OUTCOME !== "success")
            throw new Error("G12_STAGING_WATCHDOG_STATE_UNAVAILABLE");
          const state = JSON.parse(readFileSync(statePath, "utf8"));
          const sha = /^[a-f0-9]{40}$/;
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if (
            !["cancelled", "failure", "timed_out"].includes(process.env.TRIGGER_CONCLUSION) ||
            state.schemaVersion !== 1 || state.event !== "g12.staging.deploy.prepared" ||
            state.workflow?.runId !== process.env.TRIGGER_RUN_ID ||
            Number(state.workflow?.runAttempt) !== Number(process.env.TRIGGER_RUN_ATTEMPT) ||
            state.workflow?.controlSha !== process.env.TRIGGER_HEAD_SHA ||
            state.project !== "gaiatec-cms-staging" || state.branch !== "ev2-g17-canary" ||
            !sha.test(state.candidateRelease || "") || !sha.test(state.original?.release || "") ||
            !uuid.test(state.original?.deploymentId || "") ||
            !Number.isFinite(Date.parse(state.original?.createdOn || "")) ||
            typeof state.original?.commitMessage !== "string" || state.original.commitMessage.includes("\0") ||
            Buffer.byteLength(state.original.commitMessage, "utf8") > 4096 ||
            Buffer.from(state.original.commitMessage, "utf8").toString("utf8") !== state.original.commitMessage ||
            state.runMarker !== `g12-staging-run-${process.env.TRIGGER_RUN_ID}-${process.env.TRIGGER_RUN_ATTEMPT}` ||
            state.compensationMarker !== `g12-staging-deploy-compensation-${process.env.TRIGGER_RUN_ID}-${process.env.TRIGGER_RUN_ATTEMPT}`
          ) throw new Error("G12_STAGING_WATCHDOG_STATE_REFUSED");
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `candidate_release=${state.candidateRelease}`,
            `original_release=${state.original.release}`,
            `original_deployment=${state.original.deploymentId}`,
            `original_created_on=${new Date(state.original.createdOn).toISOString()}`,
            `original_commit_message_b64=${Buffer.from(state.original.commitMessage, "utf8").toString("base64")}`,
            `run_marker=${state.runMarker}`,
            `compensation_marker=${state.compensationMarker}`,
            `state_path=${statePath}`,
          ].join("\n") + "\n");
          NODE
          git cat-file -e "${{ github.event.workflow_run.head_sha }}^{commit}"
          if [ "$VARIABLE_STATE_PRESENT" = true ]; then
            state_file=../state-variable/staging-deploy-state.json
          else
            state_file=../state/staging-deploy-state.json
          fi
          original_release="$(node -p "require('$state_file').original.release")"
          candidate_release="$(node -p "require('$state_file').candidateRelease")"
          git cat-file -e "$original_release^{commit}"
          git cat-file -e "$candidate_release^{commit}"
          git merge-base --is-ancestor "$original_release" "$candidate_release"
          git merge-base --is-ancestor "$candidate_release" "${{ github.event.workflow_run.head_sha }}"
      - name: Retry both single-use staging browser rendezvous cleanups in the watchdog
        id: watchdog_real_browser_rendezvous_cleanup
        if: always() && steps.watchdog_state.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          GITHUB_REPOSITORY: Vnd93/gaiatec-cms
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          EVIDENCE_SALT: ${{ secrets.EVIDENCE_SALT }}
        run: |
          set -euo pipefail
          cleanup_status=0
          node scripts/ev2/phase12/run-real-browser-attestation-consumer.mjs clear-challenge \
            --environment staging \
            --run-id "${{ github.event.workflow_run.id }}" \
            --run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --allow-missing || cleanup_status=1
          node scripts/ev2/phase12/real-browser-attestation-store.mjs clear \
            --environment staging \
            --candidate-sha "${{ steps.watchdog_state.outputs.candidate_release }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --control-sha "${{ github.event.workflow_run.head_sha }}" \
            --allow-missing || cleanup_status=1
          exit "$cleanup_status"
      - name: Prove a pre-mutation parent is safe before clearing its recovery state
        id: pre_mutation_ready
        if: always() && needs.classify-parent-run.outputs.mutation_mode == 'pre-mutation'
        env:
          VARIABLE_STATE_OUTCOME: ${{ steps.variable_state.outcome }}
          VARIABLE_STATE_PRESENT: ${{ steps.variable_state.outputs.state_present }}
          ARTIFACT_STATE_OUTCOME: ${{ steps.artifact_state.outcome }}
          STATE_VALIDATION_OUTCOME: ${{ steps.watchdog_state.outcome }}
          BROWSER_CLEANUP_OUTCOME: ${{ steps.watchdog_real_browser_rendezvous_cleanup.outcome }}
        run: |
          set -euo pipefail
          test "$VARIABLE_STATE_OUTCOME" = success
          test "$ARTIFACT_STATE_OUTCOME" = skipped
          if [ "$VARIABLE_STATE_PRESENT" = true ]; then
            test "$STATE_VALIDATION_OUTCOME" = success
            test "$BROWSER_CLEANUP_OUTCOME" = success
          else
            test "$VARIABLE_STATE_PRESENT" = false
            test "$STATE_VALIDATION_OUTCOME" = skipped
            test "$BROWSER_CLEANUP_OUTCOME" = skipped
          fi
      - name: Clear redundant state after proving a pre-mutation parent is safe
        id: clear_pre_mutation_recovery_state
        if: >-
          always() && needs.classify-parent-run.outputs.mutation_mode == 'pre-mutation' &&
          steps.pre_mutation_ready.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
          STATE_PRESENT: ${{ steps.variable_state.outputs.state_present }}
        run: |
          set -euo pipefail
          state_argument=()
          if [ "$STATE_PRESENT" = true ]; then
            state_argument=(--file "${{ steps.watchdog_state.outputs.state_path }}")
          fi
          node scripts/ev2/phase12/recovery-state-store.mjs clear \
            --kind staging-deploy "${state_argument[@]}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --control-sha "${{ github.event.workflow_run.head_sha }}"
      - name: Finalize the watchdog without staging mutation for a pre-mutation parent
        id: pre_mutation_finalize
        if: always() && needs.classify-parent-run.outputs.mutation_mode == 'pre-mutation'
        env:
          PRE_MUTATION_READY_OUTCOME: ${{ steps.pre_mutation_ready.outcome }}
          STATE_CLEAR_OUTCOME: ${{ steps.clear_pre_mutation_recovery_state.outcome }}
        run: |
          set -euo pipefail
          test "$PRE_MUTATION_READY_OUTCOME" = success
          test "$STATE_CLEAR_OUTCOME" = success
      - name: Recheck the canonical alias before any watchdog compensation
        id: watchdog_decision
        if: >-
          always() && needs.classify-parent-run.outputs.mutation_mode != 'pre-mutation' &&
          steps.watchdog_state.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        working-directory: control
        env: &staging_watchdog_environment
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gaiatec-cms-staging
          CLOUDFLARE_PAGES_BRANCH: ev2-g17-canary
          STAGING_ORIGINAL_DEPLOYMENT: ${{ steps.watchdog_state.outputs.original_deployment }}
          STAGING_ORIGINAL_RELEASE: ${{ steps.watchdog_state.outputs.original_release }}
          STAGING_ORIGINAL_CREATED_ON: ${{ steps.watchdog_state.outputs.original_created_on }}
          STAGING_ORIGINAL_COMMIT_MESSAGE_B64: ${{ steps.watchdog_state.outputs.original_commit_message_b64 }}
          STAGING_CANDIDATE_RELEASE: ${{ steps.watchdog_state.outputs.candidate_release }}
          STAGING_RUN_MARKER: ${{ steps.watchdog_state.outputs.run_marker }}
          STAGING_COMPENSATION_MARKER: ${{ steps.watchdog_state.outputs.compensation_marker }}
        run: node scripts/ev2/phase12/staging-pages-state.mjs decide
      - name: Checkout the exact candidate for watchdog forward-backend recovery
        id: watchdog_backend_checkout
        if: >-
          always() && steps.watchdog_state.outcome == 'success' &&
          steps.watchdog_decision.outcome == 'success' &&
          (steps.watchdog_decision.outputs.action == 'already-original' ||
          steps.watchdog_decision.outputs.action == 'restore-original')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.watchdog_state.outputs.candidate_release }}
          fetch-depth: 0
          path: candidate-recovery
      - name: Install pinned Supabase CLI for watchdog forward-backend recovery
        id: watchdog_supabase_cli
        if: always() && steps.watchdog_backend_checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0
      - name: Converge exact candidate staging migrations in the watchdog
        id: watchdog_recovery_database
        if: always() && steps.watchdog_supabase_cli.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: candidate-recovery
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p outputs
          test "$STAGING_SUPABASE_PROJECT_REF" = "glcqsosxwgmlhzgcsnzv"
          test "$(git rev-parse HEAD)" = "${{ steps.watchdog_state.outputs.candidate_release }}"
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF" --yes
          supabase db push --linked --include-all --dry-run
          supabase db push --linked --include-all --yes
          node scripts/ev2/phase12/verify-staging-database.mjs --source . |
            tee outputs/g12-staging-database-watchdog-recovery.json
      - name: Converge exact candidate staging configuration in the watchdog
        id: watchdog_recovery_configuration
        if: always() && steps.watchdog_recovery_database.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: candidate-recovery
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_ALLOWED_ORIGINS: >-
            https://gaiatec-cms-staging.pages.dev,
            https://ev2-g17-canary.gaiatec-cms-staging.pages.dev,
            https://ev2-g12-canary.gaiatec-cms-staging.pages.dev,
            https://ev2-g16-csp-canary.gaiatec-cms-staging.pages.dev,
            https://ev2-g12-rollback-compat.gaiatec-cms-staging.pages.dev
          STAGING_ALLOWED_HOSTNAMES: >-
            gaiatec-cms-staging.pages.dev,
            ev2-g17-canary.gaiatec-cms-staging.pages.dev,
            ev2-g12-canary.gaiatec-cms-staging.pages.dev,
            ev2-g16-csp-canary.gaiatec-cms-staging.pages.dev,
            ev2-g12-rollback-compat.gaiatec-cms-staging.pages.dev
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            ALLOWED_ORIGINS="$STAGING_ALLOWED_ORIGINS" \
            TURNSTILE_ALLOWED_HOSTNAMES="$STAGING_ALLOWED_HOSTNAMES" \
            PUBLIC_SITE_ORIGIN=https://ev2-g17-canary.gaiatec-cms-staging.pages.dev \
            CMS_ENVIRONMENT=staging \
            CMS_RELEASE_SHA="${{ steps.watchdog_state.outputs.candidate_release }}" \
            CMS_ADMIN_ORIGIN=https://ev2-g17-canary.gaiatec-cms-staging.pages.dev \
            CMS_ADMIN_URL=https://ev2-g17-canary.gaiatec-cms-staging.pages.dev/admin \
            CONTACT_CAPTCHA_ALWAYS=true \
            TURNSTILE_EXPECTED_ACTION=lead_capture
          node scripts/ev2/phase12/configure-staging-auth.mjs
          node scripts/ev2/phase12/configure-staging-ai-provider-secrets.mjs |
            tee outputs/g12-staging-ai-provider-watchdog-recovery.json
      - name: Converge exact candidate Edge Functions in the watchdog
        id: watchdog_recovery_functions
        if: always() && steps.watchdog_recovery_configuration.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 90
        working-directory: candidate-recovery
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p outputs
          node scripts/ev2/phase12/deploy-staging-functions.mjs \
            --source . --rollback-source . \
            --candidate "${{ steps.watchdog_state.outputs.candidate_release }}" \
            --report outputs/g12-staging-function-watchdog-recovery.json
          supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF" --output json > \
            outputs/g12-staging-functions-watchdog-recovery.json
          node scripts/ev2/phase12/verify-production-functions.mjs \
            --file outputs/g12-staging-functions-watchdog-recovery.json \
            --receipt outputs/g12-staging-function-watchdog-recovery.json \
            --source . --candidate "${{ steps.watchdog_state.outputs.candidate_release }}" \
            --environment staging --project-ref "$STAGING_SUPABASE_PROJECT_REF"
      - name: Download the exact sealed recovery artifact when the owned candidate remains active
        id: recovery_artifact
        if: >-
          always() && steps.watchdog_decision.outputs.action == 'restore-original' &&
          steps.watchdog_recovery_functions.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-recovery-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          digest-mismatch: error
          path: recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install the exact locked Wrangler only when compensation is required
        if: >-
          always() && steps.watchdog_decision.outputs.action == 'restore-original' &&
          steps.recovery_artifact.outcome == 'success'
        timeout-minutes: 10
        working-directory: control
        run: npm ci --ignore-scripts
      - name: Compensate only the still-canonical candidate owned by the incomplete run
        id: watchdog_compensation
        if: >-
          always() && steps.watchdog_decision.outputs.action == 'restore-original' &&
          steps.watchdog_recovery_functions.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: true
        working-directory: control
        env: *staging_watchdog_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery/dist
          --seal ../recovery/outputs/staging-baseline-dist-seal.json
      - name: Retry ambiguous watchdog compensation after a fresh canonical recheck
        id: watchdog_compensation_retry
        if: >-
          always() && steps.watchdog_decision.outputs.action == 'restore-original' &&
          steps.watchdog_recovery_functions.outcome == 'success' &&
          steps.recovery_artifact.outcome == 'success' &&
          steps.watchdog_compensation.outcome != 'success'
        timeout-minutes: 15
        continue-on-error: true
        working-directory: control
        env: *staging_watchdog_environment
        run: >-
          node scripts/ev2/phase12/staging-pages-state.mjs compensate
          --dist ../recovery/dist
          --seal ../recovery/outputs/staging-baseline-dist-seal.json
      - name: Terminal canonical recheck after watchdog reconciliation
        id: watchdog_terminal_canonical
        if: >-
          always() &&
          steps.watchdog_recovery_functions.outcome == 'success' &&
          (steps.watchdog_decision.outputs.action == 'already-original' ||
          steps.watchdog_compensation.outcome == 'success' ||
          steps.watchdog_compensation_retry.outcome == 'success')
        continue-on-error: true
        timeout-minutes: 3
        working-directory: control
        env: *staging_watchdog_environment
        run: node scripts/ev2/phase12/staging-pages-state.mjs assert-original
      - name: Probe the restored staging frontend against the forward backend
        id: watchdog_probe
        if: >-
          always() &&
          steps.watchdog_backend_checkout.outcome == 'success' &&
          steps.watchdog_supabase_cli.outcome == 'success' &&
          steps.watchdog_recovery_database.outcome == 'success' &&
          steps.watchdog_recovery_configuration.outcome == 'success' &&
          steps.watchdog_recovery_functions.outcome == 'success' &&
          steps.watchdog_terminal_canonical.outcome == 'success' &&
          (steps.watchdog_decision.outputs.action == 'already-original' ||
          steps.watchdog_compensation.outcome == 'success' ||
          steps.watchdog_compensation_retry.outcome == 'success')
        timeout-minutes: 10
        working-directory: control
        env:
          EV2_G12_ORIGIN: https://ev2-g17-canary.gaiatec-cms-staging.pages.dev
          EV2_G12_EXPECTED_SHA: ${{ steps.watchdog_state.outputs.original_release }}
          EV2_G12_ENVIRONMENT: staging
          EV2_G12_PROBE_PROFILE: full
          EV2_G12_SAMPLE_COUNT: "20"
          # Redeploying the function inventory leaves every public route cold, which inflates the
          # tail while the p50 stays healthy. Warmup exists to keep that out of the measurement.
          EV2_G12_WARMUP_SAMPLES_PER_ROUTE: "20"
          EV2_G12_REPORT_PATH: ../g12-staging-watchdog-probe.json
          # This target was deployed seconds ago, so the probe has to wait for the alias to
          # converge before it can measure it. Only the wait changes; every assertion, the
          # sample size and the latency budget stay exactly as they are.
          EV2_G12_READINESS_ATTEMPTS: "20"
          EV2_G12_READINESS_INTERVAL_MS: "4000"
        run: node scripts/ev2/phase12/rollout-probe.mjs
      - name: Upload mandatory watchdog terminal evidence
        id: watchdog_evidence_upload
        if: always() && steps.watchdog_probe.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-watchdog-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            g12-staging-watchdog-probe.json
            candidate-recovery/outputs/g12-staging-database-watchdog-recovery.json
            candidate-recovery/outputs/g12-staging-ai-provider-watchdog-recovery.json
            candidate-recovery/outputs/g12-staging-function-watchdog-recovery.json
            candidate-recovery/outputs/g12-staging-functions-watchdog-recovery.json
          if-no-files-found: error
          retention-days: 30
      - name: Compare and clear redundant deploy state after watchdog evidence
        id: clear_recovery_state
        if: >-
          always() && steps.watchdog_state.outcome == 'success' &&
          steps.watchdog_decision.outcome == 'success' &&
          steps.watchdog_backend_checkout.outcome == 'success' &&
          steps.watchdog_supabase_cli.outcome == 'success' &&
          steps.watchdog_recovery_database.outcome == 'success' &&
          steps.watchdog_recovery_configuration.outcome == 'success' &&
          steps.watchdog_recovery_functions.outcome == 'success' &&
          steps.watchdog_real_browser_rendezvous_cleanup.outcome == 'success' &&
          steps.watchdog_terminal_canonical.outcome == 'success' &&
          steps.watchdog_probe.outcome == 'success' &&
          steps.watchdog_evidence_upload.outcome == 'success'
        timeout-minutes: 5
        working-directory: control
        env:
          RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_STATE_HMAC_KEY: ${{ secrets.EVIDENCE_SALT }}
        run: >-
          node scripts/ev2/phase12/recovery-state-store.mjs clear
          --kind staging-deploy --file "${{ steps.watchdog_state.outputs.state_path }}"
          --run-id "${{ github.event.workflow_run.id }}"
          --run-attempt "${{ github.event.workflow_run.run_attempt }}"
          --control-sha "${{ github.event.workflow_run.head_sha }}"
      - name: Fail closed if pre-mutation watchdog cleanup was not terminal
        if: >-
          always() && needs.classify-parent-run.outputs.mutation_mode == 'pre-mutation' &&
          steps.pre_mutation_finalize.outcome != 'success'
        run: exit 1
      - name: Fail closed if the watchdog could not prove the original staging release
        if: >-
          always() && needs.classify-parent-run.outputs.mutation_mode != 'pre-mutation' &&
          ((needs.classify-parent-run.outputs.mutation_mode != 'armed' &&
          needs.classify-parent-run.outputs.mutation_mode != 'ambiguous') ||
          steps.watchdog_state.outcome != 'success' ||
          steps.watchdog_decision.outcome != 'success' ||
          steps.watchdog_real_browser_rendezvous_cleanup.outcome != 'success' ||
          steps.watchdog_probe.outcome != 'success' ||
          steps.watchdog_evidence_upload.outcome != 'success' ||
          steps.clear_recovery_state.outcome != 'success' ||
          steps.watchdog_backend_checkout.outcome != 'success' ||
          steps.watchdog_supabase_cli.outcome != 'success' ||
          steps.watchdog_recovery_database.outcome != 'success' ||
          steps.watchdog_recovery_configuration.outcome != 'success' ||
          steps.watchdog_recovery_functions.outcome != 'success' ||
          steps.watchdog_terminal_canonical.outcome != 'success' ||
          (steps.watchdog_decision.outputs.action == 'restore-original' &&
          steps.watchdog_compensation.outcome != 'success' &&
          steps.watchdog_compensation_retry.outcome != 'success'))
        run: exit 1
