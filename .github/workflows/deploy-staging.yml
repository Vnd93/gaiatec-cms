name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit aprovado para staging
        required: true
        default: Remodelagem
      ev2_draft_v2_candidate:
        description: Habilitar somente o adapter cliente candidato EV2.2
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:staging
        env:
          VITE_RELEASE: ${{ github.sha }}
          VITE_CMS_ENVIRONMENT: staging
          VITE_EV2_DRAFT_V2_CANDIDATE: ${{ inputs.ev2_draft_v2_candidate }}
      - run: npm run artifact:manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gaiatec-cms-staging --branch Remodelagem
      - run: npm run smoke:http -- "${{ steps.deploy.outputs.deployment-url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.sha }}
          path: dist
          retention-days: 30
